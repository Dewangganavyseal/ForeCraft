<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Cutscene 3D — Mimpi yang Terbakar (Minecraft Style)</title>
<style>
 html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:"Segoe UI",Arial,sans-serif}
 #scene{position:fixed;inset:0}
 .bar{position:fixed;left:0;width:100%;height:8.5vh;background:#000;z-index:20}
 #barTop{top:0}#barBot{bottom:0}
 #vignette{position:fixed;inset:0;z-index:15;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 52%,rgba(0,0,0,.78)100%)}
 #heat{position:fixed;inset:0;z-index:14;pointer-events:none;opacity:0;
  background:radial-gradient(ellipse at center,rgba(255,90,10,.20),rgba(120,10,0,.38)100%)}
 #leaves{position:fixed;inset:0;z-index:16;pointer-events:none;opacity:0;transition:opacity .9s;
  background:
   radial-gradient(circle at 6% 18%,rgba(10,40,12,.97)0 9vw,transparent 16vw),
   radial-gradient(circle at 94% 12%,rgba(8,34,10,.97)0 11vw,transparent 18vw),
   radial-gradient(circle at 10% 88%,rgba(9,38,11,.97)0 12vw,transparent 19vw),
   radial-gradient(circle at 90% 90%,rgba(10,42,12,.97)0 11vw,transparent 18vw),
   radial-gradient(circle at 50% -6%,rgba(12,46,14,.95)0 10vw,transparent 17vw),
   radial-gradient(circle at 50% 106%,rgba(12,46,14,.95)0 10vw,transparent 17vw),
   radial-gradient(circle at -4% 55%,rgba(9,36,10,.95)0 9vw,transparent 15vw),
   radial-gradient(circle at 104% 50%,rgba(9,36,10,.95)0 9vw,transparent 15vw)}
 #caption{position:fixed;bottom:10.5vh;left:0;width:100%;text-align:center;z-index:30;color:#f5ede2;
  font-size:clamp(15px,2.1vw,25px);font-style:italic;letter-spacing:.06em;opacity:0;transition:opacity .6s;
  text-shadow:0 2px 10px #000,0 0 24px rgba(0,0,0,.9);padding:0 8vw;box-sizing:border-box}
 #caption.show{opacity:1}
 #bubble{position:fixed;z-index:35;display:none;background:#fdfdf2;color:#26221c;border:3px solid #26221c;
  border-radius:14px;padding:12px 16px;max-width:min(380px,72vw);font-size:clamp(13px,1.55vw,17px);
  line-height:1.5;box-shadow:0 8px 22px rgba(0,0,0,.5);font-weight:600}
 #bubble:after{content:"";position:absolute;bottom:-16px;left:38px;width:0;height:0;
  border:16px solid transparent;border-top-color:#26221c;border-bottom:0}
 #bubble:before{content:"";position:absolute;bottom:-11px;left:42px;width:0;height:0;z-index:1;
  border:12px solid transparent;border-top-color:#fdfdf2;border-bottom:0}
 #fade{position:fixed;inset:0;background:#000;z-index:40;pointer-events:none;opacity:1;transition:opacity 1.4s ease}
 #titleCard{position:fixed;top:12vh;left:0;width:100%;text-align:center;z-index:31;color:#ffd9a8;opacity:0;
  transition:opacity 1.2s;font-size:clamp(24px,4.6vw,54px);letter-spacing:.45em;pointer-events:none;
  text-shadow:0 0 30px rgba(255,120,30,.55),0 3px 12px #000}
 #titleCard.show{opacity:.92}
 .uiBtn{position:fixed;z-index:55;background:rgba(0,0,0,.45);color:#cfc7ba;border:1px solid rgba(255,255,255,.25);
  padding:7px 14px;border-radius:8px;cursor:pointer;font-size:13px;letter-spacing:.05em}
 .uiBtn:hover{background:rgba(255,255,255,.16)}
 #skipBtn{top:calc(8.5vh + 12px);right:14px}
 #muteBtn{top:calc(8.5vh + 12px);right:110px}
 #start{position:fixed;inset:0;z-index:60;background:radial-gradient(circle at 50% 35%,#1c0b06,#050203 70%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;color:#e8dcc8;text-align:center}
 #start h1{font-size:clamp(24px,4.4vw,50px);letter-spacing:.3em;margin:0;color:#ffb066;
  text-shadow:0 0 34px rgba(255,110,20,.6)}
 #start h2{margin:0;font-weight:400;font-size:clamp(12px,1.5vw,16px);color:#b9a88f;letter-spacing:.12em}
 #playBtn{font-size:18px;padding:14px 42px;border-radius:10px;background:linear-gradient(#c8541e,#8e3210);
  color:#fff;border:1px solid #ffb066;cursor:pointer;letter-spacing:.2em;box-shadow:0 0 34px rgba(255,110,30,.35)}
 #playBtn:hover{filter:brightness(1.15)}
 #hint{font-size:12px;color:#7d715f}
 #endCard{position:fixed;inset:0;z-index:58;background:rgba(0,0,0,.92);display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:18px;color:#e8dcc8;text-align:center}
 #endCard h1{letter-spacing:.4em;color:#ffd9a8;font-size:clamp(22px,3.6vw,42px);margin:0;
  text-shadow:0 0 26px rgba(255,140,40,.5)}
 #endCard p{margin:0;color:#9b8d78;font-size:14px;padding:0 20px}
</style>
</head>
<body>
<div id="scene"></div>
<div id="barTop" class="bar"></div><div id="barBot" class="bar"></div>
<div id="vignette"></div><div id="heat"></div><div id="leaves"></div>
<div id="titleCard">MIMPI YANG TERBAKAR</div>
<div id="caption"></div>
<div id="bubble"></div>
<div id="fade"></div>
<button id="muteBtn" class="uiBtn" style="display:none">🔊 Suara</button>
<button id="skipBtn" class="uiBtn" style="display:none">Lewati ▸▸</button>

<div id="start">
  <h2>CUTSCENE THREE.JS • STYLE MINECRAFT</h2>
  <h1>MIMPI YANG TERBAKAR</h1>
  <h2>Kisah anak terakhir dari desanya yang hangus</h2>
  <button id="playBtn">▶ PUTAR CUTSCENE</button>
  <div id="hint">Gunakan headphone untuk pengalaman maksimal 🎧</div>
</div>

<div id="endCard">
  <h1>— SELESAI —</h1>
  <p>"Baiklah! Waktunya kita mencari persediaan makanan!"</p>
  <button id="replayBtn" class="uiBtn" style="position:static;font-size:16px;padding:11px 26px">⟳ Putar Ulang</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<!-- ★ MODEL PLAYER DEWASA — pakai model player milik game (tanpa duplikasi file) -->
<script src="../js/player/player_model.js"></script>
<script>
"use strict";
/* ============================== UTIL ============================== */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,k)=>a+(b-a)*k;
const sstep=k=>{k=clamp(k,0,1);return k*k*(3-2*k)};
const rnd=(a,b)=>a+Math.random()*(b-a);
const $=id=>document.getElementById(id);
function lerpAngle(a,b,k){let d=(b-a)%(Math.PI*2);if(d>Math.PI)d-=Math.PI*2;if(d<-Math.PI)d+=Math.PI*2;return a+d*k;}

const titleEl=$('titleCard'),capEl=$('caption'),bubbleEl=$('bubble'),fadeEl=$('fade'),
      leavesEl=$('leaves'),heatEl=$('heat'),endEl=$('endCard'),startEl=$('start'),
      skipBtn=$('skipBtn'),muteBtn=$('muteBtn');

/* ============================== MODE EMBED (dalam game) ==============================
   Bila dibuka dengan "?embed=1" (oleh Forecraft saat New Game), cutscene otomatis
   diputar tanpa layar mulai, dan mengirim postMessage ke jendela induk saat selesai
   atau dilewati, supaya game bisa langsung dimulai. */
const EMBED=new URLSearchParams(location.search).get('embed')==='1';
function notifyParent(done){
 try{
  if(window.parent&&window.parent!==window)
   window.parent.postMessage({type:'forecraft-cutscene',done:!!done},'*');
 }catch(e){}
}
function finishEmbed(){
 if(!EMBED)return;
 playing=false;
 capEl.classList.remove('show');
 bubbleEl.style.display='none';
 skipBtn.style.display='none';muteBtn.style.display='none';
 fadeTo(1,1.0);
 setTimeout(()=>notifyParent(true),1250);
}

/* ============================== RENDERER ============================== */
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
$('scene').appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0d0403);
scene.fog=new THREE.FogExp2(0x140504,0.024);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.1,700);

/* ============================== TEKSTUR PIXEL ============================== */
function canvasTex(size,draw){const c=document.createElement('canvas');c.width=c.height=size;
 draw(c.getContext('2d'),size);const t=new THREE.CanvasTexture(c);
 t.magFilter=t.minFilter=THREE.NearestFilter;t.encoding=THREE.sRGBEncoding;return t;}
const px=(g,x,y,c)=>{g.fillStyle=c;g.fillRect(x,y,1,1);};

/* ---- wajah (untuk anak & fallback) ---- */
const boyFaceTex=canvasTex(8,g=>{
 g.fillStyle='#f2c99b';g.fillRect(0,0,8,8);
 g.fillStyle='#5a3a1e';g.fillRect(0,0,8,2);px(g,0,2,'#5a3a1e');px(g,7,2,'#5a3a1e');px(g,3,2,'#5a3a1e');px(g,4,2,'#5a3a1e');
 g.fillStyle='#fff';g.fillRect(1,3,2,2);g.fillRect(5,3,2,2);
 px(g,2,4,'#2b1c10');px(g,5,4,'#2b1c10');
 px(g,1,5,'#8fd0ff');px(g,1,6,'#8fd0ff');px(g,6,5,'#8fd0ff');
 px(g,3,6,'#a3552e');px(g,4,6,'#a3552e');
});
function manFace(open){return canvasTex(8,g=>{
 g.fillStyle='#f0c493';g.fillRect(0,0,8,8);
 g.fillStyle='#4a2f16';g.fillRect(0,0,8,1);
 px(g,0,1,'#4a2f16');px(g,1,1,'#4a2f16');px(g,4,1,'#4a2f16');px(g,6,1,'#4a2f16');px(g,7,1,'#4a2f16');
 if(open){g.fillStyle='#fff';g.fillRect(1,3,2,1);g.fillRect(5,3,2,1);px(g,2,3,'#23364f');px(g,5,3,'#23364f');}
 else{px(g,1,3,'#7a5a3a');px(g,2,3,'#7a5a3a');px(g,5,3,'#7a5a3a');px(g,6,3,'#7a5a3a');}
 px(g,3,4,'#d9a86f');px(g,4,4,'#d9a86f');
 px(g,3,6,'#8a4a30');px(g,4,6,'#8a4a30');
});}
const manFaceClosed=manFace(false),manFaceOpen=manFace(true);
const orcFaceTex=canvasTex(8,g=>{
 g.fillStyle='#8f2418';g.fillRect(0,0,8,8);
 g.fillStyle='#5f150e';g.fillRect(0,6,8,2);
 g.fillStyle='#3f0e08';g.fillRect(1,2,2,1);g.fillRect(5,2,2,1);
 g.fillStyle='#ffd23e';g.fillRect(1,3,2,1);g.fillRect(5,3,2,1);
 g.fillStyle='#6b1a10';g.fillRect(2,4,4,2);
 px(g,3,5,'#2f0a05');px(g,4,5,'#2f0a05');
 g.fillStyle='#2f0a05';g.fillRect(2,6,4,1);
 px(g,1,5,'#f2ead8');px(g,1,6,'#f2ead8');px(g,6,5,'#f2ead8');px(g,6,6,'#f2ead8');
});
const glowTex=canvasTex(64,g=>{
 const gr=g.createRadialGradient(32,32,2,32,32,30);
 gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(0.35,'rgba(255,255,255,.6)');
 gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,64,64);
});

/* ---- ★ TEKSTUR BLOK MINECRAFT 16x16 ---- */
const DIRT_C=['#96613a','#8a5834','#7a4e2e','#a06a3f','#6e4629','#8f5c36'];
const GRASS_C=['#7abd4c','#6fb244','#84c754','#74bb47','#68ac3e','#8fd05c'];
function drawGrassTop(g){for(let y=0;y<16;y++)for(let x=0;x<16;x++){
 g.fillStyle=GRASS_C[(Math.random()*GRASS_C.length)|0];g.fillRect(x,y,1,1);}}
function drawDirt(g){for(let y=0;y<16;y++)for(let x=0;x<16;x++){
 g.fillStyle=DIRT_C[(Math.random()*DIRT_C.length)|0];g.fillRect(x,y,1,1);}}
const grassTopTex=canvasTex(16,drawGrassTop);            // atas blok & blok dekorasi
const groundGrassTex=canvasTex(16,drawGrassTop);         // bidang tanah (repeat)
groundGrassTex.wrapS=groundGrassTex.wrapT=THREE.RepeatWrapping;groundGrassTex.repeat.set(300,300);
const dirtBlockTex=canvasTex(16,drawDirt);
const grassSideTex=canvasTex(16,g=>{
 drawDirt(g);
 for(let x=0;x<16;x++){g.fillStyle=GRASS_C[(Math.random()*GRASS_C.length)|0];
  g.fillRect(x,0,1,1);g.fillRect(x,1,1,1);
  if(Math.random()<0.85)g.fillRect(x,2,1,1);
  if(Math.random()<0.35)g.fillRect(x,3,1,1);}});
const leafTex=canvasTex(16,g=>{
 g.clearRect(0,0,16,16);
 const cs=['#3f8f2f','#357a28','#4aa23a','#2f6f24','#57b044'];
 for(let y=0;y<16;y++)for(let x=0;x<16;x++){
  if(Math.random()<0.14)continue; // lubang transparan khas daun Minecraft
  g.fillStyle=cs[(Math.random()*cs.length)|0];g.fillRect(x,y,1,1);}});
const barkTex=canvasTex(16,g=>{
 const cs=['#6b4a2b','#5d3f24','#77552f','#4f3620','#6e4c2c'];
 for(let x=0;x<16;x++){const base=cs[(Math.random()*cs.length)|0];
  for(let y=0;y<16;y++){
   g.fillStyle=Math.random()<0.15?'#4a311c':(Math.random()<0.15?'#7f5a33':base);
   g.fillRect(x,y,1,1);}}});
const ringsTex=canvasTex(16,g=>{
 g.fillStyle='#6b4a2b';g.fillRect(0,0,16,16);
 g.fillStyle='#b08a55';g.fillRect(2,2,12,12);
 g.fillStyle='#9a7644';g.fillRect(4,4,8,8);
 g.fillStyle='#b08a55';g.fillRect(6,6,4,4);
 g.fillStyle='#7f5a33';g.fillRect(7,7,2,2);
 for(let i=0;i<30;i++){g.fillStyle=Math.random()<0.5?'#a37e49':'#8a6a3d';
  g.fillRect(2+((Math.random()*12)|0),2+((Math.random()*12)|0),1,1);}});

/* ---- tekstur desa ---- */
const dirtTex=canvasTex(64,g=>{g.fillStyle='#2c1d13';g.fillRect(0,0,64,64);
 const cs=['#241710','#3a281a','#1f130b','#332216'];
 for(let i=0;i<430;i++){g.fillStyle=cs[(Math.random()*4)|0];g.fillRect((Math.random()*64)|0,(Math.random()*64)|0,2,2);}});
dirtTex.wrapS=dirtTex.wrapT=THREE.RepeatWrapping;dirtTex.repeat.set(26,26);
const woodTex=canvasTex(32,g=>{g.fillStyle='#7a5230';g.fillRect(0,0,32,32);
 for(let y=0;y<32;y+=8){g.fillStyle='#5f3e22';g.fillRect(0,y,32,1);}
 for(let i=0;i<40;i++){g.fillStyle='#6b4628';g.fillRect((Math.random()*32)|0,(Math.random()*32)|0,2,1);}});

/* ============================== HELPER VOXEL ============================== */
function B(w,h,d,c,x=0,y=0,z=0){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),
  (typeof c==='number')?new THREE.MeshLambertMaterial({color:c}):c);
 m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;return m;}

/* ============================== RIG (anak & fallback) ============================== */
function makeRig(o){
 const s=o.scale||1,hs=o.headScale||1,P=0.13*s;
 const skinM=new THREE.MeshLambertMaterial({color:o.skin});
 const shirtM=new THREE.MeshLambertMaterial({color:o.shirt});
 const pantsM=new THREE.MeshLambertMaterial({color:o.pants});
 const hairM=new THREE.MeshLambertMaterial({color:o.hair||0x333333});
 const armM=new THREE.MeshLambertMaterial({color:o.arm!==undefined?o.arm:o.shirt});
 const bootM=new THREE.MeshLambertMaterial({color:o.boot!==undefined?o.boot:o.pants});
 const root=new THREE.Group(),hips=new THREE.Group();
 hips.position.y=12*P;root.add(hips);
 hips.add(B(8*P,12*P,4*P,shirtM,0,6*P,0));
 const headG=new THREE.Group();headG.position.y=12*P;hips.add(headG);
 const HS=8*P*hs,faceM=new THREE.MeshLambertMaterial({map:o.face});
 const head=new THREE.Mesh(new THREE.BoxGeometry(HS,HS,HS),[skinM,skinM,hairM,skinM,faceM,hairM]);
 head.position.y=HS/2;headG.add(head);
 headG.add(B(HS*1.06,HS*0.3,HS*1.06,hairM,0,HS*0.55,0));
 function limb(mat,len,px,py,tip){const gp=new THREE.Group();gp.position.set(px,py,0);
  gp.add(B(4*P,len,4*P,mat,0,-len/2,0));
  gp.add(B(4*P,3*P,4*P,tip,0,-len+1.5*P,0));return gp;}
 const armL=limb(armM,12*P,-6*P,11*P,skinM),armR=limb(armM,12*P,6*P,11*P,skinM);
 const legL=limb(bootM,12*P,-2*P,0,bootM),legR=limb(bootM,12*P,2*P,0,bootM);
 hips.add(armL,armR,legL,legR);
 return {root,hips,headG,head,armL,armR,legL,legR,P,HS,faceM};
}
function resetPose(r){r.hips.rotation.set(0,0,0);r.headG.rotation.set(0,0,0);
 [r.armL,r.armR,r.legL,r.legR].forEach(a=>a.rotation.set(0,0,0));}

/* ============================== DUNIA: DESA TERBAKAR ============================== */
const village=new THREE.Group();scene.add(village);
const groundV=new THREE.Mesh(new THREE.PlaneGeometry(300,300),new THREE.MeshLambertMaterial({map:dirtTex}));
groundV.rotation.x=-Math.PI/2;groundV.receiveShadow=true;village.add(groundV);

const windows=[],fires=[],smokes=[];
function makeHouse(x,z,rot,ruined){
 const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=rot;
 const wood=new THREE.MeshLambertMaterial({map:woodTex,color:ruined?0x77685e:0xffffff});
 const dark=new THREE.MeshLambertMaterial({color:ruined?0x3f352e:0x5f3e22});
 if(!ruined){
  g.add(B(7,4.6,6,wood,0,2.3,0));
  [[-3.5,-3],[3.5,-3],[-3.5,3],[3.5,3]].forEach(p=>g.add(B(0.55,4.8,0.55,dark,p[0],2.4,p[1])));
  g.add(B(1.7,2.7,0.25,dark,-0.8,1.35,3.0));
  g.add(B(7.9,0.7,6.9,dark,0,4.95,0));
  g.add(B(6.0,0.7,5.2,dark,0,5.65,0));
  g.add(B(4.0,0.7,3.4,dark,0,6.35,0));
  const winM1=new THREE.MeshBasicMaterial({color:0xff8822}),winM2=new THREE.MeshBasicMaterial({color:0xff8822});
  g.add(B(0.95,0.95,0.12,winM1,2.2,2.7,3.02));g.add(B(0.95,0.95,0.12,winM2,-2.4,2.7,3.02));
  windows.push(winM1,winM2);
 }else{
  g.add(B(7,1.5,6,dark,0,0.75,0));g.rotation.z=rnd(-0.07,0.07);
  for(let i=0;i<9;i++){
   const d=B(rnd(0.7,2.1),rnd(0.4,1.0),rnd(0.7,1.9),Math.random()<0.5?wood:dark,
    rnd(-3.4,3.4),rnd(0.3,1.1),rnd(-3,3));
   d.rotation.set(rnd(-0.35,0.35),rnd(0,3),rnd(-0.35,0.35));g.add(d);}
  const wall=B(7,3,0.5,wood,0,1.3,-2.8);wall.rotation.x=-0.5;g.add(wall);
 }
 village.add(g);return g;
}
makeHouse(-9,-4,0.35,false); makeHouse(7,-9,-0.25,false);
makeHouse(2,-16,0.1,false);  makeHouse(14,6,0.55,false);
makeHouse(-3,10.5,-0.15,true); makeHouse(-15,3,-0.4,true);

function makeBarrel(x,z){const g=new THREE.Group();g.position.set(x,0,z);
 const body=new THREE.Mesh(new THREE.CylinderGeometry(0.55,0.55,1.15,10),
  new THREE.MeshLambertMaterial({color:0x7a5230}));body.position.y=0.58;body.castShadow=true;g.add(body);
 const bandM=new THREE.MeshLambertMaterial({color:0x3f3f44});
 [0.3,0.86].forEach(y=>{const b=new THREE.Mesh(new THREE.CylinderGeometry(0.585,0.585,0.09,10),bandM);
  b.position.y=y;g.add(b);});return g;}
village.add(makeBarrel(-0.4,7.2),makeBarrel(-2.0,7.9));

const well=new THREE.Group();well.position.set(3,0,1);
const ring=new THREE.Mesh(new THREE.CylinderGeometry(1.1,1.2,0.9,10,1,true),
 new THREE.MeshLambertMaterial({color:0x6e6e74,side:THREE.DoubleSide}));
ring.position.y=0.45;well.add(ring);
well.add(B(0.18,1.9,0.18,0x5f3e22,-1.0,1.35,0));
well.add(B(0.18,1.9,0.18,0x5f3e22,1.0,1.35,0));
well.add(B(2.4,0.16,0.16,0x5f3e22,0,2.3,0));
village.add(well);

function makeBushVillage(x,z,s=1){const g=new THREE.Group();g.position.set(x,0,z);

 for(let i=0;i<7;i++){const b=B(rnd(0.9,1.6)*s,rnd(0.7,1.2)*s,rnd(0.9,1.6)*s,c[i%4],

function makePoints(count,size,map,blending,opacity){
 const geo=new THREE.BufferGeometry();
 const pos=new Float32Array(count*3),col=new Float32Array(count*3);
 geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
 geo.setAttribute('color',new THREE.BufferAttribute(col,3));
 const mat=new THREE.PointsMaterial({size,map,transparent:true,opacity,depthWrite:false,
  blending,vertexColors:true,sizeAttenuation:true});
 const pts=new THREE.Points(geo,mat);pts.frustumCulled=false;
 return {pts,pos,col,geo,count};}
function makeFire(x,y,z,w,h,count){
 const S=makePoints(count||90,1.35,glowTex,THREE.AdditiveBlending,0.95);
 const life=new Float32Array(S.count),dur=new Float32Array(S.count),
  ox=new Float32Array(S.count),oz=new Float32Array(S.count),sw=new Float32Array(S.count);
 for(let i=0;i<S.count;i++){life[i]=Math.random();dur[i]=rnd(0.7,1.4);
  ox[i]=rnd(-w/2,w/2);oz[i]=rnd(-w/2,w/2);sw[i]=rnd(0,6.28);}
 S.pts.position.set(x,y,z);S.pts.renderOrder=5;
 S.update=(dt,t)=>{for(let i=0;i<S.count;i++){life[i]+=dt;
  if(life[i]>dur[i]){life[i]=0;dur[i]=rnd(0.7,1.4);ox[i]=rnd(-w/2,w/2);oz[i]=rnd(-w/2,w/2);}
  const k=life[i]/dur[i],j=i*3;
  S.pos[j]=ox[i]+Math.sin(t*3+sw[i])*0.35*k;S.pos[j+1]=k*h;S.pos[j+2]=oz[i]+Math.cos(t*2.6+sw[i])*0.3*k;
  const f=(1-k)*Math.min(1,k*6);
  S.col[j]=f;S.col[j+1]=(0.85-0.65*k)*f;S.col[j+2]=(0.35-0.33*k)*f;}
 S.geo.attributes.position.needsUpdate=true;S.geo.attributes.color.needsUpdate=true;};
 return S;}
function makeSmoke(x,y,z,w,count){
 const S=makePoints(count||40,3.6,glowTex,THREE.NormalBlending,0.26);
 const life=new Float32Array(S.count),dur=new Float32Array(S.count),
  ox=new Float32Array(S.count),oz=new Float32Array(S.count),sw=new Float32Array(S.count);
 for(let i=0;i<S.count;i++){life[i]=Math.random()*3;dur[i]=rnd(2.5,4.5);
  ox[i]=rnd(-w/2,w/2);oz[i]=rnd(-w/2,w/2);sw[i]=rnd(0,6.28);}
 S.pts.position.set(x,y,z);S.pts.renderOrder=3;
 S.update=(dt,t)=>{for(let i=0;i<S.count;i++){life[i]+=dt;
  if(life[i]>dur[i]){life[i]=0;ox[i]=rnd(-w/2,w/2);oz[i]=rnd(-w/2,w/2);}
  const k=life[i]/dur[i],j=i*3;
  S.pos[j]=ox[i]+Math.sin(t*0.7+sw[i])*(0.6+k*2.2)+k*3.5;
  S.pos[j+1]=k*16;S.pos[j+2]=oz[i]+Math.cos(t*0.6+sw[i])*(0.5+k*1.6);
  const g=0.15+0.10*(1-k);S.col[j]=g+0.06;S.col[j+1]=g;S.col[j+2]=g;}
 S.geo.attributes.position.needsUpdate=true;S.geo.attributes.color.needsUpdate=true;};
 return S;}

  if(Math.abs(dx)===r&&Math.abs(dz)===r&&Math.random()<skipC)continue;

  leafList.push({x:x+dx*s,y:ly*s+s/2,z:z+dz*s,s});}};

 const s1=AC.createBufferSource();s1.buffer=noiseBuf;s1.loop=true;
 const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=700;bp.Q.value=0.6;
 fireGain=AC.createGain();fireGain.gain.value=0;
 s1.connect(bp);bp.connect(fireGain);fireGain.connect(master);s1.start();
 const s2=AC.createBufferSource();s2.buffer=noiseBuf;s2.loop=true;s2.playbackRate.value=0.4;
 const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=300;

 s2.connect(lp);lp.connect(windGain);windGain.connect(master);s2.start();

 const lf=AC.createBiquadFilter();lf.type='lowpass';lf.frequency.value=120;
 droneGain=AC.createGain();droneGain.gain.value=0;
 o.connect(lf);lf.connect(droneGain);droneGain.connect(master);o.start();
}catch(e){AC=null;}}
function setAudioScene(s){if(!AC)return;const t=AC.currentTime;
 if(s==='village'){fireGain.gain.linearRampToValueAtTime(0.14,t+1.5);
  windGain.gain.linearRampToValueAtTime(0.04,t+1.5);droneGain.gain.linearRampToValueAtTime(0.05,t+2);}
 else{fireGain.gain.linearRampToValueAtTime(0,t+1.5);
  windGain.gain.linearRampToValueAtTime(0.015,t+1.5);droneGain.gain.linearRampToValueAtTime(0,t+1.5);}}
function curveK(k){const n=256,c=new Float32Array(n);
 for(let i=0;i<n;i++)c[i]=Math.tanh(k*(i*2/n-1));return c;}
function roar(){if(!AC)return;const t=AC.currentTime;
 const o=AC.createOscillator();o.type='sawtooth';
 o.frequency.setValueAtTime(75,t);o.frequency.exponentialRampToValueAtTime(28,t+1.4);
 const ws=AC.createWaveShaper();ws.curve=curveK(6);
 const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=500;
 const g=AC.createGain();g.gain.setValueAtTime(0.0001,t);
 g.gain.exponentialRampToValueAtTime(0.5,t+0.15);g.gain.exponentialRampToValueAtTime(0.0001,t+1.7);
 o.connect(ws);ws.connect(lp);lp.connect(g);g.connect(master);o.start(t);o.stop(t+1.8);
 const s=AC.createBufferSource();s.buffer=noiseBuf;
 const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=350;
 const g2=AC.createGain();g2.gain.setValueAtTime(0.25,t);g2.gain.exponentialRampToValueAtTime(0.0001,t+1.5);
 s.connect(f);f.connect(g2);g2.connect(master);s.start(t);s.stop(t+1.6);}
function thud(v=0.8){if(!AC)return;const t=AC.currentTime;
 const o=AC.createOscillator();o.type='sine';
 o.frequency.setValueAtTime(95,t);o.frequency.exponentialRampToValueAtTime(30,t+0.4);
 const g=AC.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.5);
 o.connect(g);g.connect(master);o.start(t);o.stop(t+0.55);
 const s=AC.createBufferSource();s.buffer=noiseBuf;s.playbackRate.value=0.8;
 const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=900;
 const g2=AC.createGain();g2.gain.setValueAtTime(0.4*v,t);g2.gain.exponentialRampToValueAtTime(0.0001,t+0.7);
 s.connect(f);f.connect(g2);g2.connect(master);s.start(t);s.stop(t+0.75);}
function heart(){if(!AC)return;const t=AC.currentTime;
 [0,0.28].forEach((off,i)=>{const o=AC.createOscillator();o.type='sine';
  o.frequency.setValueAtTime(58,t+off);o.frequency.exponentialRampToValueAtTime(38,t+off+0.12);
  const g=AC.createGain();g.gain.setValueAtTime(0.0001,t+off);
  g.gain.exponentialRampToValueAtTime(0.55-i*0.15,t+off+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t+off+0.22);
  o.connect(g);g.connect(master);o.start(t+off);o.stop(t+off+0.3);});}
function crackle(){if(!AC)return;const t=AC.currentTime;
 const s=AC.createBufferSource();s.buffer=noiseBuf;s.playbackRate.value=0.7+Math.random()*1.6;
 const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=900+Math.random()*2500;
 const g=AC.createGain();g.gain.setValueAtTime(0.02+Math.random()*0.05,t);
 g.gain.exponentialRampToValueAtTime(0.0001,t+0.05+Math.random()*0.08);
 s.connect(f);f.connect(g);g.connect(master);s.start(t,Math.random()*1.5,0.15);}
function chirp(){if(!AC)return;const t=AC.currentTime,n=2+((Math.random()*3)|0);
 for(let i=0;i<n;i++){const o=AC.createOscillator();o.type='sine';
  const st=t+i*0.14+Math.random()*0.03,f0=1900+Math.random()*1400;
  o.frequency.setValueAtTime(f0,st);o.frequency.exponentialRampToValueAtTime(f0*0.7,st+0.09);
  const g=AC.createGain();g.gain.setValueAtTime(0.0001,st);
  g.gain.exponentialRampToValueAtTime(0.045,st+0.02);g.gain.exponentialRampToValueAtTime(0.0001,st+0.11);
  o.connect(g);g.connect(master);o.start(st);o.stop(st+0.13);}}
function whoosh(){if(!AC)return;const t=AC.currentTime;
 const s=AC.createBufferSource();s.buffer=noiseBuf;
 const f=AC.createBiquadFilter();f.type='bandpass';f.Q.value=1.2;
 f.frequency.setValueAtTime(200,t);f.frequency.linearRampToValueAtTime(1200,t+0.8);
 f.frequency.linearRampToValueAtTime(200,t+1.6);
 const g=AC.createGain();g.gain.setValueAtTime(0.0001,t);
 g.gain.exponentialRampToValueAtTime(0.12,t+0.7);g.gain.exponentialRampToValueAtTime(0.0001,t+1.6);
 s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+1.7);}

function updOrc(dt){
 const t=tGlob,p=orcPos(t),p2=orcPos(t+0.2);
 resetPose(orc);orc.root.position.set(p.x,0,p.z);
 const moving=(t>=3&&t<16)||(t>=20.5&&t<34);
 let targetYaw=orcYaw;
 if(moving)targetYaw=Math.atan2(p2.x-p.x,p2.z-p.z);
 else if(t>=16&&t<20.5)targetYaw=-0.08;
 orcYaw=lerpAngle(orcYaw,targetYaw,1-Math.exp(-dt*3));
 orc.root.rotation.y=orcYaw;
 if(t>=12&&t<14.2){
  const k=(t-12)/2.2;
  const f=k<0.25?sstep(k/0.25):(k>0.8?1-sstep((k-0.8)/0.2):1);
  orc.armL.rotation.x=orc.armR.rotation.x=-2.5*f;
  orc.armL.rotation.z=0.5*f;orc.armR.rotation.z=-0.5*f;
  orc.headG.rotation.x=-0.35*f;orc.hips.rotation.x=-0.06*f;
  if(!roarPlayed&&k>0.06){roarPlayed=true;roar();addShake(1.1);heatFlash(0.4);}
 }else if(t>=14.4&&t<15.8){
  const k=(t-14.4)/1.4;
  if(k<0.35){const w=sstep(k/0.35);
   orc.armR.rotation.x=lerp(0,-2.9,w);orc.armR.rotation.z=-0.4*w;orc.hips.rotation.y=0.35*w;
  }else{const s=sstep((k-0.35)/0.22);
   orc.armR.rotation.x=lerp(-2.9,1.25,s);orc.hips.rotation.y=lerp(0.35,-0.25,s);
   orc.armR.rotation.z=-0.4*(1-s);
   if(!smashPlayed&&s>0.85){smashPlayed=true;
    burst(new THREE.Vector3(2,1.2,-13));thud(1);addShake(1.7);heatFlash(0.35);}}
 }else{
  const w=Math.sin(t*3.6),a=moving?0.6:0.05;
  orc.legL.rotation.x=w*a;orc.legR.rotation.x=-w*a;
  orc.armL.rotation.x=-w*a*0.8;orc.armR.rotation.x=w*a*0.8;
  orc.root.position.y=Math.abs(Math.cos(t*3.6))*0.25*(moving?1:0);
  if(!moving)orc.headG.rotation.y=Math.sin(t*0.7)*0.35;
  if(moving&&world==='village'){
   const step=Math.floor(t*1.8);
   if(step!==stepCount){stepCount=step;
    const d=camera.position.distanceTo(orc.root.position);
    if(d<60){thud(clamp(1.6-d/40,0.12,0.7));addShake(clamp(2.2/d,0.05,0.5));}}}
 }
 orcLight.position.set(p.x,6,p.z);}

function nextPhase(){
 phaseIdx++;pt=0;
 if(phaseIdx>=phases.length){playing=false;showEnd();return;}
 capQueue=[];capEl.classList.remove('show');
 const ph=phases[phaseIdx];
 if(ph.enter)ph.enter();
 ph.up(0,0.016);
 if(ph.cut){camPos.copy(dp);camLook.copy(dl);fovCur=fovT;
  camera.fov=fovCur;camera.updateProjectionMatrix();}}

function showEnd(){playing=false;capEl.classList.remove('show');
 bubbleEl.style.display='none';skipBtn.style.display='none';
 if(EMBED){endEl.style.display='none';finishEmbed();return;}
 endEl.style.display='flex';}

function doSkip(){
 if(EMBED){finishEmbed();return;}
 capQueue=[];capEl.classList.remove('show');titleEl.classList.remove('show');
 if(world!=='forest')switchForest();
 eyesOpened=true;
 if(man.faceM){man.faceM.map=manFaceOpen;man.faceM.needsUpdate=true;}
 bubbleShown=false;bubbleDone=false;bubbleEl.style.display='none';
 tGlob=40.5;phaseIdx=8;pt=0;
 const ph=phases[8];if(ph.enter)ph.enter();ph.up(0,0.016);
 camPos.copy(dp);camLook.copy(dl);fovCur=fovT;
 camera.fov=fovCur;camera.updateProjectionMatrix();fadeTo(0,0.6);}

function updateBubble(){
 if(!bubbleShown){bubbleEl.style.display='none';return;}
 const v=new THREE.Vector3();man.head.getWorldPosition(v);v.y+=0.55;v.project(camera);
 if(v.z>1){bubbleEl.style.display='none';return;}
 const x=(v.x*0.5+0.5)*innerWidth,y=(-v.y*0.5+0.5)*innerHeight;
 bubbleEl.style.display='block';
 const r=bubbleEl.getBoundingClientRect();
 bubbleEl.style.left=clamp(x-60,10,innerWidth-r.width-10)+'px';
 bubbleEl.style.top=clamp(y-r.height-22,10,innerHeight)+'px';
 const n=Math.floor((tGlob-typeStart)*26);
 if(n<bubbleFull.length)bubbleEl.textContent=bubbleFull.slice(0,n)+'▍';
 else{bubbleEl.textContent=bubbleFull;bubbleDone=true;}}

const clock=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),0.05);
 if(playing){
  tGlob+=dt;pt+=dt;
  const ph=phases[phaseIdx];
  if(ph){
   while(capQueue.length&&capQueue[0].at<=pt){
    capEl.textContent=capQueue.shift().text;capEl.classList.add('show');}
   if(pt>ph.d-0.4)capEl.classList.remove('show');
   ph.up(clamp(pt/ph.d,0,1),dt);
   if(pt>=ph.d)nextPhase();
  }
  updOrc(dt);updBoy();updDebris(dt);
  if(world==='village'){
   fires.forEach(f=>f.update(dt,tGlob));
   smokes.forEach(s=>s.update(dt,tGlob));
   emberS.update(dt,tGlob);
   fireLights.forEach((l,i)=>{l.intensity=2.0+Math.sin(tGlob*11+i*7)*0.45+Math.sin(tGlob*23+i*3)*0.3;});
   boyLight.intensity=1.4+Math.sin(tGlob*13)*0.5;
   windows.forEach((m,i)=>{const k=0.6+0.3*Math.sin(tGlob*10+i*2.4);
    m.color.setRGB(1,0.35+0.3*k,0.08);});
   if(Math.random()<dt*7)crackle();
  }else{
   birdTimer-=dt;if(birdTimer<=0){chirp();birdTimer=1.2+Math.random()*3;}
  }
 }
 const k=1-Math.exp(-dt*3.4);
 camPos.lerp(dp,k);camLook.lerp(dl,k);
 camera.position.copy(camPos);
 if(shake>0.002){
  camera.position.x+=rnd(-1,1)*shake*0.35;
  camera.position.y+=rnd(-1,1)*shake*0.3;
  camera.position.z+=rnd(-1,1)*shake*0.35;}
 camera.lookAt(camLook);
 if(Math.abs(fovCur-fovT)>0.05){fovCur=lerp(fovCur,fovT,k);
  camera.fov=fovCur;camera.updateProjectionMatrix();}
 shake*=Math.exp(-dt*3);
 heatOp*=Math.exp(-dt*2.2);
 heatEl.style.opacity=clamp((world==='village'&&playing?0.09+0.045*Math.sin(tGlob*2.6):0)+heatOp,0,0.7);
 updateBubble();
 renderer.render(scene,camera);
}
animate();

/* ============================== UI ============================== */
$('playBtn').addEventListener('click',()=>{
 startEl.style.display='none';
 skipBtn.style.display='block';muteBtn.style.display='block';
 initAudio();if(AC&&AC.state==='suspended')AC.resume();
 setAudioScene('village');
 playing=true;tGlob=0;phaseIdx=-1;nextPhase();});
skipBtn.addEventListener('click',doSkip);
muteBtn.addEventListener('click',()=>{muted=!muted;
 if(AC)master.gain.value=muted?0:0.6;
 muteBtn.textContent=muted?'🔇 Sunyi':'🔊 Suara';});
$('replayBtn').addEventListener('click',()=>location.reload());
addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);});

/* ===================== AUTOSTART SAAT EMBED (New Game) =====================
   Langsung putar tanpa layar mulai; bila audio terkunci kebijakan autoplay,
   lanjutkan pada sentuhan/tombol pertama di dalam iframe. */
if(EMBED){
 startEl.style.display='none';
 skipBtn.style.display='block';muteBtn.style.display='block';
 initAudio();if(AC&&AC.state==='suspended'){try{AC.resume();}catch(e){}}
 setAudioScene('village');
 playing=true;tGlob=0;phaseIdx=-1;nextPhase();
 const _resumeAudio=()=>{if(AC&&AC.state==='suspended'){try{AC.resume();}catch(e){}}};
 addEventListener('pointerdown',_resumeAudio);
 addEventListener('keydown',_resumeAudio);
}
</script>
