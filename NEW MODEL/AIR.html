<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Danau Voxel Cozy — three.js</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0b1020;font-family:'Segoe UI',system-ui,sans-serif;}
  #app{position:fixed;inset:0;}
  .panel{position:fixed;left:16px;top:16px;color:#fff;background:rgba(20,28,40,.55);
    backdrop-filter:blur(8px);padding:14px 18px;border-radius:14px;
    border:1px solid rgba(255,255,255,.15);user-select:none;pointer-events:none;}
  .panel h1{margin:0;font-size:17px;letter-spacing:.4px;}
  .panel p{margin:6px 0 0;font-size:12px;opacity:.85;}
  .badge{display:inline-block;margin-top:8px;font-size:11px;padding:3px 9px;
    border-radius:999px;background:rgba(255,255,255,.12);}
</style>
</head>
<body>
<div id="app"></div>
<div class="panel">
  <h1>🏞️ Danau Voxel — cozy evening</h1>
  <p>🖱️ drag: putar kamera &nbsp;•&nbsp; 🖱️ kanan: geser &nbsp;•&nbsp; 🖲️ scroll: zoom</p>
  <span class="badge">three.js • shader air • minecraft style</span>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ================= KONFIG ================= */
const SIZE = 64, HALF = SIZE/2;
const WATER_LEVEL = 3.4;
const LAKE = { x: 1, z: -2, rx: 11, rz: 8.5 };

/* ================= NOISE DETERMINISTIK ================= */
function rand2(x, y){ const s = Math.sin(x*127.1 + y*311.7)*43758.5453123; return s - Math.floor(s); }
function sstep(a, b, x){ const t = Math.min(1, Math.max(0, (x-b)/(a-b))); return t*t*(3-2*t); }
function vnoise(x, y){
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x-xi, yf = y-yi;
  const u = xf*xf*(3-2*xf), v = yf*yf*(3-2*yf);
  const a = rand2(xi,yi), b = rand2(xi+1,yi), c = rand2(xi,yi+1), d = rand2(xi+1,yi+1);
  return a + (b-a)*u + (c-a)*v + (a-b-c+d)*u*v;
}

/* ================= TINGGI MEDAN ================= */
const HMAP = new Map();
function heightAt(x, z){
  const k = x + ',' + z;
  if (HMAP.has(k)) return HMAP.get(k);
  let h = 4.3 + vnoise(x*0.075+3.7, z*0.075+8.1)*3.0 + vnoise(x*0.19+40, z*0.19+17)*1.2;
  const dx = (x-LAKE.x)/LAKE.rx, dz = (z-LAKE.z)/LAKE.rz;
  const d = Math.sqrt(dx*dx + dz*dz);
  const f = sstep(0.42, 1.18, d);            // 1 di tengah danau → 0 di luar
  h = h*(1-f) + 1.1*f;                       // dasar danau
  h = Math.max(1, Math.round(h));
  HMAP.set(k, h);
  return h;
}

/* ================= RENDERER / SCENE / KAMERA ================= */
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xffd9b3, 70, 170);

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 700);
camera.position.set(27, 17, 30);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 3.2, -1);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.minDistance = 8; controls.maxDistance = 110;
controls.maxPolarAngle = 1.46;
controls.autoRotate = true; controls.autoRotateSpeed = 0.4;

/* ================= LANGIT (kubah gradien senja) ================= */
const sunPos = new THREE.Vector3(55, 34, 20);
const sunDir = sunPos.clone().normalize();
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false,
  uniforms: { uSunDir: { value: sunDir.clone() } },
  vertexShader: `varying vec3 vDir;
    void main(){ vDir = normalize(position);
      gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `varying vec3 vDir; uniform vec3 uSunDir;
    void main(){
      float h = clamp(vDir.y, -1.0, 1.0);
      vec3 zenith  = vec3(0.33,0.52,0.80);
      vec3 horizon = vec3(1.00,0.80,0.60);
      vec3 col = mix(horizon, zenith, pow(max(h,0.0), 0.58));
      float s = max(dot(normalize(vDir), normalize(uSunDir)), 0.0);
      col += vec3(1.0,0.72,0.42)*pow(s,24.0)*0.55;
      col += vec3(1.0,0.90,0.70)*pow(s,350.0)*1.6;
      if(h < 0.0) col = mix(horizon, vec3(0.85,0.70,0.58), min(-h*3.0,1.0));
      gl_FragColor = vec4(col,1.0);
    }`
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(320, 32, 20), skyMat));

/* ================= CAHAYA ================= */
scene.add(new THREE.HemisphereLight(0xcfe5ff, 0x9a795a, 0.85));
const sun = new THREE.DirectionalLight(0xffdcae, 2.6);
sun.position.copy(sunPos);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left:-48, right:48, top:48, bottom:-48, near:10, far:170 });
sun.shadow.bias = -0.0003; sun.shadow.normalBias = 0.04;
scene.add(sun);

/* ================= TEKSTUR PIXEL (canvas) ================= */
function pixelTex(palette, size=16){
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d');
  for(let y=0;y<size;y++) for(let x=0;x<size;x++){
    g.fillStyle = palette[(rand2(x*3.1+y, y*1.7+x)*palette.length)|0];
    g.fillRect(x,y,1,1);
  }
  const t = new THREE.CanvasTexture(c);
  t.magFilter = t.minFilter = THREE.NearestFilter;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function customTex(draw){
  const c = document.createElement('canvas'); c.width = c.height = 16;
  draw(c.getContext('2d'));
  const t = new THREE.CanvasTexture(c);
  t.magFilter = t.minFilter = THREE.NearestFilter;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const texDirt   = pixelTex(['#8a5a3b','#7c4f33','#96684a','#6f452c','#a0714f']);
const texGrassT = pixelTex(['#5cb04c','#4fa53f','#67bb55','#57a846','#71c25e','#4c9e3c']);
const texSand   = pixelTex(['#e8dda6','#dcd094','#f0e5b2','#d4c685','#e2d69b']);
const texStone  = pixelTex(['#8d8d94','#7f7f86','#999aa0','#74747b','#a5a6ac']);
const texLeaf   = pixelTex(['#3e7a2e','#356b27','#478a36','#2f6122','#529940','#2a5a1f']);
const texGrassS = customTex(g=>{
  const dirt=['#8a5a3b','#7c4f33','#96684a','#6f452c'], grass=['#5cb04c','#4fa53f','#67bb55','#57a846'];
  for(let y=0;y<16;y++) for(let x=0;x<16;x++){
    let p = dirt;
    if(y<3) p = grass; else if(y===3 && rand2(x,99)<0.55) p = grass;
    g.fillStyle = p[(rand2(x,y)*p.length)|0]; g.fillRect(x,y,1,1);
  }});
const texLogS = customTex(g=>{
  const cols=['#6b4a2c','#5d3f25','#755233','#54381f'];
  for(let x=0;x<16;x++){ const base = cols[(rand2(x,7)*cols.length)|0];
    for(let y=0;y<16;y++){ g.fillStyle = rand2(x,y)<0.12 ? '#4a3018' : base; g.fillRect(x,y,1,1);} }});
const texLogT = customTex(g=>{
  for(let y=0;y<16;y++) for(let x=0;x<16;x++){
    const r = Math.max(Math.abs(x-7.5), Math.abs(y-7.5));
    g.fillStyle = (Math.floor(r)%2===0) ? '#9c7a4c' : '#6b4a2c';
    g.fillRect(x,y,1,1); }});
const texPlank = customTex(g=>{
  const shades=['#b08d5a','#a5824f','#bb9763'];
  for(let y=0;y<16;y++) for(let x=0;x<16;x++){
    g.fillStyle = (y%4===0) ? '#7a5c34' : shades[(rand2(Math.floor(y/4),x)*3)|0];
    g.fillRect(x,y,1,1); }});

const matL = m => new THREE.MeshLambertMaterial({ map: m });
const mGrassT=matL(texGrassT), mGrassS=matL(texGrassS), mDirt=matL(texDirt),
      mSand=matL(texSand), mStone=matL(texStone), mLeaf=matL(texLeaf), mPlank=matL(texPlank);
const grassMats=[mGrassS,mGrassS,mGrassT,mDirt,mGrassS,mGrassS];
const logMats=[matL(texLogS),matL(texLogS),matL(texLogT),matL(texLogT),matL(texLogS),matL(texLogS)];

/* ================= MEDAN VOXEL ================= */
const box = new THREE.BoxGeometry(1,1,1);
const dummy = new THREE.Object3D();
const pos = { grass:[], dirt:[], sand:[], stone:[] };
for(let x=-HALF; x<HALF; x++) for(let z=-HALF; z<HALF; z++){
  const h = heightAt(x,z);
  const beach = h <= WATER_LEVEL + 1.0;
  for(let y=0; y<h; y++){
    if(y === h-1)        (beach ? pos.sand : pos.grass).push(x,y,z);
    else if(y >= h-3)    (beach ? pos.sand : pos.dirt ).push(x,y,z);
    else                  pos.stone.push(x,y,z);
  }
}
function makeInstanced(mat, list){
  const m = new THREE.InstancedMesh(box, mat, list.length/3);
  dummy.scale.set(1,1,1); dummy.rotation.set(0,0,0);
  for(let i=0; i<list.length; i+=3){
    dummy.position.set(list[i]+0.5, list[i+1]+0.5, list[i+2]+0.5);
    dummy.updateMatrix(); m.setMatrixAt(i/3, dummy.matrix);
  }
  m.castShadow = true; m.receiveShadow = true;
  scene.add(m); return m;
}
makeInstanced(grassMats, pos.grass);
makeInstanced(mDirt,  pos.dirt);
makeInstanced(mSand,  pos.sand);
makeInstanced(mStone, pos.stone);

/* ================= POHON ================= */
const logs=[], leaves=[], leafSet=new Set();
const addLeaf=(x,y,z)=>{ const k=x+','+y+','+z; if(!leafSet.has(k)){ leafSet.add(k); leaves.push(x,y,z);} };
for(let gx=-HALF+3; gx<HALF-3; gx+=4) for(let gz=-HALF+3; gz<HALF-3; gz+=4){
  const x = gx + ((rand2(gx,gz)*3)|0) - 1;
  const z = gz + ((rand2(gz,gx)*3)|0) - 1;
  if(x<-HALF+2 || x>=HALF-2 || z<-HALF+2 || z>=HALF-2) continue;
  const h = heightAt(x,z);
  if(h <= WATER_LEVEL+1.2) continue;
  if(Math.abs(h-heightAt(x+1,z))>1 || Math.abs(h-heightAt(x,z+1))>1) continue;
  if(rand2(x*3.1, z*1.7) > 0.42) continue;
  const th = 3 + ((rand2(x,z)*3)|0);
  for(let y=h; y<h+th; y++) logs.push(x,y,z);
  const top = h+th-1;
  for(let dy=-1; dy<=2; dy++){
    const r = dy<=0 ? 2 : 1;
    for(let dx=-r; dx<=r; dx++) for(let dz=-r; dz<=r; dz++){
      if(dx===0 && dz===0 && dy<=0) continue;
      if(dy===2 && Math.abs(dx)===1 && Math.abs(dz)===1) continue;
      if(r===2 && Math.abs(dx)===2 && Math.abs(dz)===2 && rand2(x+dx*7+dy, z+dz*5)<0.6) continue;
      addLeaf(x+dx, top+dy, z+dz);
    }
  }
}
makeInstanced(logMats, logs);
makeInstanced(mLeaf, leaves);

/* ================= AIR (shader realistis) ================= */
const waterGeo = new THREE.PlaneGeometry(SIZE, SIZE, 150, 150);
waterGeo.rotateX(-Math.PI/2);
{ // atribut kedalaman per-vertex (untuk warna, buih, amplitude ombak)
  const wp = waterGeo.attributes.position;
  const depths = new Float32Array(wp.count);
  for(let i=0;i<wp.count;i++){
    const bx = Math.floor(wp.getX(i)), bz = Math.floor(wp.getZ(i));
    let d = 3.5;
    if(bx>=-HALF && bx<HALF && bz>=-HALF && bz<HALF)
      d = Math.max(0, WATER_LEVEL - heightAt(bx,bz));
    depths[i] = d;
  }
  waterGeo.setAttribute('aDepth', new THREE.BufferAttribute(depths,1));
}
const GLSL_WAVES = `
  float wsum(vec2 p, float t){
    float h = 0.0;
    h += sin(p.x*0.60 + t*1.30)*0.13;
    h += sin(p.y*0.75 + t*1.05)*0.11;
    h += sin((p.x+p.y)*0.40 + t*0.80)*0.09;
    h += sin((p.x-p.y)*0.55 + t*1.60)*0.05;
    return h;
  }`;
const waterMat = new THREE.ShaderMaterial({
  transparent:true, depthWrite:false,
  uniforms:{
    uTime:   { value:0 },
    uSunDir: { value: sunDir.clone() },
    uDeep:   { value: new THREE.Color('#155a70') },
    uShallow:{ value: new THREE.Color('#5fd0c6') },
    uSky:    { value: new THREE.Color('#ffd9ae') }
  },
  vertexShader: `
    uniform float uTime; attribute float aDepth;
    varying float vDepth; varying vec3 vWorld;
    ${GLSL_WAVES}
    void main(){
      vDepth = aDepth;
      float ds = clamp(aDepth/1.6, 0.10, 1.0);
      vec3 pos = position;
      pos.y += wsum(pos.xz, uTime)*ds;
      vec4 wp = modelMatrix * vec4(pos,1.0);
      vWorld = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }`,
  fragmentShader: `
    uniform float uTime; uniform vec3 uSunDir;
    uniform vec3 uDeep; uniform vec3 uShallow; uniform vec3 uSky;
    varying float vDepth; varying vec3 vWorld;
    ${GLSL_WAVES}
    float hash21(vec2 p){ p=fract(p*vec2(123.34,345.45)); p+=dot(p,p+34.345); return fract(p.x*p.y); }
    float vnoise(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.0-2.0*f);
      return mix(mix(hash21(i),hash21(i+vec2(1,0)),u.x),
                 mix(hash21(i+vec2(0,1)),hash21(i+vec2(1,1)),u.x), u.y); }
    void main(){
      float t = uTime; vec2 p = vWorld.xz;
      float ds = clamp(vDepth/1.6, 0.10, 1.0);
      // normal dari finite-difference gelombang
      float e = 0.35;
      float hC = wsum(p, t)*ds;
      float hX = wsum(p+vec2(e,0.0), t)*ds;
      float hZ = wsum(p+vec2(0.0,e), t)*ds;
      vec3 n = normalize(vec3(hC-hX, e, hC-hZ));
      // riak detail kecil
      float r1 = vnoise(p*3.2 + vec2(t*0.55,-t*0.35));
      float r2 = vnoise(p*5.4 + vec2(-t*0.42, t*0.50));
      n.xz += (vec2(r1,r2)-0.5)*0.35;
      n = normalize(n);

      vec3 V = normalize(cameraPosition - vWorld);
      vec3 L = normalize(uSunDir);
      float fres = pow(1.0 - max(dot(n,V),0.0), 3.0);
      float depthF = clamp(vDepth/2.6, 0.0, 1.0);
      vec3 col = mix(uShallow, uDeep, depthF);
      // kilau kaustik halus di air dangkal
      float ca = vnoise(p*2.4+vec2(t*0.35,t*0.28)) * vnoise(p*3.1-vec2(t*0.22,t*0.40));
      col += vec3(0.35,0.50,0.45)*ca*(1.0-depthF)*0.5;
      // pantulan langit (fresnel)
      col = mix(col, uSky, fres*0.8);
      // kilau matahari
      vec3 H = normalize(L+V);
      float spec = pow(max(dot(n,H),0.0),220.0)*1.4 + pow(max(dot(n,H),0.0),900.0)*2.2;
      col += vec3(1.0,0.93,0.78)*spec;
      // buih di tepi pantai
      float foamMask = 1.0 - smoothstep(0.05, 0.8, vDepth);
      float fn = vnoise(p*5.5 + vec2(t*0.6,-t*0.45)) + 0.35*sin(t*2.0 + p.x*2.5 + p.y*3.0);
      float foam = foamMask * smoothstep(0.55, 1.05, fn);
      col = mix(col, vec3(0.96,0.99,1.0), foam*0.9);

      float alpha = mix(0.5, 0.93, depthF);
      alpha = max(alpha, max(fres*0.85, foam*0.85));
      gl_FragColor = vec4(col, alpha);
    }`
});
const water = new THREE.Mesh(waterGeo, waterMat);
water.position.y = WATER_LEVEL;
water.renderOrder = 5;
scene.add(water);

// versi JS dari gelombang (untuk teratai mengapung)
function waveHeight(x, z, t, depth){
  const ds = Math.min(1, Math.max(0.10, depth/1.6));
  return (Math.sin(x*0.60+t*1.30)*0.13 + Math.sin(z*0.75+t*1.05)*0.11 +
          Math.sin((x+z)*0.40+t*0.80)*0.09 + Math.sin((x-z)*0.55+t*1.60)*0.05) * ds;
}

/* ================= DAUN TERATAI ================= */
const pads = [];
const padGeo = new THREE.BoxGeometry(0.85,0.07,0.85);
const padMat = new THREE.MeshLambertMaterial({ color:0x3f8f35 });
let placed=0, guard=0;
while(placed<7 && guard++<400){
  const x = LAKE.x + (rand2(guard,3.3)-0.5)*LAKE.rx*1.4;
  const z = LAKE.z + (rand2(guard,7.7)-0.5)*LAKE.rz*1.4;
  const d = WATER_LEVEL - heightAt(Math.floor(x), Math.floor(z));
  if(d>0.9 && d<2.2){
    const m = new THREE.Mesh(padGeo, padMat);
    m.position.set(x, WATER_LEVEL, z);
    m.rotation.y = rand2(guard,1.2)*Math.PI;
    scene.add(m); pads.push({m,x,z,d}); placed++;
  }
}

/* ================= DERMAGA + LENTERA ================= */
let shoreX = null;
for(let x=LAKE.x; x<HALF; x++){ if(heightAt(x, LAKE.z) > WATER_LEVEL+0.5){ shoreX = x; break; } }
shoreX ??= LAKE.x + Math.round(LAKE.rx*0.95);
const deckTop = WATER_LEVEL + 0.85;
const deckPts = [];
for(let x=shoreX-8; x<=shoreX; x++)
  for(let z=LAKE.z; z<=LAKE.z+1; z++)
    deckPts.push([x+0.5, deckTop-0.16, z+0.5]);
const deck = new THREE.InstancedMesh(box, mPlank, deckPts.length);
deckPts.forEach((p,i)=>{ dummy.position.set(...p); dummy.scale.set(1,0.32,1);
  dummy.rotation.set(0,0,0); dummy.updateMatrix(); deck.setMatrixAt(i,dummy.matrix); });
deck.castShadow = deck.receiveShadow = true; scene.add(deck);

const postPts = [];
for(const px of [shoreX-2, shoreX-5, shoreX-8])
  for(const pz of [LAKE.z, LAKE.z+1]){
    const gh = heightAt(px,pz), y0 = gh-0.4;
    postPts.push({ x:px+0.5, y:(deckTop+y0)/2, z:pz+0.5, len:deckTop-y0 });
  }
const posts = new THREE.InstancedMesh(box, logMats, postPts.length);
postPts.forEach((p,i)=>{ dummy.position.set(p.x,p.y,p.z); dummy.scale.set(0.3,p.len,0.3);
  dummy.updateMatrix(); posts.setMatrixAt(i,dummy.matrix); });
posts.castShadow = true; scene.add(posts);

const lx = shoreX-8+0.5, lz = LAKE.z+1.5;
const pole = new THREE.Mesh(box, logMats);
pole.scale.set(0.1,0.55,0.1); pole.position.set(lx, deckTop+0.27, lz); scene.add(pole);
const lantern = new THREE.Mesh(new THREE.BoxGeometry(0.3,0.3,0.3),
  new THREE.MeshBasicMaterial({ color:0xffc26e }));
lantern.position.set(lx, deckTop+0.62, lz); scene.add(lantern);
const fireLight = new THREE.PointLight(0xffb066, 45, 18, 2);
fireLight.position.set(lx, deckTop+0.85, lz); scene.add(fireLight);

/* ================= RUMPUT & BUNGA ================= */
const tuftList=[], flowerList=[];
for(let x=-HALF+1; x<HALF-1; x++) for(let z=-HALF+1; z<HALF-1; z++){
  const h = heightAt(x,z); if(h <= WATER_LEVEL+1.0) continue;
  const r = rand2(x*1.3, z*2.7);
  if(r < 0.05) tuftList.push(x+0.2+rand2(x,z)*0.6, h+0.17, z+0.2+rand2(z,x)*0.6);
  else if(r > 0.985) flowerList.push(x+0.5, h+0.2, z+0.5);
}
const tuftMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(0.14,0.34,0.14),
  new THREE.MeshLambertMaterial({ color:0x6fbf57 }), tuftList.length/3);
dummy.scale.set(1,1,1);
for(let i=0;i<tuftList.length;i+=3){
  dummy.position.set(tuftList[i],tuftList[i+1],tuftList[i+2]);
  dummy.rotation.y = rand2(i,4)*Math.PI; dummy.updateMatrix();
  tuftMesh.setMatrixAt(i/3, dummy.matrix);
}
scene.add(tuftMesh);
const flowerCols = [0xe25749,0xf6c945,0xf2ede1,0xb07fd8,0xff8b5e];
const flowerMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(0.2,0.4,0.2),
  new THREE.MeshLambertMaterial({ color:0xffffff }), flowerList.length/3);
const _c = new THREE.Color();
for(let i=0;i<flowerList.length;i+=3){
  dummy.position.set(flowerList[i],flowerList[i+1],flowerList[i+2]);
  dummy.rotation.set(0,0,0); dummy.updateMatrix();
  flowerMesh.setMatrixAt(i/3, dummy.matrix);
  flowerMesh.setColorAt(i/3, _c.setHex(flowerCols[(i/3)%flowerCols.length]));
}
scene.add(flowerMesh);

/* ================= AWAN ================= */
const CLOUDS = 34;
const cloudMesh = new THREE.InstancedMesh(box,
  new THREE.MeshLambertMaterial({ color:0xffffff, transparent:true, opacity:0.85 }), CLOUDS);
const cloudData = [];
for(let i=0;i<CLOUDS;i++) cloudData.push({
  x:(rand2(i,1)-0.5)*180, y:26+rand2(i,2)*8, z:(rand2(i,3)-0.5)*150,
  sx:6+rand2(i,4)*10, sz:4+rand2(i,5)*7, v:0.6+rand2(i,6)*0.8 });
scene.add(cloudMesh);

/* ================= KUNANG-KUNANG ================= */
const FLY = 110;
const flyBase = new Float32Array(FLY*3), flyPos = new Float32Array(FLY*3);
for(let i=0;i<FLY;i++){
  const a = rand2(i,9)*Math.PI*2, r = 4+rand2(i,10)*16;
  const fx = LAKE.x + Math.cos(a)*r*1.1, fz = LAKE.z + Math.sin(a)*r*0.9;
  flyBase[i*3]   = fx;
  flyBase[i*3+2] = fz;
  flyBase[i*3+1] = Math.max(WATER_LEVEL+0.6+rand2(i,11)*3.0,
                            heightAt(Math.floor(fx),Math.floor(fz))+0.7);
}
const flyGeo = new THREE.BufferGeometry();
flyGeo.setAttribute('position', new THREE.BufferAttribute(flyPos,3));
const flyMat = new THREE.PointsMaterial({ color:0xffd98a, size:0.16, transparent:true,
  opacity:0.95, blending:THREE.AdditiveBlending, depthWrite:false, sizeAttenuation:true });
const flies = new THREE.Points(flyGeo, flyMat);
flies.renderOrder = 6; scene.add(flies);

/* ================= LOOP ANIMASI ================= */
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  waterMat.uniforms.uTime.value = t;

  for(const p of pads){
    p.m.position.y = WATER_LEVEL + 0.05 + waveHeight(p.x, p.z, t, p.d)*0.9;
    p.m.rotation.z = Math.sin(t*0.8 + p.x)*0.04;
  }
  for(let i=0;i<CLOUDS;i++){
    const c = cloudData[i]; c.x += c.v*dt; if(c.x>115) c.x -= 230;
    dummy.position.set(c.x,c.y,c.z); dummy.scale.set(c.sx,1.15,c.sz);
    dummy.rotation.set(0,0,0); dummy.updateMatrix();
    cloudMesh.setMatrixAt(i,dummy.matrix);
  }
  cloudMesh.instanceMatrix.needsUpdate = true;
  for(let i=0;i<FLY;i++){
    const ix=i*3;
    flyPos[ix]   = flyBase[ix]   + Math.sin(t*0.7+i)*0.6;
    flyPos[ix+1] = flyBase[ix+1] + Math.sin(t*1.1+i*1.7)*0.35;
    flyPos[ix+2] = flyBase[ix+2] + Math.cos(t*0.6+i*0.7)*0.6;
  }
  flyGeo.attributes.position.needsUpdate = true;
  flyMat.opacity = 0.6 + 0.35*Math.sin(t*2.0);
  fireLight.intensity = 40 + Math.sin(t*8.5)*5 + Math.sin(t*23)*3;

  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
