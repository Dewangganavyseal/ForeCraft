<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tujuh Tameng Minecraft - Three.js</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0e1116}
  canvas{display:block}
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
/* ============ SETUP ============ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e1116); // scene polos

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 1.5, 12.5);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

let controls = null;
if (THREE.OrbitControls) {
  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 1.35, 0);
  controls.enableDamping = true;
  controls.minDistance = 5;
  controls.maxDistance = 25;
}

scene.add(new THREE.HemisphereLight(0xaebbdd, 0x20242c, 0.55));
const dir1 = new THREE.DirectionalLight(0xffffff, 0.85); dir1.position.set(6,9,7);   scene.add(dir1);
const dir2 = new THREE.DirectionalLight(0x88aaff, 0.25); dir2.position.set(-7,4,-6); scene.add(dir2);

const shieldsGroup = new THREE.Group();
scene.add(shieldsGroup);

/* ============ UTIL ============ */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}

const glowTex = (function(){
  const c=document.createElement('canvas'); c.width=c.height=64;
  const g=c.getContext('2d');
  const gr=g.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,'rgba(255,255,255,1)');
  gr.addColorStop(0.35,'rgba(255,255,255,0.6)');
  gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gr; g.fillRect(0,0,64,64);
  return new THREE.CanvasTexture(c);
})();

function makeGlowSprite(color, scale, opacity){
  const m = new THREE.SpriteMaterial({map:glowTex, color, transparent:true, opacity, blending:THREE.AdditiveBlending, depthWrite:false});
  const s = new THREE.Sprite(m);
  s.scale.set(scale, scale, 1);
  return s;
}

/* ============ AURA (PARTIKEL) ============ */
function makeAura(cfg){
  const n=cfg.count;
  const positions=new Float32Array(n*3);
  const data=[];
  for(let i=0;i<n;i++){
    positions[i*3]  =(Math.random()*2-1)*cfg.rx;
    positions[i*3+1]=(Math.random()*2-1)*cfg.ry;
    positions[i*3+2]=(Math.random()-0.5)*0.7;
    data.push({spd:(cfg.s0||0)+Math.random()*(((cfg.s1||cfg.s0)||0)-(cfg.s0||0)), phase:Math.random()*Math.PI*2});
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions,3));
  const mat=new THREE.PointsMaterial({size:cfg.size, map:glowTex, color:cfg.color, transparent:true, opacity:cfg.opacity, depthWrite:false, blending:THREE.AdditiveBlending});
  const pts=new THREE.Points(geo, mat);
  pts.userData={cfg, data};
  return pts;
}
function updateAura(a,t,dt){
  const cfg=a.userData.cfg, data=a.userData.data;
  const pos=a.geometry.attributes.position, arr=pos.array;
  for(let i=0;i<data.length;i++){
    const d=data[i], j=i*3;
    if(cfg.mode==='rise'){
      arr[j+1]+=d.spd*dt;
      arr[j]+=Math.sin(t*1.3+d.phase)*(cfg.sway||0.2)*dt;
      if(arr[j+1]>cfg.ry){arr[j+1]=-cfg.ry; arr[j]=(Math.random()*2-1)*cfg.rx;}
    } else if(cfg.mode==='fall'){
      arr[j+1]-=d.spd*dt;
      arr[j]+=Math.sin(t*1.1+d.phase)*(cfg.sway||0.2)*dt;
      if(arr[j+1]<-cfg.ry){arr[j+1]=cfg.ry; arr[j]=(Math.random()*2-1)*cfg.rx;}
    } else if(cfg.mode==='jitter'){
      if(Math.random()<dt*8){
        arr[j]  =(Math.random()*2-1)*cfg.rx;
        arr[j+1]=(Math.random()*2-1)*cfg.ry;
        arr[j+2]=(Math.random()-0.5)*0.6;
      }
    }
  }
  pos.needsUpdate=true;
  if(cfg.mode==='jitter') a.material.opacity=cfg.opacity*(0.4+0.6*Math.random());
}

/* ============ GENERATOR TAMENG PIXEL (MINECRAFT) ============ */
function buildPixelShield(cfg){
  const g=new THREE.Group();
  const s=cfg.cell||0.17;
  const geo=new THREE.BoxGeometry(s,s,s);
  const cache={};
  const mat=c=>cache[c]||(cache[c]=new THREE.MeshLambertMaterial({color:c}));
  const rnd=mulberry32(cfg.seed||1);
  const minY=(cfg.minY!==undefined?cfg.minY:0);
  const maxY=(cfg.maxY!==undefined?cfg.maxY:cfg.H-1);
  const cx=(cfg.W-1)/2, cy=(minY+maxY)/2;

  for(let gy=minY; gy<=maxY; gy++){
    for(let gx=0; gx<cfg.W; gx++){
      if(!cfg.mask(gx,gy)) continue;
      const border=!cfg.mask(gx+1,gy)||!cfg.mask(gx-1,gy)||!cfg.mask(gx,gy+1)||!cfg.mask(gx,gy-1);
      const color=cfg.color(gx,gy,border,rnd);
      if(color==null) continue;
      const m=new THREE.Mesh(geo, mat(color));
      m.position.set((gx-cx)*s, (gy-cy)*s, 0);
      g.add(m);
    }
  }
  // gagang khas minecraft di belakang
  if(cfg.handle){
    const h1=new THREE.Mesh(new THREE.BoxGeometry(s*1.4,s*4.5,s*0.9), mat(cfg.handle[0]));
    h1.position.set(0,0,-s*0.9); g.add(h1);
    const grip=new THREE.Mesh(new THREE.BoxGeometry(s*0.9,s*2.8,s*0.9), mat(cfg.handle[1]));
    grip.position.set(0,0,-s*1.6); g.add(grip);
  }
  if(cfg.extras) cfg.extras(g,s,mat);
  g.scale.setScalar(cfg.scale||1);
  return g;
}

/* ---------- 1. WOODEN SHIELD ---------- */
function buildWood(){
  const W=10,H=12;
  const inShape=(gx,gy)=>{
    if(gx<0||gx>=W||gy<0||gy>=H) return false;
    if(gy>=10&&(gx<=1||gx>=8)) return false;
    if(gy===0&&(gx===0||gx===9)) return false;
    return true;
  };
  return buildPixelShield({
    W,H,seed:7,scale:1.25,
    handle:[0x3c2413,0x5a3a1e],
    mask:inShape,
    color:(gx,gy,border,rnd)=>{
      if(gx>=4&&gx<=5&&gy>=5&&gy<=6) return 0x8d9299;
      if(border) return 0x4a2f1b;
      const plank=Math.floor(gy/3);
      if(gy%3===2) return 0x6e4522;
      const r=rnd();
      if((plank%2===0&&gx===2)||(plank%2===1&&gx===7)) return 0x6e4522;
      if(r<0.14) return 0x6e4522;
      if(r>0.9)  return 0xb5844a;
      return [0x9c6b35,0x8a5c2c,0xa17038,0x8f6030][plank%4];
    },
    extras:(g,s,mat)=>{ // boss besi menonjol
      const b=new THREE.Mesh(new THREE.BoxGeometry(0.36,0.36,0.18), mat(0x6f757c));
      b.position.set(0,0,s*0.9); g.add(b);
    }
  });
}

/* ---------- 2. IRON KNIGHT SHIELD (bentuk heater pixel) ---------- */
function buildIron(){
  const hw=[0,1,2,2,3,3,4,4,5,5,5,5,5]; // lebar per baris, mengecil ke bawah
  return buildPixelShield({
    W:11,H:13,seed:21,scale:1.2,
    handle:[0x2f353c,0x454c55],
    mask:(gx,gy)=>Math.abs(gx-5)<=hw[gy],
    color:(gx,gy,border,rnd)=>{
      const cross=(gx===5&&gy>=2&&gy<=11)||(gy===9&&gx>=2&&gx<=8);
      if(cross)  return rnd()<0.25?0xc2932f:0xe0b244;      // salib emas
      if(border) return rnd()<0.3?0x313840:0x394048;        // bingkai besi gelap
      const r=rnd();                                         // variasi besi
      return r<0.25?0x8d98a5:r<0.5?0xa8b2bd:r<0.75?0x98a2ae:0x9aa4b0;
    },
    extras:(g,s,mat)=>{
      const b=new THREE.Mesh(new THREE.BoxGeometry(0.34,0.34,0.16), mat(0x565b61));
      b.position.set(0,3*s,s*0.9); g.add(b); // boss di pusat salib
    }
  });
}

/* ---------- 3. FLAME SHIELD (bundar, motif api pixel) ---------- */
function buildFlame(){
  return buildPixelShield({
    W:13,H:13,seed:33,scale:1.2,
    handle:[0x2e1a18,0x452520],
    mask:(gx,gy)=>(gx-6)*(gx-6)+(gy-6)*(gy-6)<=40,
    color:(gx,gy,border,rnd)=>{
      if(border) return rnd()<0.4?0x2e1614:0x241210;
      const fx=Math.abs(gx-6), d=Math.abs(gy-6);
      if(fx+d<=3) return fx===0?0xffe066:fx===1?0xffb42a:fx===2?0xff7a1f:0xd9531e; // emblem api
      const p=Math.max(0.05, 0.18+(10-gy)*0.05+(3-fx)*0.07);
      if(rnd()<p){ // pixel bara
        const heat=Math.min(1,(11-gy)/9+(3-fx)*0.12+rnd()*0.2);
        if(heat<0.3) return 0x8a2c12; if(heat<0.55) return 0xd9531e;
        if(heat<0.75) return 0xff7a1f; if(heat<0.9) return 0xffb42a; return 0xffe066;
      }
      const r=rnd(); return r<0.33?0x2e1a18:r<0.66?0x3a2020:0x452520;
    }
  });
}

/* ---------- 4. FROST SHIELD (heksagon pixel + kepingan salju) ---------- */
function buildIce(){
  const hw=[0,2,3,4,5,6,6,6,6,6,5,4,3,2,0]; // heksagon ujung runcing
  return buildPixelShield({
    W:13,H:15,seed:45,scale:1.05,
    handle:[0x2a4a63,0x3a6284],
    mask:(gx,gy)=>Math.abs(gx-6)<=hw[gy],
    color:(gx,gy,border,rnd)=>{
      if(border) return rnd()<0.3?0x35628a:0x3d6f96;
      const dx=gx-6, dy=gy-7;
      const spoke=(dy===0&&Math.abs(dx)<=4)||(dx===0&&Math.abs(dy)<=4)||(dx!==0&&Math.abs(dx)===Math.abs(dy)&&Math.abs(dx)<=3);
      if(spoke) return rnd()<0.3?0xdceeff:0xf0fbff;         // kepingan salju
      if(rnd()<0.06) return 0xffffff;                        // kilau es
      const r=rnd(); return r<0.25?0x9fd6ff:r<0.5?0x8ac8f5:r<0.75?0xb4e2ff:0x7ab8e0;
    }
  });
}

/* ---------- 5. VENOM SHIELD (bundar + tetesan slime) ---------- */
function buildPoison(){
  return buildPixelShield({
    W:13,H:16,minY:1,seed:57,scale:1.0,
    handle:[0x1d2a1c,0x2b3d2a],
    mask:(gx,gy)=>{
      if(gx===3&&gy>=3&&gy<=4) return true;   // tetesan slime
      if(gx===6&&gy>=1&&gy<=4) return true;
      if(gx===9&&gy>=3&&gy<=4) return true;
      return gy>=5 && (gx-6)*(gx-6)+(gy-10)*(gy-10)<=34;
    },
    color:(gx,gy,border,rnd)=>{
      if(gy<5) return rnd()<0.4?0x2bcc4f:0x52e878;
      if(border) return rnd()<0.3?0x1a2a14:0x14200f;
      const d2=(gx-6)*(gx-6)+(gy-10)*(gy-10);
      if(d2<=4) return rnd()<0.5?0x52e878:0x6cf292;          // gumpalan slime
      if(d2<=10&&rnd()<0.6) return 0x2bcc4f;
      const p=0.15+Math.max(0,9-gy)*0.06;
      if(rnd()<p) return rnd()<0.5?0x1f9e3d:0x2bcc4f;
      const r=rnd(); return r<0.33?0x22301f:r<0.66?0x2b3d2a:0x1d2a1c;
    }
  });
}

/* ---------- 6. STORM SHIELD (berlian emas + petir pixel) ---------- */
function buildLightning(){
  const bolt=new Set([[5,9],[6,9],[4,8],[5,8],[3,7],[4,7],[3,6],[4,6],[5,6],[6,6],[7,6],[6,5],[7,5],[5,4],[6,4],[4,3],[5,3],[3,2],[4,2],[4,1]].map(p=>p[0]+','+p[1]));
  return buildPixelShield({
    W:11,H:11,seed:69,scale:1.3,
    handle:[0x4a3410,0x5c421a],
    mask:(gx,gy)=>Math.abs(gx-5)+Math.abs(gy-5)<=5,
    color:(gx,gy,border,rnd)=>{
      if(bolt.has(gx+','+gy)) return rnd()<0.2?0x22242e:0x15161c; // petir hitam
      if(border) return rnd()<0.3?0x59400c:0x6b4a0e;
      const r=rnd(); return r<0.25?0xe8b62c:r<0.5?0xd19f1f:r<0.75?0xf5c531:0xffd75e;
    }
  });
}

/* ---------- 7. SHADOW SHIELD (tower shield + mata ungu) ---------- */
function buildDark(){
  return buildPixelShield({
    W:11,H:15,maxY:16,seed:81,scale:0.95,
    handle:[0x14101f,0x1f1930],
    mask:(gx,gy)=>{
      if(gy===15&&(gx===2||gx===5||gx===8)) return true; // duri atas
      if(gy===16&&gx===5) return true;
      if(gy>14) return false;
      if(gx<=1&&gy>=13) return false;                    // sudut membulat
      if(gx>=9&&gy>=13) return false;
      if(gx<=1&&gy<=1)  return false;
      if(gx>=9&&gy<=1)  return false;
      return true;
    },
    color:(gx,gy,border,rnd)=>{
      if(gy>=15) return 0x14101f;
      if(gx===5&&gy>=7&&gy<=9) return 0x0a0a10;          // pupil celah
      if(gy===8&&gx>=2&&gx<=8) return rnd()<0.3?0x8a2be0:0xa633ff;
      if((gy===7||gy===9)&&gx>=3&&gx<=7) return rnd()<0.3?0x641da8:0x7a24cc;
      if(border) return rnd()<0.3?0x271c3a:0x2e2144;
      if(rnd()<0.08) return 0x3a2a55;                    // urat ungu
      const r=rnd(); return r<0.33?0x1a1622:r<0.66?0x221c2e:0x171320;
    }
  });
}

/* ============ SUSUNAN 7 TAMENG ============ */
const defs=[
  {build:buildWood,      aura:{color:0x9ccc5a,count:80, size:0.14,opacity:0.7, rx:1.25,ry:1.5,s0:0.25,s1:0.55,sway:0.25,mode:'fall'}},
  {build:buildIron,      aura:{color:0xdfe9ff,count:70, size:0.10,opacity:0.5, rx:1.15,ry:1.4,s0:0.12,s1:0.30,sway:0.12,mode:'rise'}},
  {build:buildFlame,     aura:{color:0xff7a26,count:130,size:0.16,opacity:0.95,rx:1.10,ry:1.6,s0:0.70,s1:1.50,sway:0.30,mode:'rise'}},
  {build:buildIce,       aura:{color:0xaee2ff,count:90, size:0.13,opacity:0.8, rx:1.25,ry:1.5,s0:0.18,s1:0.42,sway:0.30,mode:'fall'}},
  {build:buildPoison,    aura:{color:0x52ff7a,count:100,size:0.15,opacity:0.85,rx:1.15,ry:1.5,s0:0.40,s1:0.90,sway:0.45,mode:'rise'}},
  {build:buildLightning, aura:{color:0xffe95e,count:90, size:0.13,opacity:0.9, rx:1.20,ry:1.6,mode:'jitter'}},
  {build:buildDark,      aura:{color:0xa24bff,count:70, size:0.34,opacity:0.32,rx:1.15,ry:1.6,s0:0.12,s1:0.30,sway:0.20,mode:'rise'}}
];

const holders=[];
const N=defs.length, R=8.2;
defs.forEach((d,i)=>{
  const a=(i-(N-1)/2)*0.26;
  const holder=new THREE.Group();
  const shield=d.build();
  const aura=makeAura(d.aura); aura.position.z=0.1;
  const glow=makeGlowSprite(d.aura.color, 4.6, 0.28); glow.position.z=-0.5;
  const pl=new THREE.PointLight(d.aura.color, 0.5, 4); pl.position.set(0,0,1.1);
  holder.add(shield, aura, glow, pl);
  holder.position.set(Math.sin(a)*R, 1.35, R-Math.cos(a)*R);
  holder.rotation.y=-a*0.85;
  shieldsGroup.add(holder);
  holders.push({group:holder, aura, glow, phase:i*1.7, baseY:1.35, baseRot:-a*0.85});
});

let dragging=false, px=0;
renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;px=e.clientX;});
window.addEventListener('pointermove',e=>{
  if(!dragging||controls) return;
  shieldsGroup.rotation.y+=(e.clientX-px)*0.005; px=e.clientX;
});
window.addEventListener('pointerup',()=>dragging=false);

/* ============ ANIMASI ============ */
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  const t=clock.elapsedTime;
  holders.forEach(h=>{
    h.group.position.y=h.baseY+Math.sin(t*1.1+h.phase)*0.08;
    h.group.rotation.y=h.baseRot+Math.sin(t*0.55+h.phase)*0.10;
    h.glow.material.opacity=0.24+0.06*Math.sin(t*2+h.phase);
    updateAura(h.aura,t,dt);
  });
  if(controls) controls.update();
  renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
