<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kebun Minecraft 3D — Three.js</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{ --wood:#7a5230; --wood-d:#3e2a16; --green:#4c9a2a; --green-d:#245212; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none}
  html,body{width:100%;height:100%;overflow:hidden;font-family:'Press Start 2P',monospace;
    background:linear-gradient(#9fd7ee 0%,#d6eec6 100%)}
  #c{position:fixed;inset:0;display:block;touch-action:none}
  #ui{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;
    align-items:center;padding:12px;pointer-events:none}
  .top,.bottom{display:flex;flex-direction:column;align-items:center;gap:9px;pointer-events:auto}
  .title{color:#fff;font-size:12px;text-shadow:2px 2px 0 #0008;background:#00000045;
    padding:9px 14px;border:2px solid #0006}
  .chips,.phaseBtns{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:96vw}
  .btn{font-family:inherit;font-size:8px;line-height:1.5;color:#fff;background:var(--wood);
    border:3px solid var(--wood-d);border-bottom-width:6px;padding:9px 10px;cursor:pointer;
    text-shadow:1px 1px 0 #000a;text-align:center}
  .btn:hover{filter:brightness(1.15)}
  .btn:active{transform:translateY(2px);border-bottom-width:4px}
  .btn.active{background:var(--green);border-color:var(--green-d)}
  .btn .em{font-size:14px;display:block;margin-bottom:4px}
  .info{color:#fff;font-size:8px;background:#00000055;padding:8px 12px;border:2px solid #0006;
    text-shadow:1px 1px 0 #000;text-align:center}
  .hint{color:#ffffffcc;font-size:7px;text-shadow:1px 1px 0 #0008}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="ui">
  <div class="top">
    <div class="title">⛏️ KEBUN BLOK 3D</div>
    <div class="chips" id="plantChips"></div>
  </div>
  <div class="bottom">
    <div class="info" id="info"></div>
    <div class="phaseBtns" id="phaseBtns"></div>
    <button class="btn" id="playBtn">▶ ANIMASI TUMBUH</button>
    <div class="hint">🖱️ Geser untuk memutar 360°</div>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ================= DATA ================= */
const PLANTS = {
  tomat:    { name:'Tomat',    icon:'🍅' },
  wortel:   { name:'Wortel',   icon:'🥕' },
  kubis:    { name:'Kubis',    icon:'🥬' },
  gandum:   { name:'Gandum',   icon:'🌾' },
  semangka: { name:'Semangka', icon:'🍉' },
};
const PHASES = [
  { label:'Baru Ditanam',      icon:'🌱' },
  { label:'Hampir Siap Panen', icon:'🌿' },
  { label:'Siap Panen',        icon:'🧺' },
];
const rad = d => d * Math.PI / 180;

/* ================= RENDERER / SCENE ================= */
const canvas   = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, .1, 50);
camera.position.set(3.2, 2.5, 3.6);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, .85, 0);
controls.enableDamping = true;
controls.dampingFactor = .08;
controls.enableZoom = false;   // hanya rotate
controls.enablePan  = false;
controls.minPolarAngle = .15;
controls.maxPolarAngle = 1.5;

scene.add(new THREE.HemisphereLight(0xf2fff5, 0x9db07a, 1.05));
const sun = new THREE.DirectionalLight(0xfff2d6, 2.0);
sun.position.set(4, 7, 3);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left:-3, right:3, top:4, bottom:-2, near:1, far:15 });
scene.add(sun);
const fill = new THREE.DirectionalLight(0xcfe8ff, .5);
fill.position.set(-4, 3, -3);
scene.add(fill);

// penangkap bayangan halus (scene tetap polos)
const ground = new THREE.Mesh(new THREE.CircleGeometry(5, 40),
  new THREE.ShadowMaterial({ opacity:.18 }));
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

/* ================= TEKSTUR PIXEL (style Minecraft) ================= */
const texCache = {};
function pixelTex(hex, variation=.1){
  const key = hex+'_'+variation;
  if (texCache[key]) return texCache[key];
  const c = document.createElement('canvas'); c.width = c.height = 16;
  const x = c.getContext('2d');
  const col = new THREE.Color(hex);
  for (let j=0;j<16;j++) for (let i=0;i<16;i++){
    const v = 1 + (Math.random()*2-1)*variation;
    const cl = n => Math.min(255, Math.max(0, n|0));
    x.fillStyle = `rgb(${cl(col.r*255*v)},${cl(col.g*255*v)},${cl(col.b*255*v)})`;
    x.fillRect(i, j, 1, 1);
  }
  const t = new THREE.CanvasTexture(c);
  t.magFilter = t.minFilter = THREE.NearestFilter;
  t.colorSpace = THREE.SRGBColorSpace;
  return texCache[key] = t;
}
function farmlandTexture(){
  const c = document.createElement('canvas'); c.width = c.height = 16;
  const x = c.getContext('2d');
  for (let j=0;j<16;j++) for (let i=0;i<16;i++){
    let r=111, g=74, b=38;
    if (j % 6 < 2){ r*=.66; g*=.66; b*=.66; }         // alur bajakan
    const v = 1 + (Math.random()*2-1)*.09;
    x.fillStyle = `rgb(${r*v|0},${g*v|0},${b*v|0})`;
    x.fillRect(i, j, 1, 1);
  }
  const t = new THREE.CanvasTexture(c);
  t.magFilter = t.minFilter = THREE.NearestFilter;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function melonTexture(){
  const c = document.createElement('canvas'); c.width = c.height = 16;
  const x = c.getContext('2d');
  for (let j=0;j<16;j++) for (let i=0;i<16;i++){
    const base = (i % 4 < 2) ? [58,125,35] : [142,209,92]; // belang semangka
    const v = 1 + (Math.random()*2-1)*.08;
    x.fillStyle = `rgb(${base[0]*v|0},${base[1]*v|0},${base[2]*v|0})`;
    x.fillRect(i, j, 1, 1);
  }
  const t = new THREE.CanvasTexture(c);
  t.magFilter = t.minFilter = THREE.NearestFilter;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const matCache = {};
function mat(color, variation=.1){
  const k = color+'_'+variation;
  if (!matCache[k]) matCache[k] = new THREE.MeshLambertMaterial({ map: pixelTex(color, variation) });
  return matCache[k];
}
const melonMat = new THREE.MeshLambertMaterial({ map: melonTexture() });

/* ================= TANAH / PETAK ================= */
const dirtSide   = mat('#7a5230', .16);
const dirtTop    = new THREE.MeshLambertMaterial({ map: farmlandTexture() });
const dirtBottom = mat('#5e3f24', .14);
const soil = new THREE.Mesh(new THREE.BoxGeometry(1.8, .8, 1.8),
  [dirtSide, dirtSide, dirtTop, dirtBottom, dirtSide, dirtSide]);
soil.position.y = .4;
soil.castShadow = soil.receiveShadow = true;
scene.add(soil);

const plantGroup = new THREE.Group();
plantGroup.position.y = .8;                 // permukaan tanah
scene.add(plantGroup);

/* ================= DEFINISI TANAMAN =================
   Setiap part: fase muncul (phase), opsional fase hilang (until),
   ukuran, posisi, warna/tekstur, rotasi.                           */
function buildParts(type){
  const P = [];
  const add = (phase, size, pos, color, opt={}) =>
    P.push({ phase, size, pos, color, until:opt.until, rot:opt.rot,
             tex:opt.tex, variation:opt.variation });

  if (type === 'tomat'){
    const stem='#4e821f', leaf='#59a02b', leafD='#3e7d19', tg='#97b83f';
    const pt = (ang, d, y) => [Math.cos(ang)*d, y, Math.sin(ang)*d];
    const branch = (phase, y, ang, len) => {
      add(phase,[len,.06,.06],[Math.cos(ang)*len/2, y, Math.sin(ang)*len/2],stem,{rot:{y:-ang}});
      add(phase,[.24,.05,.17],pt(ang, len+.09, y+.04),leaf,{rot:{y:-ang}});
    };
    // Fase 1 — kecambah
    add(1,[.1,.34,.1],[0,.17,0],stem);
    add(1,[.26,.05,.14],[-.14,.26,0],leaf,{rot:{z:.55}});
    add(1,[.26,.05,.14],[ .14,.26,0],leaf,{rot:{z:-.55}});
    // Fase 2 — batang & cabang, buah hijau kecil
    add(2,[.1,.55,.1],[0,.62,0],stem);
    branch(2,.52, 0, .36);
    branch(2,.68, rad(115), .34);
    branch(2,.80, rad(215), .30);
    add(2,[.2,.05,.15],[.3,.62,-.12],leafD,{rot:{y:.8}});
    add(2,[.16,.15,.16],[.4,.42,.05],tg);
    add(2,[.14,.13,.14],[-.14,.585,.31],tg);
    // Fase 3 — tomat merah matang
    add(3,[.1,.2,.1],[0,.97,0],stem);
    add(3,[.22,.05,.16],[.08,1.02,.06],leaf,{rot:{y:.7,z:.25}});
    add(3,[.22,.05,.16],[-.09,1.0,-.05],leaf,{rot:{y:2.2,z:-.2}});
    add(3,[.2,.05,.15],[.02,1.06,-.09],leafD,{rot:{y:-1.1,z:.15}});
    const T = (x,y,z,s) => { add(3,[s,s*.92,s],[x,y,z],'#e2451e',{variation:.07});
                             add(3,[s*.38,.06,s*.38],[x,y+s*.46+.03,z],'#2f6417'); };
    T(.45,.38,.03,.30);   T(-.16,.55,.33,.27);
    T(-.27,.66,-.19,.28); T(-.22,.24,-.25,.20);
  }

  if (type === 'wortel'){
    const g1='#4f9e23', g2='#3f8a1c', or1='#e07f1d', or2='#c96f15';
    // Fase 1
    for (let i=0;i<4;i++){ const a=rad(i*90+45);
      add(1,[.05,.26,.05],[Math.cos(a)*.06,.13,Math.sin(a)*.06], i%2?g1:g2,
          {rot:{z:i%2?.18:-.15}}); }
    // Fase 2 — daun rimbun (diganti fase 3)
    for (let i=0;i<8;i++){ const a=rad(i*45+20), h=.38+(i%3)*.06;
      add(2,[.05,h,.05],[Math.cos(a)*.11,h/2,Math.sin(a)*.11], i%2?g1:g2,
          {until:3, rot:{z:(i%2?1:-1)*(.16+(i%3)*.06)}}); }
    for (let i=0;i<3;i++){ const a=rad(i*120+30);
      add(2,[.13,.1,.13],[Math.cos(a)*.08,.46,Math.sin(a)*.08],g2,{until:3}); }
    // Fase 3 — bonggol wortel terlihat + daun dari atasnya
    add(3,[.32,.24,.32],[0,.04,0],or1,{variation:.08});
    add(3,[.24,.14,.24],[0,.17,0],or2,{variation:.08});
    add(3,[.16,.06,.16],[0,.26,0],'#b96511');
    for (let i=0;i<9;i++){ const a=rad(i*40+10), h=.42+(i%3)*.08;
      add(3,[.05,h,.05],[Math.cos(a)*.09,.28+h/2,Math.sin(a)*.09], i%2?g1:g2,
          {rot:{z:(i%2?1:-1)*(.2+(i%3)*.07)}}); }
    for (let i=0;i<4;i++){ const a=rad(i*90+45);
      add(3,[.15,.12,.15],[Math.cos(a)*.1,.74,Math.sin(a)*.1],g2); }
  }

  if (type === 'kubis'){
    const out='#5f9e30', mid='#74b23c', in1='#8fc95f', head='#a3d977', headD='#8fc45f';
    // Fase 1
    add(1,[.08,.2,.08],[0,.1,0],'#4e821f');
    add(1,[.2,.04,.12],[-.11,.18,0],mid,{rot:{z:.5}});
    add(1,[.2,.04,.12],[ .11,.18,0],mid,{rot:{z:-.5}});
    // Fase 2 — daun pembuka
    for (let i=0;i<5;i++){ const a=rad(i*72);
      add(2,[.38,.28,.1],[Math.cos(a)*.24,.17,Math.sin(a)*.24],out,
          {rot:{y:-a,z:.55,order:'YZX'}}); }
    for (let i=0;i<4;i++){ const a=rad(i*90+40);
      add(2,[.3,.24,.09],[Math.cos(a)*.13,.2,Math.sin(a)*.13],mid,
          {rot:{y:-a,z:.28,order:'YZX'}}); }
    add(2,[.17,.2,.17],[0,.22,0],in1);
    // Fase 3 — kepala kubis bulat
    add(3,[.46,.4,.46],[0,.4,0],head,{variation:.05});
    add(3,[.32,.14,.32],[0,.63,0],headD,{variation:.05});
    add(3,[.2,.12,.2],[.12,.66,.1],head);
    add(3,[.18,.12,.18],[-.1,.68,-.08],head);
    for (let i=0;i<4;i++){ const a=rad(i*90+15);
      add(3,[.32,.38,.09],[Math.cos(a)*.3,.34,Math.sin(a)*.3],out,
          {rot:{y:-a,z:.12,order:'YZX'}}); }
  }

  if (type === 'gandum'){
    const wg='#69a82d', wgold='#d4a431', wear='#e6c25a', wawn='#c9a53b';
    const stalks = [];
    for (let i=0;i<6;i++) stalks.push({ a:rad(i*60+15), r:.13, tilt:.14, h:.6 });
    stalks.push({ a:0, r:0, tilt:0, h:.66 });
    // Fase 1
    for (let i=0;i<4;i++){ const a=rad(i*90+30);
      add(1,[.05,.3,.05],[Math.cos(a)*.05,.15,Math.sin(a)*.05], i%2?wg:'#5d9926',
          {rot:{z:i%2?.14:-.14}}); }
    // Fase 2 — batang hijau (berubah emas di fase 3)
    stalks.forEach(s=>{
      const cr=s.r+Math.sin(s.tilt)*s.h/2, cy=Math.cos(s.tilt)*s.h/2;
      add(2,[.06,s.h,.06],[Math.cos(s.a)*cr,cy,Math.sin(s.a)*cr],wg,
          {until:3, rot:{y:-s.a,z:s.tilt,order:'YZX'}});
    });
    [0,2,4].forEach(i=>{ const s=stalks[i];
      add(2,[.26,.04,.09],[Math.cos(s.a)*.16,.3,Math.sin(s.a)*.16],wg,
          {until:3, rot:{y:-s.a,z:.5,order:'YZX'}}); });
    // Fase 3 — batang emas + bulir gandum
    stalks.forEach(s=>{
      const cr=s.r+Math.sin(s.tilt)*s.h/2, cy=Math.cos(s.tilt)*s.h/2;
      add(3,[.07,s.h,.07],[Math.cos(s.a)*cr,cy,Math.sin(s.a)*cr],wgold,
          {rot:{y:-s.a,z:s.tilt,order:'YZX'}});
      const er=s.r+Math.sin(s.tilt)*(s.h+.16), ey=Math.cos(s.tilt)*(s.h+.16);
      add(3,[.16,.32,.16],[Math.cos(s.a)*er,ey,Math.sin(s.a)*er],wear,{variation:.07,
          rot:{y:-s.a,z:s.tilt,order:'YZX'}});
      const ar=s.r+Math.sin(s.tilt)*(s.h+.32), ay=Math.cos(s.tilt)*(s.h+.32)+.09;
      [[.05,0],[-.04,.04],[0,-.05]].forEach(o=>
        add(3,[.03,.2,.03],[Math.cos(s.a)*ar+o[0],ay,Math.sin(s.a)*ar+o[1]],wawn,
            {rot:{z:(o[0]+o[1])>0?.2:-.15}}));
    });
  }

  if (type === 'semangka'){
    const vine='#4e821f', wl='#5fae33', fl='#f4c531';
    // Fase 1
    add(1,[.09,.22,.09],[0,.11,0],vine);
    add(1,[.2,.05,.15],[-.13,.2,0],wl,{rot:{z:.4}});
    add(1,[.2,.05,.15],[ .13,.2,0],wl,{rot:{z:-.4}});
    // Fase 2 — sulur menjalar + bunga
    add(2,[.55,.07,.07],[.3,.055,0],vine);
    add(2,[.4,.06,.06],[Math.cos(2.1)*.22,.05,Math.sin(2.1)*.22],vine,{rot:{y:-2.1}});
    add(2,[.22,.05,.2],[.22,.1,.12],wl,{rot:{y:.5,z:.12}});
    add(2,[.22,.05,.2],[.42,.1,-.14],wl,{rot:{y:-.4,z:.1}});
    add(2,[.2,.05,.18],[Math.cos(2.1)*.4,.09,Math.sin(2.1)*.4],wl,{rot:{y:-2.1}});
    add(2,[.14,.04,.05],[.52,.08,.1],vine,{rot:{y:.8}});
    add(2,[.12,.12,.12],[.6,.13,0],fl,{until:3});
    add(2,[.06,.06,.06],[.6,.21,0],'#e8a12c',{until:3});
    // Fase 3 — buah semangka belang
    add(3,[.62,.56,.62],[.44,.3,0],null,{tex:'melon'});
    add(3,[.2,.06,.06],[.06,.06,0],vine);
    add(3,[.2,.05,.18],[.16,.1,.2],wl,{rot:{y:.9,z:.15}});
    add(3,[.18,.04,.16],[.2,.09,-.18],wl,{rot:{y:-.7}});
  }
  return P;
}

function makeMesh(p){
  const geo = new THREE.BoxGeometry(p.size[0], p.size[1], p.size[2]);
  const material = p.tex === 'melon' ? melonMat : mat(p.color, p.variation || .1);
  const m = new THREE.Mesh(geo, material);
  m.position.set(p.pos[0], p.pos[1], p.pos[2]);
  if (p.rot){ m.rotation.order = p.rot.order || 'XYZ';
              m.rotation.set(p.rot.x||0, p.rot.y||0, p.rot.z||0); }
  m.castShadow = m.receiveShadow = true;
  m.userData = { phase: p.phase, until: p.until };
  return m;
}

/* ================= STATE & ANIMASI ================= */
let currentPlant = 'tomat', currentPhase = 3;
let meshes = [], growthAnims = [];

function rebuild(){
  for (let i=plantGroup.children.length-1; i>=0; i--){
    const m = plantGroup.children[i];
    m.geometry.dispose();
    plantGroup.remove(m);
  }
  meshes = buildParts(currentPlant).map(makeMesh);
  meshes.forEach(m => plantGroup.add(m));
}

const easeOutBack = t => { const c1=1.70158, c3=c1+1;
  return 1 + c3*Math.pow(t-1,3) + c1*Math.pow(t-1,2); };

function setPhase(p){
  currentPhase = p;
  growthAnims.length = 0;
  meshes.forEach(m=>{
    const u = m.userData;
    m.visible = u.phase <= p && (!u.until || p < u.until);
    m.scale.setScalar(1);
  });
  // animasi tumbuh berurutan: fase 1 dulu, lalu 2, lalu 3 (pop + stagger)
  const shown = meshes.filter(m=>m.visible)
    .sort((a,b)=> a.userData.phase - b.userData.phase || a.position.y - b.position.y);
  const now = performance.now();
  let lastPh = -1, idx = 0;
  shown.forEach(m=>{
    if (m.userData.phase !== lastPh){ lastPh = m.userData.phase; idx = 0; }
    m.scale.setScalar(.001);
    growthAnims.push({ m, start: now + (m.userData.phase-1)*430 + idx*55 + 60, dur: 600 });
    idx++;
  });
  updateUI();
}

/* ================= UI ================= */
const plantChips = document.getElementById('plantChips');
const phaseBtns  = document.getElementById('phaseBtns');
const info       = document.getElementById('info');
const playBtn    = document.getElementById('playBtn');

Object.entries(PLANTS).forEach(([key, v])=>{
  const b = document.createElement('button');
  b.className = 'btn'; b.dataset.plant = key;
  b.innerHTML = `<span class="em">${v.icon}</span>${v.name.toUpperCase()}`;
  b.onclick = ()=>{ stopPlay();
    if (currentPlant !== key){ currentPlant = key; rebuild(); }
    setPhase(currentPhase); };
  plantChips.appendChild(b);
});
PHASES.forEach((p, i)=>{
  const b = document.createElement('button');
  b.className = 'btn'; b.dataset.phase = i+1;
  b.innerHTML = `${p.icon}<br>${p.label.toUpperCase()}`;
  b.onclick = ()=>{ stopPlay(); setPhase(i+1); };
  phaseBtns.appendChild(b);
});

function updateUI(){
  document.querySelectorAll('#plantChips .btn')
    .forEach(b=>b.classList.toggle('active', b.dataset.plant === currentPlant));
  document.querySelectorAll('#phaseBtns .btn')
    .forEach(b=>b.classList.toggle('active', +b.dataset.phase === currentPhase));
  const ph = PHASES[currentPhase-1];
  info.textContent = `${PLANTS[currentPlant].icon} ${PLANTS[currentPlant].name.toUpperCase()} — ${ph.icon} ${ph.label.toUpperCase()}`;
}

let playT = [], playing = false;
function stopPlay(){
  playT.forEach(clearTimeout); playT = [];
  playing = false;
  playBtn.innerHTML = '▶ ANIMASI TUMBUH';
  playBtn.classList.remove('active');
}
playBtn.onclick = ()=>{
  if (playing){ stopPlay(); return; }
  playing = true;
  playBtn.innerHTML = '⏸ HENTIKAN';
  playBtn.classList.add('active');
  setPhase(1);
  playT.push(setTimeout(()=>setPhase(2), 1800));
  playT.push(setTimeout(()=>setPhase(3), 3600));
  playT.push(setTimeout(stopPlay, 6600));
};

/* ================= LOOP ================= */
function tick(){
  requestAnimationFrame(tick);
  const now = performance.now();
  for (let i=growthAnims.length-1; i>=0; i--){
    const a = growthAnims[i], t = (now - a.start) / a.dur;
    if (t < 0) continue;
    if (t >= 1){ a.m.scale.setScalar(1); growthAnims.splice(i,1); }
    else a.m.scale.setScalar(Math.max(easeOutBack(t), .001));
  }
  plantGroup.rotation.z = Math.sin(now * .0011) * .018;  // goyang halus
  controls.update();
  renderer.render(scene, camera);
}

addEventListener('resize', ()=>{
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* mulai */
rebuild();
setPhase(3);
