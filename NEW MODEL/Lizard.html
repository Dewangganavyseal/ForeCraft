/* ================= UTIL VOXEL ================= */
const unitBox = new THREE.BoxGeometry(1,1,1);
const _d = new THREE.Object3D();
const _c = new THREE.Color();

function vox(list, x,y,z, w,h,d, c, rx=0, ry=0, rz=0){
  list.push([x,y,z,w,h,d,c,rx,ry,rz]);
}
function buildVoxelMesh(list){
  const im = new THREE.InstancedMesh(unitBox,
    new THREE.MeshLambertMaterial({ color:0xffffff }), list.length);
  list.forEach((b,i)=>{
    _d.position.set(b[0],b[1],b[2]);
    _d.scale.set(b[3],b[4],b[5]);
    _d.rotation.set(b[7],b[8],b[9]);
    _d.updateMatrix();
    im.setMatrixAt(i,_d.matrix);
    im.setColorAt(i,_c.set(b[6]));
  });
  im.instanceMatrix.needsUpdate = true;
  if (im.instanceColor) im.instanceColor.needsUpdate = true;
  im.castShadow = true; im.receiveShadow = true;
  im.frustumCulled = false;
  return im;
}
const easeO  = t => 1-Math.pow(1-t,3);
const easeIO = t => t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
const clamp01= t => Math.max(0, Math.min(1, t));

function legPart(){
  const hip = new THREE.Group(), knee = new THREE.Group(), foot = new THREE.Group();
  const L=[]; vox(L,0,-0.8,0, 1.5,1.7,1.7, C.skin);

              vox(S,0,-0.95,0.02, 0.95,0.5,1.0, C.dark);
  const F=[]; vox(F,0,-0.1,0.3, 1.4,0.5,1.7, C.skin);

  foot.position.set(0,-1.0,0.05); foot.add(buildVoxelMesh(F));
  knee.add(foot); hip.add(knee);
  return { hip, knee, foot };
}

/* ================= SISTEM PARTIKEL (murah, instanced) ================= */
function makePIM(size, count){
  const im = new THREE.InstancedMesh(
    new THREE.BoxGeometry(size,size,size),
    new THREE.MeshBasicMaterial({ color:0xffffff }), count);
  im.frustumCulled = false;
  _d.scale.set(0,0,0); _d.updateMatrix();
  for(let i=0;i<count;i++){ im.setMatrixAt(i,_d.matrix); im.setColorAt(i,_c.set(0xffffff)); }
  im.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  scene.add(im);
  return im;
}
const PMAX = 80, acidIM = makePIM(0.42, PMAX);
const acids = Array.from({length:PMAX},()=>({ on:false, delay:0, rot:0,
  p:new THREE.Vector3(), v:new THREE.Vector3() }));

const SMAX = 64, sparkIM = makePIM(0.3, SMAX);
const sparks = Array.from({length:SMAX},()=>({ on:false, life:0, max:1, size:1,
  p:new THREE.Vector3(), v:new THREE.Vector3() }));

function spawnSpark(pos, vel, color, life=0.4, size=1){
  const s = sparks.find(s=>!s.on); if(!s) return;
  s.on=true; s.life=life; s.max=life; s.size=size;
  s.p.copy(pos); s.v.copy(vel);
  sparkIM.setColorAt(sparks.indexOf(s), _c.set(color));
  sparkIM.instanceColor.needsUpdate = true;
}
function spawnSparks(pos, n, color, spd){
  for(let i=0;i<n;i++){
    const v = new THREE.Vector3((Math.random()-.5)*2, Math.random()*1.4, (Math.random()-.5)*2)
      .normalize().multiplyScalar(spd*(0.5+Math.random()*0.8));
    spawnSpark(pos, v, color, 0.3+Math.random()*0.25, 0.7+Math.random()*0.7);
  }
}

/* ---- splash / genangan asam ---- */
const ringGeo = new THREE.RingGeometry(0.32,0.5,22);

const fx = [];
function spawnRing(pos, color=0x46c02a, sMax=3, dur=0.5, op=0.85){
  const m = new THREE.Mesh(ringGeo,
    new THREE.MeshBasicMaterial({ color, transparent:true, opacity:op, depthWrite:false }));
  m.rotation.x = -Math.PI/2; m.position.set(pos.x, 0.03, pos.z);
  m.scale.setScalar(0.4); m.renderOrder = 2; scene.add(m);
  fx.push({ m, t:0, dur, type:'ring', sMax });
}
function spawnPuddle(pos){

  m.scale.setScalar(0.8+Math.random()*0.9); m.renderOrder = 1; scene.add(m);
  fx.push({ m, t:0, dur:2.4, type:'pud' });
}

/* ---- slash arc (efek hack n slash) ---- */
const arcGeo = new THREE.RingGeometry(0.52, 1, 40, 1, 0, 4.4);
const slashes = [], slashPool = [];
const _qx = new THREE.Quaternion(), _qy = new THREE.Quaternion(), _qz = new THREE.Quaternion();
const XA = new THREE.Vector3(1,0,0), YA = new THREE.Vector3(0,1,0), ZA = new THREE.Vector3(0,0,1);
function spawnSlash(o){
  let m = slashPool.pop();
  if(!m){
    m = new THREE.Mesh(arcGeo, new THREE.MeshBasicMaterial({
      transparent:true, opacity:0, depthWrite:false, side:THREE.DoubleSide }));
    m.renderOrder = 4; scene.add(m);
  }
  m.material.color.set(o.color); m.visible = true;
  slashes.push({ m, t:-(o.delay||0), dur:o.dur||0.25, s0:o.s0||1, s1:o.s1||2,
    pos:o.pos.clone(), flat:!!o.flat, spin:o.spin||0, ang:Math.random()*Math.PI*2 });
}

const DUR = { bite:0.62, tail:1.2, acid:1.05 };
const A = { jaw:0, headP:0, headZ:0, rootZ:0, bodyP:0, bodyY:0, crouch:0, spin:0, glow:0, tc:[0,0,0] };
function resetPose(){
  A.jaw=A.headP=A.headZ=A.rootZ=A.bodyP=A.bodyY=A.crouch=A.spin=A.glow=0;
  A.tc[0]=A.tc[1]=A.tc[2]=0;

function hitstop(t){ freeze = Math.max(freeze, t); }

const _v = new THREE.Vector3(), _f = new THREE.Vector3(), _q = new THREE.Quaternion();
function mouthPose(){
  root.updateMatrixWorld(true);
  mouth.getWorldPosition(_v);
  head.getWorldQuaternion(_q);
  _f.set(0,0.22,1).normalize().applyQuaternion(_q);
  return { p:_v, f:_f };
}

/* ---- dampak serangan (hack n slash juice) ---- */
function biteImpact(){
  const {p,f} = mouthPose();
  const pos = p.clone().addScaledVector(f, 1.1);
  spawnSlash({ pos, s0:1.4, s1:2.7, dur:0.22, color:0x2fae24, spin: 6 });
  spawnSlash({ pos, s0:1.2, s1:2.9, dur:0.24, color:0x7be05a, delay:0.05, spin:-7 });
  spawnSparks(pos, 10, 0x8fd67c, 7);
  hitstop(0.07); shake = 0.4;
}
function tailImpact(){
  spawnSlash({ pos:new THREE.Vector3(0,1.5,0), flat:true, s0:2.2, s1:6.5, dur:0.3, color:0x2fae24, spin:2.2 });
  spawnSlash({ pos:new THREE.Vector3(0,1.1,0), flat:true, s0:1.6, s1:5.2, dur:0.3, color:0x86e268, delay:0.07, spin:-2.8 });
  for(let i=0;i<14;i++){
    const a = i/14*Math.PI*2;
    spawnSpark(
      new THREE.Vector3(Math.cos(a)*3.4, 1.0, Math.sin(a)*3.4),
      new THREE.Vector3(Math.cos(a)*6, 3+Math.random()*2, Math.sin(a)*6),
      0xa5de8b, 0.4, 1);
  }
  hitstop(0.09); shake = 0.55;
}
function acidBurst(){
  const {p,f} = mouthPose();
  const cols = [0x4fd41f, 0x74ef3a, 0x3cb418];
  for(let i=0;i<16;i++){
    const a = acids.find(a=>!a.on); if(!a) break;
    a.on=true; a.delay=i*0.012; a.rot=Math.random()*6;
    a.p.copy(p).addScaledVector(f, 0.2);
    const dir = f.clone();
    dir.x += (Math.random()-.5)*0.4; dir.y += (Math.random()-.5)*0.3;
    dir.z += (Math.random()-.5)*0.2; dir.normalize();
    a.v.copy(dir).multiplyScalar(11+Math.random()*5);
    a.v.y += 1.5+Math.random()*2.5;
    acidIM.setColorAt(acids.indexOf(a), _c.set(cols[i%3]));
  }
  acidIM.instanceColor.needsUpdate = true;
  spawnSlash({ pos:p.clone(), s0:0.8, s1:1.9, dur:0.2, color:0x3fbf22 });
  spawnSparks(p, 6, 0x74ef3a, 4);
  shake = 0.2;
}

/* ---- timeline serangan ---- */
function updateAttack(dt){
  if(!attack) return;
  attack.t += dt;
  const a = attack, d = DUR[a.n], p = a.t/d;
  if(p >= 1){ attack = null; root.rotation.y = 0; return; }

  if(a.n === 'bite'){
    if(p < 0.32){ const k = easeO(p/0.32);
      A.jaw=1.15*k; A.headP=-0.16*k; A.rootZ=-0.18*k; A.bodyP=-0.05*k;
    } else if(p < 0.46){ const k=(p-0.32)/0.14, e=k*k;
      A.jaw=1.15*(1-e); A.headP=-0.16+0.55*e; A.rootZ=-0.18+0.85*e; A.bodyP=-0.05+0.22*e;
      if(!a.f.hit && k>0.8){ a.f.hit=1; biteImpact(); }
    } else { const k=easeO((p-0.46)/0.54);
      A.jaw=0.12*(1-k); A.headP=0.39*(1-k); A.rootZ=0.67*(1-k); A.bodyP=0.17*(1-k);
    }
  }
  else if(a.n === 'tail'){
    if(p < 0.16){ const k=easeO(p/0.16);
      A.crouch=k; A.bodyP=-0.08*k;
      A.tc=[k*1.15, k*1.35, k*1.5];
    } else if(p < 0.82){ const k=(p-0.16)/0.66;
      const e = easeIO(k);
      A.spin = e*Math.PI*2;
      A.crouch = 1;
      for(let i=0;i<3;i++){
        const ei = easeIO(clamp01(k*1.25 - i*0.12));
        A.tc[i] = (1.15+i*0.2)*(1-ei) - 0.1*ei;
      }
      if(!a.f.hit && e>0.5){ a.f.hit=1; tailImpact(); }
    } else { const k=easeO((p-0.82)/0.18);
      A.crouch = 1-k;
      A.spin = Math.PI*2 + Math.sin(k*Math.PI*3)*0.05*(1-k);
    }
  }
  else { /* acid */
    if(p < 0.3){ const k=easeO(p/0.3);
      A.jaw=1.25*k + Math.sin(time*30)*0.03*k; A.headP=-0.3*k;
      A.bodyP=-0.2*k; A.rootZ=-0.25*k; A.glow=k; A.crouch=0.15*k;
    } else if(p < 0.5){ const k=(p-0.3)/0.2, e=k*k;
      A.headP=-0.3+0.75*e; A.bodyP=-0.2+0.35*e; A.rootZ=-0.25+0.6*e;
      A.jaw=1.25-0.35*e; A.glow=1-k;
      if(!a.f.sp){ a.f.sp=1; acidBurst(); }
    } else { const k=easeO((p-0.5)/0.5);
      A.headP=0.45*(1-k); A.bodyP=0.15*(1-k); A.rootZ=0.35*(1-k);
      A.jaw=0.9*(1-k); A.glow=0;
    }
  }
}

/* ---- pose per frame ---- */
function applyPose(){
  const gw=ampW, gr=ampR, gm=Math.min(1,gw+gr);
  const ampSwing = 0.55*gw + 0.95*gr;
  const ampKnee  = 0.5*gw  + 0.95*gr;

  root.position.set(0, 0, A.rootZ);
  root.rotation.y = A.spin + Math.sin(time*0.8)*0.03*(1-gm);

  const bob = Math.sin(phase*2)*0.09*gw + Math.abs(Math.sin(phase))*0.24*gr;
  body.position.y = A.bodyY - A.crouch*0.5 + bob;
  body.rotation.x = A.bodyP + 0.1*gr + Math.sin(phase*2+1.2)*0.03*gw;
  body.rotation.y = Math.sin(phase)*0.045*gw + Math.sin(phase)*0.02*gr;
  body.rotation.z = Math.sin(phase)*0.05*(gw+0.6*gr);
  torsoMesh.scale.y = 1 + Math.sin(time*2.2)*0.012; // napas

  head.position.set(0, 3.55, 3.2 + A.headZ);
  head.rotation.x = A.headP + Math.sin(phase*2+0.5)*0.05*gm
                  + Math.sin(time*1.3)*0.035*(1-gm);
  jaw.rotation.x  = A.jaw + gr*0.1*(0.6+0.4*Math.sin(time*10));

  for(const L of legs){
    const sw   = Math.sin(phase + L.off);
    const lift = Math.max(0, Math.sin(phase + L.off + 1.15));
    L.hip.rotation.x  = -sw*ampSwing + A.crouch*0.55;
    L.hip.rotation.z  = L.side*0.12 + sw*0.04;
    L.knee.rotation.x = lift*ampKnee + A.crouch*0.95;
  }
  for(let i=0;i<3;i++){
    const idleSway = Math.sin(time*1.4 + i*0.9)*0.09*(1-gm*0.55);
    const gaitSway = Math.sin(phase + i*0.75)*(0.14*gw + 0.09*gr);
    tailSegs[i].rotation.y = A.tc[i] + idleSway + gaitSway;
    tailSegs[i].rotation.x = baseTailX[i]*(1-gr*0.6);
  }
  const gs = A.glow*(2.1 + Math.sin(time*22)*0.35);
  glow.scale.set(gs, gs, 1);
  glow.material.opacity = Math.min(1, A.glow*1.2);
}

/* ---- lidah ---- */
let tongueT = 1.5, flick = 0;
function updateTongue(dt){
  tongueT -= dt;
  if(tongueT <= 0 && !attack){ flick = 0.5; tongueT = 2.2 + Math.random()*2.8; }
  let s = 0;
  if(flick > 0){
    flick -= dt;
    const k = Math.sin(Math.PI*clamp01(1-flick/0.5));
    s = k*1.7; tongueG.rotation.y = Math.sin(time*28)*0.18*k;
  }
  if(attack && attack.n==='acid' && A.jaw > 0.3) s = Math.max(s, 1.1);
  tongueG.scale.z = Math.max(0.001, s);
  tongueG.visible = s > 0.01;
}

/* ---- update partikel & fx ---- */
function updateParticles(dt){
  _d.rotation.set(0,0,0);
  for(let i=0;i<PMAX;i++){
    const a = acids[i];
    if(!a.on){ _d.scale.set(0,0,0); _d.position.set(0,-10,0); _d.updateMatrix(); acidIM.setMatrixAt(i,_d.matrix); continue; }
    if(a.delay > 0){ a.delay -= dt; _d.scale.set(0,0,0); _d.updateMatrix(); acidIM.setMatrixAt(i,_d.matrix); continue; }
    a.v.y -= 24*dt;
    a.p.addScaledVector(a.v, dt);
    a.rot += dt*8;
    if(a.p.y <= 0.12 && a.v.y < 0){
      a.on = false;
      spawnRing(a.p); spawnPuddle(a.p);
      spawnSpark(a.p, new THREE.Vector3((Math.random()-.5)*3, 3+Math.random()*2, (Math.random()-.5)*3), 0x74ef3a, 0.3, 0.6);
      continue;
    }
    _d.position.copy(a.p); _d.rotation.set(a.rot, a.rot*1.3, 0);
    _d.scale.set(1,1,1); _d.updateMatrix(); acidIM.setMatrixAt(i,_d.matrix);
  }
  acidIM.instanceMatrix.needsUpdate = true;

  for(let i=0;i<SMAX;i++){
    const s = sparks[i];
    if(!s.on){ _d.scale.set(0,0,0); _d.position.set(0,-10,0); _d.updateMatrix(); sparkIM.setMatrixAt(i,_d.matrix); continue; }
    s.life -= dt;
    if(s.life <= 0){ s.on = false; continue; }
    s.v.y -= 16*dt; s.p.addScaledVector(s.v, dt);
    if(s.p.y < 0.06 && s.v.y < 0){ s.p.y = 0.06; s.v.y *= -0.35; s.v.x *= 0.7; s.v.z *= 0.7; }
    _d.position.copy(s.p); _d.rotation.set(s.life*9, s.life*7, 0);
    _d.scale.setScalar(s.size*(s.life/s.max)); _d.updateMatrix(); sparkIM.setMatrixAt(i,_d.matrix);
  }
  sparkIM.instanceMatrix.needsUpdate = true;

  for(let i=fx.length-1;i>=0;i--){
    const f = fx[i]; f.t += dt;
    const k = clamp01(f.t/f.dur);
    if(f.type === 'ring'){
      f.m.scale.setScalar(0.4 + f.sMax*easeO(k));
      f.m.material.opacity = 0.85*(1-k);
    } else f.m.material.opacity = 0.32*(1-k);
    if(k >= 1){ scene.remove(f.m); f.m.material.dispose(); fx.splice(i,1); }
  }

  for(let i=slashes.length-1;i>=0;i--){
    const s = slashes[i]; s.t += dt;
    if(s.t < 0) continue;
    const k = clamp01(s.t/s.dur);
    const ang = s.ang + s.spin*s.t;
    if(s.flat){
      _qy.setFromAxisAngle(YA, ang); _qx.setFromAxisAngle(XA, -Math.PI/2);
      s.m.quaternion.copy(_qy).multiply(_qx);
    } else {
      _qz.setFromAxisAngle(ZA, ang);
      s.m.quaternion.copy(camera.quaternion).multiply(_qz);
    }
    const sc = s.s0 + (s.s1-s.s0)*easeO(k);
    s.m.scale.setScalar(sc);
    s.m.position.copy(s.pos);
    s.m.material.opacity = (1-k)*0.9;
    if(k >= 1){
      s.m.visible = false; slashPool.push(s.m); slashes.splice(i,1);
    }
  }
}

/* ================= AUTO DEMO & UI ================= */
let demo = true, demoT = 3, demoI = 0;
const seq = [
  ['walk',3.4],['run',2.8],['bite',1.5],['walk',1.4],['tail',2.0],
  ['run',1.8],['acid',2.0],['idle',1.4],['bite',1.3],['acid',1.8]
];
function updateDemo(dt){
  if(!demo) return;
  demoT -= dt;
  if(demoT > 0 || attack) return;
  const [a,d] = seq[demoI++ % seq.length];
  demoT = d;
  if(a==='bite'||a==='tail'||a==='acid') startAttack(a);
  else setLoco(a, true);
}

const stateEl = document.getElementById('state');
const demoBtn = document.getElementById('demoBtn');
const LABEL = { idle:'IDLE', walk:'JALAN', run:'LARI', bite:'GIGIT', tail:'SAPUAN EKOR', acid:'ASAM' };
function setLoco(v, fromDemo=false){
  loco = v;
  document.querySelectorAll('button:not(#demoBtn)').forEach(b=>
    b.classList.toggle('active', b.dataset.a === v));
  if(!fromDemo) stateElNeedsUpdate = true;
}
let stateElNeedsUpdate = true;
document.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
  const a = b.dataset.a;
  if(a === 'demo'){
    demo = !demo; demoBtn.classList.toggle('active', demo);
    if(demo) demoT = 0.01;
    return;
  }
  demo = false; demoBtn.classList.remove('active');
  if(a==='idle'||a==='walk'||a==='run') setLoco(a);
  else startAttack(a);
}));
addEventListener('keydown', e=>{
  const map = { '1':'idle','2':'walk','3':'run','4':'bite','5':'tail','6':'acid' };
  if(map[e.key]){ demo=false; demoBtn.classList.remove('active');
    if(e.key<=3) setLoco(map[e.key]); else startAttack(map[e.key]); }
  if(e.key==='d'||e.key==='D') demoBtn.click();
});

/* ================= LOOP UTAMA ================= */
const clock = new THREE.Clock();
const shakeOff = new THREE.Vector3();
setLoco('walk', true);

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  let adt = dt;
  if(freeze > 0){ freeze -= dt; adt = dt*0.05; } // hit-stop
  time += adt;

  updateDemo(adt);

  const tW = loco==='walk'?1:0, tR = loco==='run'?1:0;
  ampW += (tW-ampW)*Math.min(1, adt*5);
  ampR += (tR-ampR)*Math.min(1, adt*4);
  phase += adt*(ampW*6.5 + ampR*11.5);

  // debu langkah saat lari (murah)
  if(ampR > 0.5 && Math.floor(phase/Math.PI) !== animate._lastStep){
    animate._lastStep = Math.floor(phase/Math.PI);
    const front = animate._lastStep % 2 === 0;
    spawnRing(new THREE.Vector3((Math.random()-.5)*3, 0, front?2.4:-2.4),
      0xdddddd, 1.4, 0.4, 0.5);
  }

  resetPose();
  updateAttack(adt);
  updateTongue(adt);
  applyPose();
  updateParticles(adt);

  const label = 'AKSI: ' + (attack ? LABEL[attack.n] : LABEL[loco]);
  if(stateElNeedsUpdate || stateEl.textContent !== label){
    stateEl.textContent = label; stateElNeedsUpdate = false;
  }

  controls.update();
  if(shake > 0.001){
    shakeOff.set(Math.random()-.5, (Math.random()-.5)*0.7, Math.random()-.5).multiplyScalar(shake*0.35);
    camera.position.add(shakeOff);
  }
  renderer.render(scene, camera);
  if(shake > 0.001) camera.position.sub(shakeOff);
  shake *= Math.exp(-7*dt);
}
animate();

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
