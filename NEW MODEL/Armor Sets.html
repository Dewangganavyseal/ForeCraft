<script>
'use strict';
/* =====================================================================
   ARMOR SETS v2 — 12 SET ARMOR BERVARIASI DENGAN CIRI KHAS MASING-MASING
   ---------------------------------------------------------------------
   Tiap set mengikuti KONTRAK ArmorManager yang sudah ada di game:
     buildHelmet() buildChestplate() buildPauldron() buildBoots()
     → masing2 mengembalikan THREE.Group, dipasang ke:
       armorG.helm (pivot kepala) · armorG.chest (pivot torso)
       armorG.pauldL/R (pivot lengan) · armorG.bootL/R (pivot shin)
   Pivot & skala SAMA dengan armor lama sehingga tinggal ganti.
   ===================================================================== */

/* ---------------- renderer / scene / kamera ---------------- */
const scene=new THREE.Scene();scene.background=new THREE.Color(0x161a20);
scene.fog=new THREE.Fog(0x161a20,9,26);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.1,100);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xcfe4ff,0x2a2620,0.8));
const sun=new THREE.DirectionalLight(0xfff0d8,1.05);
sun.position.set(4,7,3);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left=-5;sun.shadow.camera.right=5;sun.shadow.camera.top=5;sun.shadow.camera.bottom=-5;
scene.add(sun);
const rim=new THREE.DirectionalLight(0x80b0ff,0.4);rim.position.set(-3,4,-4);scene.add(rim);
const floor=new THREE.Mesh(new THREE.CylinderGeometry(2.3,2.3,0.1,28),
  new THREE.MeshLambertMaterial({color:0x20242c}));
floor.position.y=-0.05;floor.receiveShadow=true;scene.add(floor);
const grid=new THREE.GridHelper(4.4,22,0x3a4048,0x2a3038);grid.position.y=0.001;scene.add(grid);

/* ---------------- helper voxel ---------------- */
const M={
  box(w,h,d,color,emissive){
    const mat=new THREE.MeshLambertMaterial({color});
    if(emissive){mat.emissive=new THREE.Color(emissive);mat.emissiveIntensity=0.55;}
    const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
    m.castShadow=true;m.receiveShadow=true;return m;
  },
  pl(w,h,d,color,y=0,z=0,x=0,emissive){
    const m=this.box(w,h,d,color,emissive);m.position.set(x,y,z);return m;
  }
};

/* =====================================================================
   KARAKTER DASAR (ringkas) — pivot armorG sama seperti player_model
   ===================================================================== */
function buildBaseChar(){
  const SKIN=0xe8bd92,SKIN_D=0xd2a279,CLOTH=0x3a4149,CLOTH_D=0x2c323a;
  const mesh=new THREE.Group();const body=new THREE.Group();mesh.add(body);
  const parts={body};
  const mkLeg=(side)=>{const g=new THREE.Group();g.position.set(0.13*side,0.66,0);
    g.add(M.pl(0.20,0.34,0.22,CLOTH,-0.17));
    const shin=new THREE.Group();shin.position.y=-0.34;
    shin.add(M.pl(0.17,0.30,0.19,CLOTH_D,-0.15));shin.add(M.pl(0.20,0.10,0.26,0x2c2018,-0.32,0.03));
    g.add(shin);g.userData.shin=shin;body.add(g);return g;};
  const legL=mkLeg(1),legR=mkLeg(-1);
  const torso=new THREE.Group();torso.position.y=0.66;body.add(torso);
  torso.add(M.pl(0.50,0.5,0.32,CLOTH,0.32));torso.add(M.pl(0.56,0.2,0.34,CLOTH_D,0.62));
  torso.add(M.pl(0.18,0.30,0.18,SKIN_D,0.80));
  const mkArm=(side)=>{const g=new THREE.Group();g.position.set(0.35*side,0.63,0);
    g.add(M.pl(0.18,0.30,0.19,CLOTH,-0.10));
    const fore=new THREE.Group();fore.position.y=-0.26;
    fore.add(M.pl(0.15,0.28,0.16,SKIN,-0.14));
    g.add(fore);g.userData.fore=fore;torso.add(g);return g;};
  const armL=mkArm(1),armR=mkArm(-1);
  const head=new THREE.Group();head.position.set(0,0.80,0);torso.add(head);
  head.add(M.pl(0.40,0.40,0.38,SKIN,0.2));
  const eyeM=new THREE.MeshLambertMaterial({color:0x241d14});
  for(const x of[0.095,-0.095]){const e=new THREE.Mesh(new THREE.BoxGeometry(0.06,0.075,0.02),eyeM);e.position.set(x,0.22,0.195);head.add(e);}
  head.add(M.pl(0.44,0.13,0.42,0x3a2a1c,0.42));
  const armorG={helm:new THREE.Group(),chest:new THREE.Group(),bootL:new THREE.Group(),
    bootR:new THREE.Group(),pauldL:new THREE.Group(),pauldR:new THREE.Group()};
  head.add(armorG.helm);torso.add(armorG.chest);
  legL.userData.shin.add(armorG.bootL);legR.userData.shin.add(armorG.bootR);
  armL.add(armorG.pauldL);armR.add(armorG.pauldR);
  Object.assign(parts,{legL,legR,armL,armR,head,torso,body,armorG});
  return {mesh,parts};
}

   g.add(M.pl(0.12,0.12,0.03,C.copper,0.52,0.22));g.add(M.pl(0.06,0.06,0.04,C.trim,0.52,0.24));
   for(const a of[0,1,2,3,4,5])g.add(M.pl(0.04,0.04,0.03,C.trim,0.52+Math.sin(a)*0.10,0.235,Math.cos(a)*0.10));
   /* pipa uap di bahu */
   g.add(M.pl(0.06,0.06,0.20,C.copper,0.62,-0.10,0.30));g.add(M.pl(0.06,0.06,0.20,C.copper,0.62,-0.10,-0.30));
   g.add(M.pl(0.54,0.08,0.34,C.main,0.10));
   return g;},
 buildPauldron(){const g=new THREE.Group(),C=this.colors;
   g.add(M.pl(0.30,0.14,0.30,C.brass,-0.02));g.add(M.pl(0.32,0.05,0.32,C.copper,0.06));
   g.add(M.pl(0.08,0.08,0.08,C.trim,0.10,0,0));               // baut besar
   return g;},
 buildBoots(){const g=new THREE.Group(),C=this.colors;
   g.add(M.pl(0.24,0.26,0.24,C.main,-0.16));g.add(M.pl(0.26,0.06,0.26,C.brass,-0.02));
   g.add(M.pl(0.25,0.12,0.32,C.trim,-0.32,0.03));g.add(M.pl(0.22,0.08,0.12,C.brass,-0.34,0.18));
   g.add(M.pl(0.04,0.10,0.10,C.copper,-0.20,0,0.13));         // pipa betis
   g.add(M.pl(0.23,0.05,0.30,C.trim,-0.38,0.03));return g;}},

/* 12. FROST YETI — es & bulu putih beku, tanduk es, dingin membeku */
{name:'Frost Yeti',tier:'crystal',desc:'Es & bulu beku. Tanduk es, biru membeku, dari tundra.',
 colors:{main:0xd8e8f0,trim:0xa8c0d0,ice:0x9fd8f0,fur:0xf0f4f8,accent:0x5ab0e0,glow:0x8fdcff},
 buildHelmet(){const g=new THREE.Group(),C=this.colors;

   g.add(M.pl(0.06,0.08,0.04,C.accent,0.38,0.24));            // kristal dahi
   return g;},
 buildChestplate(){const g=new THREE.Group(),C=this.colors;
   g.add(M.pl(0.66,0.34,0.40,C.fur,0.50));                    // mantel bulu

   g.add(M.pl(0.06,0.28,0.34,C.main,0.46,0,0.36));g.add(M.pl(0.06,0.28,0.34,C.main,0.46,0,-0.36));

 buildPauldron(){const g=new THREE.Group(),C=this.colors;

   g.add(M.pl(0.24,0.18,0.24,C.main,-0.24));
   g.add(M.pl(0.26,0.12,0.32,C.trim,-0.32,0.03));g.add(M.pl(0.22,0.08,0.12,C.ice,-0.34,0.18));
    g.add(M.pl(0.24,0.05,0.30,C.trim,-0.38,0.03));return g;} }
];

/* =====================================================================
   URUTAN TIER ORE — armor disusun dari PALING JELEK ke PALING BAGUS
   mengikuti jenjang ore yang ada di game (lihat ORE_INFO di config.js):
     leather (non-ore, terlemah)
     → copper(7) → iron(12) → steel(18) → gold(22)
     → tungsten(26) → crystal(32) → tungstensteel(38, terkuat)
   Angka = level Penambangan minimum ore tsb. Stone & Coal tidak ditempa
   jadi armor (bukan logam), jadi Copper adalah armor logam pertama.
   `rank` dipakai untuk mengurutkan tampilan & membaca jenjang kekuatan.
   ===================================================================== */
const ARMOR_TIER_RANK={leather:0,copper:1,iron:2,steel:3,gold:4,tungsten:5,crystal:6,tungstensteel:7};
ARMOR_SETS.forEach(s=>{s.rank=(ARMOR_TIER_RANK[s.tier]!==undefined)?ARMOR_TIER_RANK[s.tier]:99;});
ARMOR_SETS.sort((a,b)=>a.rank-b.rank);

/* =====================================================================
   STATE + UI
   ===================================================================== */
const char=buildBaseChar();scene.add(char.mesh);
const parts=char.parts;
let anim='idle',autoRot=true,curSet=0,curPart='full';
const clock=new THREE.Clock();

function clearArmor(){
  for(const k in parts.armorG){
    const g=parts.armorG[k];
    while(g.children.length){const c=g.children.pop();if(c.geometry)c.geometry.dispose();if(c.material)c.material.dispose();}
  }
}
function applyArmor(){
  clearArmor();
  if(curPart==='none')return;
  const s=ARMOR_SETS[curSet];
  const want=p=>curPart==='full'||curPart===p;
  if(want('helm'))parts.armorG.helm.add(s.buildHelmet());
  if(want('chest'))parts.armorG.chest.add(s.buildChestplate());
  if(want('pauldron')){parts.armorG.pauldL.add(s.buildPauldron());parts.armorG.pauldR.add(s.buildPauldron());}
  if(want('boots')){parts.armorG.bootL.add(s.buildBoots());parts.armorG.bootR.add(s.buildBoots());}
}
applyArmor();
window.NewArmorSets={ARMOR_SETS,applyArmor,parts};

/* animasi idle/walk ringkas */
function resetPose(){
  for(const g of[parts.legL,parts.legR,parts.armL,parts.armR]){g.rotation.set(0,0,0);if(g.userData.shin)g.userData.shin.rotation.set(0,0,0);if(g.userData.fore)g.userData.fore.rotation.set(0,0,0);}
  parts.head.rotation.set(0,0,0);parts.torso.rotation.set(0,0,0);parts.body.position.set(0,0,0);
}
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05),t=clock.elapsedTime;
  resetPose();
  if(anim==='idle'){
    const br=Math.sin(t*2.2)*0.012;parts.body.position.y=br;
    parts.armL.rotation.x=Math.sin(t*2.2)*0.06;parts.armR.rotation.x=-Math.sin(t*2.2)*0.06;
    parts.armL.userData.fore.rotation.x=-0.15;parts.armR.userData.fore.rotation.x=-0.15;
    parts.head.rotation.y=Math.sin(t*0.8)*0.12;
  }else{
    const s=Math.sin(t*6),c=Math.cos(t*6);
    parts.legL.rotation.x=s*0.55;parts.legR.rotation.x=-s*0.55;
    parts.legL.userData.shin.rotation.x=Math.max(0,-c)*0.6;parts.legR.userData.shin.rotation.x=Math.max(0,c)*0.6;
    parts.armL.rotation.x=-s*0.45;parts.armR.rotation.x=s*0.45;
    parts.body.position.y=Math.abs(Math.sin(t*6))*0.05;
  }
  if(autoRot)char.mesh.rotation.y+=dt*0.4;
  renderer.render(scene,camera);
}
animate();

/* orbit */
let dragging=false,px=0,py=0,theta=0.7,phi=1.05,dist=4.6;
function updCam(){camera.position.set(dist*Math.sin(phi)*Math.sin(theta),dist*Math.cos(phi)+0.7,dist*Math.sin(phi)*Math.cos(theta));camera.lookAt(0,0.9,0);}
updCam();
renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;px=e.clientX;py=e.clientY;});
addEventListener('pointermove',e=>{if(!dragging)return;theta-=(e.clientX-px)*0.005;phi=Math.max(0.2,Math.min(2.6,phi-(e.clientY-py)*0.005));px=e.clientX;py=e.clientY;updCam();});
addEventListener('pointerup',()=>dragging=false);
renderer.domElement.addEventListener('wheel',e=>{dist=Math.max(2,Math.min(12,dist+e.deltaY*0.005));updCam();});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

/* dropdown */
const setSel=document.getElementById('setSel'),partSel=document.getElementById('partSel');
const TIER_LABEL={leather:'Kulit',copper:'Tembaga',iron:'Besi',steel:'Baja',gold:'Emas',tungsten:'Tungsten',crystal:'Kristal',tungstensteel:'Baja Tungsten'};
ARMOR_SETS.forEach((s,i)=>{
  const o=document.createElement('option');o.value=i;
  o.textContent=(i+1)+'. '+s.name+'  ['+(TIER_LABEL[s.tier]||s.tier)+']';
  setSel.appendChild(o);
});
function updInfo(){
  const s=ARMOR_SETS[curSet];
  document.getElementById('armorName').textContent=s.name;
  document.getElementById('armorDesc').textContent=s.desc+'  ·  Tier: '+(TIER_LABEL[s.tier]||s.tier)+' (kekuatan #'+(s.rank+1)+' dari 8)';
}
setSel.addEventListener('change',e=>{curSet=parseInt(e.target.value);applyArmor();updInfo();});
partSel.addEventListener('change',e=>{curPart=e.target.value;applyArmor();});
updInfo();
document.querySelectorAll('[data-anim]').forEach(b=>b.addEventListener('click',()=>{
  anim=b.dataset.anim;document.querySelectorAll('[data-anim]').forEach(x=>x.classList.remove('active'));b.classList.add('active');
}));
document.getElementById('rotBtn').addEventListener('click',e=>{autoRot=!autoRot;e.target.classList.toggle('active',autoRot);});
</script>
</body>
</html>
