<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sapi Kubus — Voxel Three.js</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐄</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Titan+One&family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#241f19; --paper:#ffffff; --accent:#3f9b2f; --soft:#8b8275;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%; overflow:hidden; background:#fff;
    font-family:'Chakra Petch',sans-serif; color:var(--ink); user-select:none}
  canvas{display:block}

  .hud{position:fixed; inset:0; pointer-events:none; z-index:10}

  /* ---------- brand ---------- */
  .brand{position:absolute; top:22px; left:24px; max-width:380px}
  .tag{font-size:11px; font-weight:700; letter-spacing:.38em; color:var(--soft)}
  .brand h1{font-family:'Titan One'; font-size:clamp(34px,5.6vw,58px); line-height:.95;
    margin:8px 0 10px; text-shadow:4px 4px 0 rgba(36,31,25,.10)}
  .brand h1 span{color:var(--accent); -webkit-text-stroke:2.5px var(--ink)}
  .sub{font-size:13px; line-height:1.55; color:#6d655a}

  /* ---------- chips ---------- */
  .side{position:absolute; top:24px; right:24px; display:flex; flex-direction:column; gap:10px; align-items:flex-end}
  .chip{pointer-events:auto; display:flex; align-items:center; gap:9px;
    background:#fff; border:3px solid var(--ink); box-shadow:4px 4px 0 var(--ink);
    padding:8px 14px; font-size:12px; font-weight:700; letter-spacing:.14em; cursor:default;
    transition:transform .15s, box-shadow .15s}
  button.chip{cursor:pointer; font-family:inherit; color:var(--ink)}
  button.chip:hover{transform:translate(-2px,-2px); box-shadow:6px 6px 0 var(--ink)}
  button.chip.on{background:var(--accent); color:#fff}
  .dot{width:10px; height:10px; background:var(--accent); animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.55);opacity:.45}}

  /* ---------- dock ---------- */
  .dock{position:absolute; left:50%; bottom:26px; transform:translateX(-50%);
    display:flex; gap:12px; flex-wrap:wrap; justify-content:center; pointer-events:auto}
  .btn{position:relative; font-family:inherit; font-weight:700; font-size:13px; letter-spacing:.08em;
    background:#fff; color:var(--ink); border:3px solid var(--ink); box-shadow:5px 5px 0 var(--ink);
    padding:10px 18px 11px; min-width:100px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    transition:transform .12s, box-shadow .12s, background .12s, color .12s}
  .btn .ico{font-size:21px; line-height:1}
  .btn kbd{position:absolute; top:-11px; right:-9px; background:var(--ink); color:#fff;
    font-family:inherit; font-size:10px; padding:2px 6px}
  .btn:hover{transform:translate(-2px,-3px); box-shadow:8px 8px 0 var(--ink)}
  .btn:active{transform:translate(2px,2px); box-shadow:2px 2px 0 var(--ink)}
  .btn.active{background:var(--accent); color:#fff}
  .btn.active kbd{background:#fff; color:var(--ink)}

  .hint{position:absolute; right:24px; bottom:26px; text-align:right;
    font-size:11px; letter-spacing:.1em; line-height:2; color:var(--soft)}

  /* ---------- floating bubbles ---------- */
  .bubble{position:fixed; z-index:20; pointer-events:none; font-family:'Titan One';
    transform:translate(-50%,-100%); animation:rise 1.8s ease-out forwards}
  .bubble.moo{font-size:32px; color:#fff; -webkit-text-stroke:2px var(--ink);
    text-shadow:4px 4px 0 var(--accent); rotate:-6deg}
  .bubble.zz{font-size:22px; color:#a4a9ad}
  @keyframes rise{
    0%{opacity:0; transform:translate(-50%,-70%) scale(.5)}
    14%{opacity:1}
    100%{opacity:0; transform:translate(-50%,-280%) scale(1.2)}
  }

  /* ---------- loader ---------- */
  #loader{position:fixed; inset:0; background:#fff; z-index:50; display:grid; place-items:center;
    transition:opacity .5s; font-weight:700; letter-spacing:.25em; color:var(--soft); font-size:13px}
  #loader .cow{font-size:44px; display:block; text-align:center; margin-bottom:14px; animation:hop .7s infinite alternate ease-in-out}
  @keyframes hop{from{transform:translateY(0)}to{transform:translateY(-12px)}}
  #loader.done{opacity:0; visibility:hidden}

  @media (max-width:720px){
    .sub,.hint{display:none}
    .btn{min-width:66px; padding:8px 10px 9px; font-size:11px}
    .btn .ico{font-size:17px}
  }
</style>
</head>
<body>

<div id="loader"><div><span class="cow">🐄</span>MENYUSUN VOXEL…</div></div>

<div class="hud">
  <div class="brand">
    <div class="tag">THREE.JS · RIG VOXEL</div>
    <h1>SAPI <span>KUBUS</span></h1>
    <p class="sub">Sapi ala Minecraft yang dirakit prosedural dari puluhan kotak.
      Jalan, lari, merumput, dan tidur — semua bertransisi mulus. Coba klik sapinya.</p>
  </div>

  <div class="side">
    <div class="chip"><i class="dot"></i><b id="stateName">JALAN</b></div>
    <button class="chip on" id="orbitBtn">ORBIT OTOTMATIS ✦</button>
  </div>

  <nav class="dock" id="dock">
    <button class="btn" data-s="idle"><kbd>1</kbd><span class="ico">🐄</span>DIAM</button>
    <button class="btn active" data-s="walk"><kbd>2</kbd><span class="ico">🚶</span>JALAN</button>
    <button class="btn" data-s="run"><kbd>3</kbd><span class="ico">💨</span>LARI</button>
    <button class="btn" data-s="eat"><kbd>4</kbd><span class="ico">🌾</span>MAKAN</button>
    <button class="btn" data-s="sleep"><kbd>5</kbd><span class="ico">💤</span>TIDUR</button>
  </nav>

  <div class="hint">SERET putar kamera · SCROLL zoom<br>KLIK sapi = MOO · TOMBOL 1–5 / SPASI</div>
</div>

<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ================= renderer / scene ================= */
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);
scene.fog = new THREE.Fog(0xffffff, 16, 40);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, .1, 100);
const camA = new THREE.Vector3(11, 6.5, 13), camB = new THREE.Vector3(6.2, 3.6, 8.8);
camera.position.copy(camA);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.05, 0);
controls.enableDamping = true; controls.dampingFactor = .06;
controls.minDistance = 4.5; controls.maxDistance = 16;
controls.minPolarAngle = .25; controls.maxPolarAngle = 1.5;
controls.enablePan = false;
controls.autoRotate = true; controls.autoRotateSpeed = .9;

/* lights — tanpa shadow map, serba murah */
scene.add(new THREE.HemisphereLight(0xffffff, 0xd9d2c4, 1.2));
const key = new THREE.DirectionalLight(0xffffff, 1.9); key.position.set(6,12,8); scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, .55); fill.position.set(-7,5,-9); scene.add(fill);

/* tanah putih polos + bayangan blob palsu (1 plane murah) */
const ground = new THREE.Mesh(new THREE.PlaneGeometry(240,240),
  new THREE.MeshBasicMaterial({ color:0xffffff }));
ground.rotation.x = -Math.PI/2; scene.add(ground);

const sc = document.createElement('canvas'); sc.width = sc.height = 128;
const gx = sc.getContext('2d');
const gr = gx.createRadialGradient(64,64,4,64,64,60);
gr.addColorStop(0,'rgba(40,34,28,.36)'); gr.addColorStop(1,'rgba(40,34,28,0)');
gx.fillStyle = gr; gx.fillRect(0,0,128,128);
const blob = new THREE.Mesh(new THREE.PlaneGeometry(3.4,5.4),
  new THREE.MeshBasicMaterial({ map:new THREE.CanvasTexture(sc), transparent:true, depthWrite:false }));
blob.rotation.x = -Math.PI/2; blob.position.y = .02; scene.add(blob);

/* ================= builder voxel ================= */
const MAT = new THREE.MeshLambertMaterial({ vertexColors:true });
const C = {
  WHITE:0xefe8d8, WHITE2:0xded5c2, WHITES:0xfbf8ef,
  BLACK:0x2e2a25, BLACK2:0x3b352d,
  SNOUT:0xd9ac92, SNOUTD:0xc09377, NOST:0x6d4a3a, MOUTH:0x5a3226,
  HORN:0xe6ddc6, HOOF:0x51463c, PINK:0xe8a8a4, TEAT:0xcf8f8c,
  EARP:0xd99a94, EYE:0x221a14
};
class Part{
  constructor(){ this.list = []; }
  box(w,h,d, x,y,z, hex, jit=0){
    const g = new THREE.BoxGeometry(w,h,d); g.translate(x,y,z);
    const c = new THREE.Color(hex);
    if(jit){ const j = 1+(Math.random()*2-1)*jit;
      c.r=Math.min(1,c.r*j); c.g=Math.min(1,c.g*j); c.b=Math.min(1,c.b*j); }
    const n = g.attributes.position.count, a = new Float32Array(n*3);
    for(let i=0;i<n;i++){ a[i*3]=c.r; a[i*3+1]=c.g; a[i*3+2]=c.b; }
    g.setAttribute('color', new THREE.BufferAttribute(a,3));
    this.list.push(g); return this;
  }
  mesh(px=0,py=0,pz=0){
    const geo = mergeGeometries(this.list);
    this.list.forEach(g=>g.dispose());
    const m = new THREE.Mesh(geo, MAT);
    m.position.set(-px,-py,-pz);
    return m;
  }
}

/* ================= rakit sapi ================= */
const S = 0.17;                       // skala dunia
const HP = [0,13.2,6];                // pivot leher/kepala

/* --- badan --- */
const body = new Part();
body.box(9,8,12, 0,11,0, C.WHITE,.02);
body.box(9.3,1.8,12.3, 0,7.7,0, C.WHITE2);            // nada perut
body.box(7,.5,3, 0,15.2,3.4, C.WHITE2);               // punuk pundak
body.box(.4,4.2,3.2, -4.6,12.4,2.6, C.BLACK);         // belang kiri
body.box(.4,2.2,2.4, -4.6,9.6,4.4, C.BLACK2);
body.box(.4,3,2.6,  -4.6,9.4,-3.9, C.BLACK);
body.box(.4,4.6,3.6, 4.6,11.6,-1.2, C.BLACK);         // belang kanan
body.box(.4,2.2,2.2, 4.6,13.2,3.8, C.BLACK2);
body.box(.4,2.6,2,   4.6,9.2,-4.6, C.BLACK);
body.box(3,.4,3,   -1.6,15.2,2.2, C.BLACK);           // belang punggung
body.box(2.6,.4,2.6, 2,15.2,-3.2, C.BLACK2);
body.box(3,2.6,.4, 1.4,12,-6.15, C.BLACK);            // belang bokong
body.box(4.2,2.2,3.4, 0,6.7,-3, C.PINK);              // ambing
body.box(.7,1,.7, -.95,5.5,-3.6, C.TEAT);
body.box(.7,1,.7,  .95,5.5,-3.6, C.TEAT);
body.box(.7,1,.7, -.95,5.5,-2.5, C.TEAT);
body.box(.7,1,.7,  .95,5.5,-2.5, C.TEAT);

/* --- kepala (isi: leher, tengkorak, moncong, tanduk, belang) --- */
const head = new Part();
head.box(5,5,2.8, 0,13.2,6.3, C.WHITE);
head.box(6,6,6, 0,14.8,9.7, C.WHITE,.02);
head.box(3,.4,2.8, .9,17.95,8.8, C.BLACK2);
head.box(.4,3.4,3.2, -3.12,15.4,9.4, C.BLACK);
head.box(1.8,2.6,.4, 0,15.8,12.82, C.WHITES);         // blaze wajah
head.box(5,4,3, 0,12.8,13.7, C.SNOUT,.03);            // moncong
head.box(.8,.9,.3, -1.25,13.4,15.32, C.NOST);         // cuping hidung
head.box(.8,.9,.3,  1.25,13.4,15.32, C.NOST);
head.box(2.8,.4,.3, 0,11.35,15.32, C.NOST);           // garis mulut
head.box(4.4,.5,1.2, 0,10.7,14.6, C.MOUTH);           // rongga mulut (terlihat saat mangap)
head.box(1.1,1.5,1.1, -2.5,18.5,8.6, C.HORN);         // tanduk
head.box(.7,1,.7,  -3.0,19.5,8.4, C.HORN);
head.box(1.1,1.5,1.1, 2.5,18.5,8.6, C.HORN);
head.box(.7,1,.7,   3.0,19.5,8.4, C.HORN);

/* --- mata: terbuka & terpejam (bisa ditukar) --- */
const eO = new Part();
eO.box(.95,1.15,.35, -3.12,15.9,11.2, C.EYE);
eO.box(.35,.35,.38,  -2.9,16.25,11.25, C.WHITES);
eO.box(.95,1.15,.35,  3.12,15.9,11.2, C.EYE);
eO.box(.35,.35,.38,   3.34,16.25,11.25, C.WHITES);
const eC = new Part();
eC.box(1.3,.3,.35, -3.12,15.9,11.2, C.EYE);
eC.box(1.3,.3,.35,  3.12,15.9,11.2, C.EYE);

/* --- telinga --- */
const EL = [-3.05,17.5,8.9], ER = [3.05,17.5,8.9];
const earLP = new Part();
earLP.box(2.8,1.1,2, -4.6,17.6,8.9, C.WHITE);
earLP.box(.8,1.15,2.05, -5.8,17.6,8.9, C.BLACK2);
earLP.box(2.3,.35,1.6, -4.5,17.0,8.9, C.EARP);
const earRP = new Part();
earRP.box(2.8,1.1,2, 4.6,17.6,8.9, C.WHITE);
earRP.box(.8,1.15,2.05, 5.8,17.6,8.9, C.BLACK2);
earRP.box(2.3,.35,1.6, 4.5,17.0,8.9, C.EARP);

/* --- rahang bawah (pivot belakang supaya mangap alami) --- */
const JP = [0,11.3,12.3];
const jawP = new Part();
jawP.box(4.6,1.5,3.6, 0,10.5,14, C.SNOUTD,.03);
jawP.box(4.7,.5,.3,  0,11.1,15.75, C.NOST);

/* --- ekor --- */
const tailP = new Part();
tailP.box(1,3.2,1,   0,13,-6.25, C.WHITE);
tailP.box(.9,3,.9,   0,10,-6.3,  C.WHITE2);
tailP.box(1.7,2.1,1.7,0,7.9,-6.35, C.BLACK);
tailP.box(1.2,1.1,1.2,0,6.6,-6.4,  C.BLACK2);

/* --- kaki --- */
function legPart(x,z,spot){
  const p = new Part();
  p.box(2.6,8.4,2.6, x,4,z, C.WHITE,.02);
  if(spot) p.box(2.7,3,2.7, x,6.2,z, spot);
  p.box(2.75,1.5,2.75, x,.75,z, C.HOOF);
  return p;
}

/* ================= hierarki rig ================= */
const cowRoot = new THREE.Group(); cowRoot.scale.setScalar(S); scene.add(cowRoot);
const rig = new THREE.Group(); cowRoot.add(rig);
const bodyGrp = new THREE.Group(); rig.add(bodyGrp);
bodyGrp.add(body.mesh());

const headGrp = new THREE.Group(); headGrp.position.set(...HP); bodyGrp.add(headGrp);
headGrp.add(head.mesh(...HP));
const eyesOM = eO.mesh(...HP), eyesCM = eC.mesh(...HP);
headGrp.add(eyesOM, eyesCM);

const earL = new THREE.Group(); earL.position.set(EL[0]-HP[0], EL[1]-HP[1], EL[2]-HP[2]);
earL.add(earLP.mesh(...EL)); headGrp.add(earL);
const earR = new THREE.Group(); earR.position.set(ER[0]-HP[0], ER[1]-HP[1], ER[2]-HP[2]);
earR.add(earRP.mesh(...ER)); headGrp.add(earR);

const jawGrp = new THREE.Group(); jawGrp.position.set(JP[0]-HP[0], JP[1]-HP[1], JP[2]-HP[2]);
jawGrp.add(jawP.mesh(...JP)); headGrp.add(jawGrp);

const tail = new THREE.Group(); tail.position.set(0,14.5,-6);
tail.add(tailP.mesh(0,14.5,-6)); bodyGrp.add(tail);

const legs = [];
[[ -2.7,3.6,null, 'legFL'],[ 2.7,3.6,C.BLACK,'legFR'],
 [ -2.7,-3.6,C.BLACK2,'legBL'],[ 2.7,-3.6,null,'legBR']].forEach(([x,z,sp])=>{
  const g = new THREE.Group(); g.position.set(x,7.5,z);
  g.add(legPart(x,z,sp).mesh(x,7.5,z)); rig.add(g); legs.push(g);
});
const [legFL, legFR, legBL, legBR] = legs;

const cowMeshes = []; cowRoot.traverse(o=>{ if(o.isMesh) cowMeshes.push(o); });

/* ================= pose & animasi ================= */
const ss = x => x*x*(3-2*x);
const burst = (t,f,p=6,ph=0) => Math.max(0, Math.sin(t*f+ph))**p;

const P = {
  idle(t){ return {
    rigY:0, pitch:0, roll:Math.sin(t*.55)*.018,
    headPitch:.06+Math.sin(t*.8)*.05, headYaw:Math.sin(t*.31)*.16, headRoll:Math.sin(t*.23)*.035,
    headExt:0, jaw:.03+burst(t,.5,10)*.1,
    earL:burst(t,.6,14)*.5, earR:burst(t,.6,14,2.4)*.5, earF:Math.sin(t*1.3)*.05,
    tailX:.08, tailZ:Math.sin(t*2.6)*(.25+burst(t,.4,3)*.6),
    fl:.03, fr:-.03, bl:.02, br:-.02,
    breathe:.006+.005*Math.sin(t*1.6), eye:0 }; },

  walk(t){ const f=t*4.8, s=Math.sin(f); return {
    rigY:Math.abs(Math.cos(f))*.22,
    pitch:.03, roll:s*.035,
    headPitch:.1-Math.sin(2*f)*.07, headYaw:Math.sin(f*.5+1.2)*.09+s*.05, headRoll:s*.02,
    headExt:0, jaw:.02,
    earL:burst(t,.9,12)*.4, earR:burst(t,.9,12,1.8)*.4, earF:Math.sin(f*2)*.09,
    tailX:.06, tailZ:Math.sin(t*3.2)*.55,
    fl:s*.62+.06*Math.sin(2*f), fr:-s*.62-.06*Math.sin(2*f),
    bl:-s*.62-.06*Math.sin(2*f), br:s*.62+.06*Math.sin(2*f),
    breathe:.005, eye:0 }; },

  run(t){ const f=t*10.5; return {
    rigY:Math.abs(Math.sin(f))*.6+.1,
    pitch:.13+Math.sin(f+.9)*.075, roll:Math.sin(f)*.022,
    headPitch:.24+Math.sin(f+.9)*.1, headYaw:Math.sin(f*.5)*.04, headRoll:Math.sin(f)*.015,
    headExt:.5, jaw:.06,
    earL:.14, earR:.14, earF:.3+Math.sin(f*2)*.12,
    tailX:1.22+Math.sin(f)*.08, tailZ:Math.sin(t*6)*.28,
    fl:Math.sin(f)*1.02, fr:Math.sin(f+.32)*.95,
    bl:Math.sin(f-1.15)*1.02, br:Math.sin(f-.85)*.95,
    breathe:.012, eye:0 }; },

  eat(t){ const m=Math.sin(t*7.2);
    const lift = burst(t-2,.9,18);                    // sesekali mendongak
    return {
    rigY:0, pitch:.11, roll:Math.sin(t*.5)*.015,
    headPitch:(1.3+Math.sin(t*.9)*.03+Math.max(0,m)**2*.04) - lift*.55,
    headYaw:Math.sin(t*.42)*.27*(1-lift*.6), headRoll:Math.sin(t*.42+1.2)*.05,
    headExt:.5, jaw:(.06+(0.5+0.5*m)*.4)*(1-lift*.85)+.03,
    earL:burst(t,.7,12)*.4, earR:burst(t,.7,12,2)*.4, earF:Math.sin(t*1.1)*.07+.05,
    tailX:.12, tailZ:Math.sin(t*2.3)*.45,
    fl:.06, fr:.04, bl:-.03, br:-.05,
    breathe:.005, eye:0 }; },

  sleep(t){ const b=Math.sin(t*1.15); return {
    rigY:-5.95, pitch:.02, roll:.11,
    headPitch:.9+b*.012, headYaw:.28, headRoll:.55,
    headExt:.35, jaw:.02,
    earL:.34, earR:.3, earF:.18+b*.02,
    tailX:.35, tailZ:.6+Math.sin(t*.35)*.1,
    fl:1.52, fr:1.45, bl:-1.45, br:-1.52,             // kaki terlipat di bawah perut
    breathe:.016+.012*b, eye:1 }; },
};
const SPEED = { idle:0, walk:1.7, run:4.8, eat:0, sleep:0 };
const LABEL = { idle:'DIAM', walk:'JALAN', run:'LARI', eat:'MAKAN RUMPUT', sleep:'TIDUR' };
const ORDER = ['idle','walk','run','eat','sleep'];

/* ================= state machine + blending ================= */
let state='walk', fromPose=null, blend=1, elapsed=0, last=performance.now();
let lastPose = P.walk(0);
let moo=0, nextBlink=2.5, blinkUntil=-1, nextZ=0;
let speed=0, angle=0; const R=3.4;
let introT=0, userTouched=false, autoOn=true, rt=0;

const stateName = document.getElementById('stateName');
const orbitBtn  = document.getElementById('orbitBtn');
const fx        = document.getElementById('fx');

function setState(s){
  if(s===state) return;
  fromPose = Object.assign({}, lastPose);
  blend = 0; state = s; nextZ = elapsed+1.2;
  document.querySelectorAll('.btn').forEach(b=>b.classList.toggle('active', b.dataset.s===s));
  stateName.textContent = LABEL[s];
}
document.getElementById('dock').addEventListener('click', e=>{
  const b = e.target.closest('.btn'); if(b) setState(b.dataset.s);
});
addEventListener('keydown', e=>{
  const map={'1':'idle','2':'walk','3':'run','4':'eat','5':'sleep'};
  if(map[e.key]) setState(map[e.key]);
  else if(e.key===' '){ setState(ORDER[(ORDER.indexOf(state)+1)%ORDER.length]); e.preventDefault(); }
});
orbitBtn.onclick = ()=>{ autoOn=!autoOn; controls.autoRotate=autoOn; orbitBtn.classList.toggle('on',autoOn); };
controls.addEventListener('start', ()=>{ userTouched=true; controls.autoRotate=false; clearTimeout(rt); });
controls.addEventListener('end',   ()=>{ if(autoOn) rt=setTimeout(()=>controls.autoRotate=true, 2600); });

/* ================= interaksi klik = MOO ================= */
const ray = new THREE.Raycaster(), ndcV = new THREE.Vector2();
let dX=0, dY=0;
renderer.domElement.addEventListener('pointerdown', e=>{ dX=e.clientX; dY=e.clientY; });
renderer.domElement.addEventListener('pointerup', e=>{
  if(Math.hypot(e.clientX-dX, e.clientY-dY) > 6) return;
  ndcV.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1);
  ray.setFromCamera(ndcV, camera);
  if(ray.intersectObjects(cowMeshes,false).length){ moo=1; bubble('MOO!','moo'); }
});
let hoverBusy=false;
renderer.domElement.addEventListener('pointermove', e=>{
  if(hoverBusy) return; hoverBusy=true;
  requestAnimationFrame(()=>{
    ndcV.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1);
    ray.setFromCamera(ndcV, camera);
    renderer.domElement.style.cursor =
      ray.intersectObjects(cowMeshes,false).length ? 'pointer' : 'grab';
    hoverBusy=false;
  });
});

/* ================= gelembung DOM (MOO / zzz) ================= */
const wv = new THREE.Vector3();
function bubble(txt, cls, ox=0){
  headGrp.getWorldPosition(wv); wv.y += .9; wv.project(camera);
  if(wv.z > 1) return;
  const el = document.createElement('div');
  el.className = 'bubble '+cls; el.textContent = txt;
  el.style.left = ((wv.x*.5+.5)*innerWidth + ox)+'px';
  el.style.top  = ((-wv.y*.5+.5)*innerHeight)+'px';
  fx.appendChild(el); setTimeout(()=>el.remove(), 1900);
}

/* ================= apply pose ================= */
function applyPose(p){
  rig.position.y = p.rigY;
  rig.rotation.x = p.pitch; rig.rotation.z = p.roll;
  headGrp.position.set(0, HP[1], HP[2]+p.headExt);
  headGrp.rotation.set(p.headPitch, p.headYaw, p.headRoll);
  jawGrp.rotation.x = p.jaw;
  earL.rotation.z =  (p.earL + p.earF);
  earR.rotation.z = -(p.earR + p.earF);
  tail.rotation.x = p.tailX; tail.rotation.z = p.tailZ;
  legFL.rotation.x=p.fl; legFR.rotation.x=p.fr; legBL.rotation.x=p.bl; legBR.rotation.x=p.br;
  const b = 1 + p.breathe;
  bodyGrp.scale.set(1+(b-1)*.6, b, 1+(b-1)*.3);
  const closed = p.eye > .5;
  eyesOM.visible = !closed; eyesCM.visible = closed;
}

/* ================= loop utama ================= */
let shScale=1, loaded=false;
function tick(now){
  requestAnimationFrame(tick);
  const dt = Math.min(.05, (now-last)/1000); last = now; elapsed += dt;

  /* intro kamera */
  if(introT < 1 && !userTouched){
    introT = Math.min(1, introT + dt/1.7);
    camera.position.lerpVectors(camA, camB, ss(introT));
  }

  /* blend antar-state */
  blend = Math.min(1, blend + dt/.7);
  const tp = P[state](elapsed);
  const p = (blend>=1 || !fromPose) ? tp
          : Object.fromEntries(Object.keys(tp).map(k=>[k, fromPose[k]+(tp[k]-fromPose[k])*ss(blend)]));

  /* kedip */
  if(state!=='sleep'){
    if(elapsed > nextBlink){ blinkUntil = elapsed+.13; nextBlink = elapsed+2.2+Math.random()*3.4; }
    if(elapsed < blinkUntil) p.eye = 1;
  }
  /* impuls MOO */
  if(moo > .001){
    moo *= Math.exp(-dt*2);
    p.headPitch -= moo*.55; p.jaw += moo*.3;
    p.headYaw += Math.sin(elapsed*26)*.12*moo;
    p.tailZ  += Math.sin(elapsed*24)*.5*moo;
  }

  applyPose(p); lastPose = p;

  /* gerak melingkar saat jalan/lari */
  speed += (SPEED[state]-speed)*(1-Math.exp(-dt*1.8));
  angle += (speed/R)*dt;
  if(speed > .02){
    cowRoot.position.set(Math.sin(angle)*R, 0, Math.cos(angle)*R);
    const na = angle+.05;
    cowRoot.lookAt(Math.sin(na)*R, 0, Math.cos(na)*R);
  }

  /* bayangan blob mengikuti */
  blob.position.set(cowRoot.position.x, .02, cowRoot.position.z);
  blob.rotation.y = cowRoot.rotation.y;
  shScale += ((state==='sleep'?1.3:1)-shScale)*(1-Math.exp(-dt*4));
  blob.scale.set(shScale, shScale*(1-Math.max(0,p.rigY)*.08), 1);

  /* zzz melayang */
  if(state==='sleep' && elapsed > nextZ){
    bubble('z','zz', (Math.random()*44-22));
    nextZ = elapsed + 1.3 + Math.random();
  }

  controls.update();
  renderer.render(scene, camera);
  if(!loaded){ loaded=true; document.getElementById('loader').classList.add('done'); }
}
requestAnimationFrame(tick);

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
