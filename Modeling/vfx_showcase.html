<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VFX Showcase - Meteor & Ice Rain</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        canvas { display: block; }
        #ui { position: absolute; bottom: 20px; left: 20px; color: white; pointer-events: none; }
        .skill-btn { display: inline-block; padding: 10px 20px; margin-right: 10px; background: rgba(0,0,0,0.5); border: 1px solid #444; border-radius: 4px; pointer-events: auto; cursor: pointer; user-select: none; }
        .skill-btn.active { border-color: #fff; background: rgba(255,255,255,0.2); }
        #instructions { position: absolute; top: 20px; left: 20px; color: white; pointer-events: none; text-shadow: 1px 1px 2px black; }
    </style>
    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.180.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.180.0/examples/jsm/"
      }
    }
    </script>
</head>
<body>
    <div id="instructions">
        <h2>VFX Showcase</h2>
        <p>Press [1] for Meteor Rain</p>
        <p>Press [2] for Ice Crystal Rain</p>
        <p>Click to Cast</p>
        <p><label style="pointer-events: auto; cursor: pointer;"><input type="checkbox" id="bloomToggle" checked> Enable Bloom</label></p>
    </div>
    <div id="ui">
        <div id="btn1" class="skill-btn active">1: Meteor Rain</div>
        <div id="btn2" class="skill-btn">2: Ice Rain</div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

        // --- 1. NOISE GLSL LIBRARY ---
        const noiseGLSL = `
        vec3 mod289v3(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec4 mod289v4(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec4 permute289(vec4 x) { return mod289v4(((x * 34.0) + 1.0) * x); }
        vec4 taylorInvSqrt4(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }

        float hash11(float p) {
            p = fract(p * 0.1031);
            p *= p + 33.33;
            p *= p + p;
            return fract(p);
        }

        float hash13(vec3 p3) {
            p3 = fract(p3 * 0.1031);
            p3 += dot(p3, p3.zyx + 31.32);
            return fract((p3.x + p3.y) * p3.z);
        }

        float snoise(vec3 v) {
            const vec2 C = vec2(1.0 / 6.0, 1.0 / 3.0);
            const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
            vec3 i  = floor(v + dot(v, C.yyy));
            vec3 x0 = v - i + dot(i, C.xxx);
            vec3 g = step(x0.yzx, x0.xyz);
            vec3 l = 1.0 - g;
            vec3 i1 = min(g.xyz, l.zxy);
            vec3 i2 = max(g.xyz, l.zxy);
            vec3 x1 = x0 - i1 + C.xxx;
            vec3 x2 = x0 - i2 + C.yyy;
            vec3 x3 = x0 - D.yyy;
            i = mod289v3(i);
            vec4 p = permute289(permute289(permute289(
                        i.z + vec4(0.0, i1.z, i2.z, 1.0))
                    + i.y + vec4(0.0, i1.y, i2.y, 1.0))
                    + i.x + vec4(0.0, i1.x, i2.x, 1.0));
            float n_ = 0.142857142857;
            vec3 ns = n_ * D.wyz - D.xzx;
            vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
            vec4 x_ = floor(j * ns.z);
            vec4 y_ = floor(j - 7.0 * x_);
            vec4 x = x_ * ns.x + ns.yyyy;
            vec4 y = y_ * ns.x + ns.yyyy;
            vec4 h = 1.0 - abs(x) - abs(y);
            vec4 b0 = vec4(x.xy, y.xy);
            vec4 b1 = vec4(x.zw, y.zw);
            vec4 s0 = floor(b0) * 2.0 + 1.0;
            vec4 s1 = floor(b1) * 2.0 + 1.0;
            vec4 sh = -step(h, vec4(0.0));
            vec4 a0 = b0.xzyw + s0.xzyw * sh.xxyy;
            vec4 a1 = b1.xzyw + s1.xzyw * sh.zzww;
            vec3 p0 = vec3(a0.xy, h.x);
            vec3 p1 = vec3(a0.zw, h.y);
            vec3 p2 = vec3(a1.xy, h.z);
            vec3 p3 = vec3(a1.zw, h.w);
            vec4 norm = taylorInvSqrt4(vec4(dot(p0, p0), dot(p1, p1), dot(p2, p2), dot(p3, p3)));
            p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
            vec4 m = max(0.6 - vec4(dot(x0, x0), dot(x1, x1), dot(x2, x2), dot(x3, x3)), 0.0);
            m = m * m;
            return 42.0 * dot(m * m, vec4(dot(p0, x0), dot(p1, x1), dot(p2, x2), dot(p3, x3)));
        }

        float snoise01(vec3 p) { return snoise(p) * 0.5 + 0.5; }

        float fbm3(vec3 p) {
            float v = 0.0; float a = 0.5;
            for (int i = 0; i < 3; i++) { v += a * snoise(p); p *= 2.02; a *= 0.5; }
            return v;
        }

        float ridged(vec3 p, int octaves) {
            float v = 0.0; float a = 0.5;
            for (int i = 0; i < 4; i++) { v += a * (1.0 - abs(snoise(p))); p *= 2.06; a *= 0.5; }
            return v;
        }

        vec2 voronoi2(vec2 p) {
            vec2 n = floor(p); vec2 f = fract(p);
            float minDist = 8.0; float id = 0.0;
            for (int j = -1; j <= 1; j++) {
                for (int i = -1; i <= 1; i++) {
                    vec2 g = vec2(float(i), float(j));
                    float h1 = hash11(dot(n + g, vec2(7.13, 113.17)));
                    vec2 o = vec2(h1, hash11(h1 * 37.0 + 1.7));
                    vec2 r = g + o - f;
                    float d = dot(r, r);
                    if (d < minDist) { minDist = d; id = hash11(dot(n + g, vec2(31.7, 57.1))); }
                }
            }
            return vec2(sqrt(minDist), id);
        }
        `;

        // --- CPU NOISE FOR GEOMETRY ---
        // CRITICAL: JavaScript % gives negative values for negative inputs!
        // GLSL fract(x) = x - floor(x) which always returns [0, 1)
        function fract(x) { return x - Math.floor(x); }
        
        function cpuHash11(p) {
            p = fract(p * 0.1031);
            p *= p + 33.33;
            p *= p + p;
            return fract(p);
        }
        
        function cpuLattice(ix, iy, iz, seed) {
            return cpuHash11(ix * 127.1 + iy * 311.7 + iz * 74.7 + seed * 19.19);
        }
        
        function cpuValueNoise3(x, y, z, seed) {
            const ix = Math.floor(x), iy = Math.floor(y), iz = Math.floor(z);
            const fx = x - ix, fy = y - iy, fz = z - iz;
            const ux = fx * fx * (3 - 2 * fx);
            const uy = fy * fy * (3 - 2 * fy);
            const uz = fz * fz * (3 - 2 * fz);
            
            const n000 = cpuLattice(ix, iy, iz, seed);
            const n100 = cpuLattice(ix + 1, iy, iz, seed);
            const n010 = cpuLattice(ix, iy + 1, iz, seed);
            const n110 = cpuLattice(ix + 1, iy + 1, iz, seed);
            const n001 = cpuLattice(ix, iy, iz + 1, seed);
            const n101 = cpuLattice(ix + 1, iy, iz + 1, seed);
            const n011 = cpuLattice(ix, iy + 1, iz + 1, seed);
            const n111 = cpuLattice(ix + 1, iy + 1, iz + 1, seed);
            
            const x00 = n000 + (n100 - n000) * ux;
            const x10 = n010 + (n110 - n010) * ux;
            const x01 = n001 + (n101 - n001) * ux;
            const x11 = n011 + (n111 - n011) * ux;
            const y0 = x00 + (x10 - x00) * uy;
            const y1 = x01 + (x11 - x01) * uy;
            return y0 + (y1 - y0) * uz;
        }
        
        /** Signed FBM, range roughly -1..1 (matching the repo's fbmValue) */
        function cpuFbmValue(x, y, z, seed, octaves) {
            let value = 0, amplitude = 0.5, frequency = 1;
            for (let i = 0; i < octaves; i++) {
                value += amplitude * (cpuValueNoise3(x * frequency, y * frequency, z * frequency, seed + i * 7.7) * 2 - 1);
                frequency *= 2.03;
                amplitude *= 0.5;
            }
            return value;
        }

        // --- 2. PROCEDURAL CRYSTAL GEOMETRY (ported from repo's ProceduralGeometry.js) ---
        const TAU = Math.PI * 2;
        const RING_HEIGHTS = [0, 0.22, 0.5, 0.75, 0.92];

        function profileRadius(t, taper) {
            return taper + (1 - taper) * Math.pow(1 - t, 1.15);
        }

        function createCrystalGeometry(seed = 1, sides = 6, taper = 0.13, roughness = 0.28, bend = 0.22) {
            const facets = Math.max(3, Math.round(sides));
            const tipRadius = Math.min(0.9, Math.max(0.01, taper));

            // One fixed bend direction per crystal
            const bendAngle = cpuHash11(seed * 1.77) * TAU;
            const bendX = Math.cos(bendAngle);
            const bendZ = Math.sin(bendAngle);

            const axisOffset = (t) => bend * 0.5 * Math.pow(t, 1.6);

            // Angles jittered once and shared by every ring — facets stay continuous edges
            const angles = [];
            for (let i = 0; i < facets; i++) {
                const jitter = (cpuHash11(seed * 3.13 + i * 7.7) - 0.5) * (TAU / facets) * 0.55 * roughness * 3;
                angles.push((i / facets) * TAU + jitter);
            }

            const rings = RING_HEIGHTS.map((t, ringIndex) => {
                const baseR = profileRadius(t, tipRadius) * 0.5;
                const drift = axisOffset(t);
                const y = t + (cpuHash11(seed * 5.9 + ringIndex * 2.3) - 0.5) * 0.06 * roughness * (t > 0 ? 1 : 0);

                return angles.map((angle, i) => {
                    const wobble = 1 + (cpuHash11(seed * 11.1 + ringIndex * 13.7 + i * 3.9) - 0.5) * roughness * 1.3 * (0.35 + 0.65 * t);
                    const r = Math.max(0.002, baseR * wobble);
                    return [Math.cos(angle) * r + bendX * drift, y, Math.sin(angle) * r + bendZ * drift];
                });
            });

            // Apex slightly off-axis so tip reads as chipped
            const apexDrift = axisOffset(1);
            const apex = [
                bendX * apexDrift + (cpuHash11(seed * 17.3) - 0.5) * 0.09 * roughness,
                1,
                bendZ * apexDrift + (cpuHash11(seed * 19.7) - 0.5) * 0.09 * roughness
            ];
            const floorCentre = [0, 0, 0];

            // Build triangles
            const positions = [];
            const push = (p) => positions.push(p[0], p[1], p[2]);

            for (let ring = 0; ring < rings.length - 1; ring++) {
                const lower = rings[ring];
                const upper = rings[ring + 1];
                for (let i = 0; i < facets; i++) {
                    const j = (i + 1) % facets;
                    push(lower[i]); push(lower[j]); push(upper[i]);
                    push(lower[j]); push(upper[j]); push(upper[i]);
                }
            }

            const top = rings[rings.length - 1];
            const base = rings[0];
            for (let i = 0; i < facets; i++) {
                const j = (i + 1) % facets;
                push(top[i]); push(top[j]); push(apex);
                push(floorCentre); push(base[j]); push(base[i]);
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geometry.computeVertexNormals();
            return geometry;
        }

        // --- 3. PROCEDURAL ASTEROID GEOMETRY (ported from repo's ProceduralGeometry.js) ---
        function createAsteroidGeometry(seed = 11.7, detail = 3, lumpiness = 0.26, noiseScale = 1.5,
                                         roughness = 0.16, cuts = 7, cutDepth = 0.2,
                                         craters = 5, craterDepth = 0.18, craterSize = 0.5) {
            const geometry = new THREE.IcosahedronGeometry(1, Math.min(3, Math.round(detail))).toNonIndexed();
            const array = geometry.attributes.position.array;

            const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
            const smoothstep = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };

            // Deterministic point on unit sphere
            const direction = (a, b) => {
                const phi = Math.acos(2 * cpuHash11(a) - 1);
                const theta = cpuHash11(b) * TAU;
                const sinPhi = Math.sin(phi);
                return { x: sinPhi * Math.cos(theta), y: Math.cos(phi), z: sinPhi * Math.sin(theta) };
            };

            // Pre-compute planar cuts
            const planes = [];
            for (let i = 0; i < Math.max(0, Math.round(cuts)); i++) {
                const n = direction(seed * 2.3 + i * 9.1, seed * 5.7 + i * 4.3);
                n.offset = 1 - cutDepth * (0.35 + 0.9 * cpuHash11(seed * 13.1 + i * 6.7));
                planes.push(n);
            }

            // Pre-compute crater bowls
            const bowls = [];
            for (let i = 0; i < Math.max(0, Math.round(craters)); i++) {
                const c = direction(seed * 3.1 + i * 12.9, seed * 7.7 + i * 5.3);
                c.radius = Math.max(0.08, craterSize * (0.45 + 0.8 * cpuHash11(seed * 11.3 + i * 3.7)));
                c.depth = craterDepth * (0.5 + cpuHash11(seed * 17.9 + i * 2.1));
                bowls.push(c);
            }

            for (let i = 0; i < array.length; i += 3) {
                const x = array[i], y = array[i + 1], z = array[i + 2];

                // 1. Lumpy body via FBM (cpuFbmValue already returns signed -1..1)
                let radius = 1;
                radius += cpuFbmValue(x * noiseScale, y * noiseScale, z * noiseScale, seed, 3) * lumpiness;
                radius += cpuFbmValue(x * noiseScale * 4.3, y * noiseScale * 4.3, z * noiseScale * 4.3, seed + 31.7, 2) * roughness * 0.5;

                // 2. Craters (before cuts so a cut can shear one in half)
                for (const bowl of bowls) {
                    const angle = Math.acos(clamp(x * bowl.x + y * bowl.y + z * bowl.z, -1, 1));
                    const q = angle / bowl.radius;
                    if (q >= 1.4) continue;
                    radius -= bowl.depth * Math.max(0, 1 - q * q);
                    radius += bowl.depth * 0.5 * smoothstep(0.72, 1.0, q) * (1 - smoothstep(1.0, 1.4, q));
                }

                radius = Math.max(0.35, radius);
                let px = x * radius, py = y * radius, pz = z * radius;

                // 3. Slice off flat faces (planar cuts)
                for (const plane of planes) {
                    const along = px * plane.x + py * plane.y + pz * plane.z;
                    const over = along - plane.offset;
                    if (over <= 0) continue;
                    px -= plane.x * over;
                    py -= plane.y * over;
                    pz -= plane.z * over;
                }

                array[i] = px;
                array[i + 1] = py;
                array[i + 2] = pz;
            }

            geometry.attributes.position.needsUpdate = true;
            geometry.computeVertexNormals();
            geometry.computeBoundingSphere();
            return geometry;
        }

        // --- 4. ICE CRYSTAL MATERIAL ---
        const iceVertexShader = `
            ${noiseGLSL}
            varying vec3 vWorldPos;
            varying vec3 vNormal;
            varying vec3 vLocalPos;
            void main() {
                vLocalPos = position;
                vec4 worldPos = modelMatrix * vec4(position, 1.0);
                vWorldPos = worldPos.xyz;
                vNormal = normalize(normalMatrix * normal);
                gl_Position = projectionMatrix * viewMatrix * worldPos;
            }
        `;

        const iceFragmentShader = `
            ${noiseGLSL}
            uniform vec3 colorDeep;
            uniform vec3 colorPale;
            uniform vec3 colorRim;
            uniform float uDensity;
            uniform float uFresnel;
            uniform float uFractureScale;
            uniform float uVeinScale;
            uniform float uSeed;
            uniform vec3 cameraPos;
            
            varying vec3 vWorldPos;
            varying vec3 vNormal;
            varying vec3 vLocalPos;

            void main() {
                vec3 viewDir = normalize(cameraPos - vWorldPos);
                float ndv = max(0.0, dot(vNormal, viewDir));
                
                // Thickness tint
                float thickness = clamp(ndv * uDensity, 0.0, 1.0);
                vec3 baseColor = mix(colorPale, colorDeep, thickness);
                
                // Fracture noise
                float fracture = ridged(vWorldPos * uFractureScale + uSeed, 4);
                baseColor += vec3(1.0) * fracture * 0.2;
                
                // Veins
                float veins = fbm3(vLocalPos * uVeinScale + uSeed);
                baseColor += colorPale * veins * 0.5;
                
                // Fresnel
                float fresnel = pow(1.0 - ndv, 2.4) * uFresnel;
                vec3 rimGlow = colorRim * fresnel;
                
                // Sparkle
                vec3 halfVector = normalize(viewDir + vNormal);
                float sp = dot(vNormal, halfVector) + snoise(vWorldPos * 20.0)*0.1;
                float sparkle = pow(clamp(sp, 0.0, 1.0), 14.0) * fresnel;
                
                vec3 finalGlow = baseColor + rimGlow + vec3(sparkle);
                
                // Soft emissive ceiling
                finalGlow /= (1.0 + finalGlow * 0.22);
                
                gl_FragColor = vec4(finalGlow, 0.9);
            }
        `;

        const iceMaterial = new THREE.ShaderMaterial({
            vertexShader: iceVertexShader,
            fragmentShader: iceFragmentShader,
            uniforms: {
                colorDeep: { value: new THREE.Color("#1a3a5c") },
                colorPale: { value: new THREE.Color("#b8e8ff") },
                colorRim: { value: new THREE.Color("#00ffff") },
                uDensity: { value: 2.0 },
                uFresnel: { value: 1.5 },
                uFractureScale: { value: 5.0 },
                uVeinScale: { value: 10.0 },
                uSeed: { value: Math.random() * 100 },
                cameraPos: { value: new THREE.Vector3() }
            },
            transparent: true,
            side: THREE.DoubleSide,
            depthWrite: true,
            flatShading: true
        });

        // --- 5. METEOR MATERIAL ---
        const meteorVertexShader = `
            ${noiseGLSL}
            varying vec3 vWorldPos;
            varying vec3 vNormal;
            varying vec3 vLocalPos;
            void main() {
                vLocalPos = position;
                vec4 worldPos = modelMatrix * vec4(position, 1.0);
                vWorldPos = worldPos.xyz;
                vNormal = normalize(normalMatrix * normal);
                gl_Position = projectionMatrix * viewMatrix * worldPos;
            }
        `;

        const meteorFragmentShader = `
            ${noiseGLSL}
            uniform vec3 colorRock;
            uniform vec3 colorChar;
            uniform vec3 colorLava;
            uniform vec3 colorCore;
            uniform float uTime;
            uniform vec3 uVelocityDir;
            
            varying vec3 vWorldPos;
            varying vec3 vNormal;
            varying vec3 vLocalPos;

            void main() {
                // Per-facet shading hack using derivatives
                vec3 dx = dFdx(vLocalPos);
                vec3 dy = dFdy(vLocalPos);
                vec3 facetNormal = normalize(cross(dx, dy));
                float shade = hash13(facetNormal) * 0.2 + 0.8;
                
                // Base rock with cavity occlusion
                float cavity = clamp(length(vLocalPos) * 0.8, 0.0, 1.0);
                vec3 baseColor = colorRock * shade * cavity;
                
                // Lava seams
                float crackScale = 2.0;
                float branches = 3.0;
                float seamNoise = min(abs(fbm3(vLocalPos * crackScale)), abs(fbm3(vLocalPos * crackScale * 2.7)) / branches);
                float crack = 1.0 - smoothstep(0.0, 0.15, seamNoise);
                
                // Magma flow
                float flow = snoise(vLocalPos * 4.0 + vec3(0.0, uTime * 2.0, 0.0)) * 0.5 + 0.5;
                
                vec3 lavaColor = mix(colorLava, colorCore, flow);
                
                // Leading face heat
                float travelHeat = max(0.0, dot(vNormal, normalize(uVelocityDir)));
                travelHeat = pow(travelHeat, 3.0);
                
                vec3 finalColor = mix(baseColor, colorChar, crack * 0.5); // soot halo
                finalColor = mix(finalColor, lavaColor, crack * 0.8);
                
                finalColor += colorCore * travelHeat * 1.5;
                
                // Soft emissive ceiling
                finalColor /= (1.0 + finalColor * 0.22);
                
                gl_FragColor = vec4(finalColor, 1.0);
            }
        `;

        const meteorMaterial = new THREE.ShaderMaterial({
            vertexShader: meteorVertexShader,
            fragmentShader: meteorFragmentShader,
            uniforms: {
                colorRock: { value: new THREE.Color("#2a1a0a") },
                colorChar: { value: new THREE.Color("#1a0800") },
                colorLava: { value: new THREE.Color("#ff3300") },
                colorCore: { value: new THREE.Color("#ffffff") },
                uTime: { value: 0 },
                uVelocityDir: { value: new THREE.Vector3(0, -1, 0) }
            },
            flatShading: true
        });

        // --- 6. FROST DECAL ---
        const frostDecalMat = new THREE.ShaderMaterial({
            vertexShader: `
                varying vec2 vUv;
                void main() { vUv = uv; gl_Position = projectionMatrix * viewMatrix * modelMatrix * vec4(position, 1.0); }
            `,
            fragmentShader: `
                ${noiseGLSL}
                uniform float uProgress;
                varying vec2 vUv;
                void main() {
                    vec2 p = vUv * 2.0 - 1.0;
                    float dist = length(p);
                    if(dist > 1.0) discard;
                    
                    vec2 v = voronoi2(p * 15.0);
                    float pattern = v.x;
                    
                    float spread = uProgress;
                    float alpha = smoothstep(spread, spread - 0.1, dist) * (1.0 - pattern);
                    alpha *= (1.0 - dist) * (1.0 - uProgress);
                    
                    vec3 color = mix(vec3(0.0, 1.0, 1.0), vec3(1.0), pattern);
                    gl_FragColor = vec4(color, alpha * 2.0);
                }
            `,
            uniforms: { uProgress: { value: 0 } },
            transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
        });

        // --- 7. LAVA DECAL ---
        const lavaDecalMat = new THREE.ShaderMaterial({
            vertexShader: `
                varying vec2 vUv;
                void main() { vUv = uv; gl_Position = projectionMatrix * viewMatrix * modelMatrix * vec4(position, 1.0); }
            `,
            fragmentShader: `
                ${noiseGLSL}
                uniform float uProgress;
                uniform float uTime;
                varying vec2 vUv;
                void main() {
                    vec2 p = (vUv * 2.0 - 1.0) * 2.0;
                    float dist = length(p);
                    if(dist > 1.0) discard;
                    
                    float noise = ridged(vec3(p * 3.0, 0.0), 4);
                    float crack = smoothstep(0.4, 0.5, noise);
                    
                    float flow = snoise(vec3(p * 5.0, uTime * 3.0)) * 0.5 + 0.5;
                    vec3 col = mix(vec3(1.0, 0.2, 0.0), vec3(1.0, 0.8, 0.0), flow);
                    
                    float alpha = crack * (1.0 - dist) * (1.0 - uProgress);
                    gl_FragColor = vec4(col, alpha);
                }
            `,
            uniforms: { uProgress: { value: 0 }, uTime: { value: 0 } },
            transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
        });
        
        // --- 8. SHOCKWAVE MATERIAL ---
        const shockwaveMat = new THREE.MeshBasicMaterial({
            color: 0xffaa00,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            side: THREE.DoubleSide
        });

        // --- 11. SCENE SETUP ---
        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.35;
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0a0a1a, 0.015);
        scene.background = new THREE.Color(0x0a0a1a);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 15, 25);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, 0, 0);

        // Grid Floor
        const gridHelper = new THREE.GridHelper(100, 100, 0x334455, 0x111122);
        scene.add(gridHelper);
        
        const groundPlane = new THREE.Mesh(
            new THREE.PlaneGeometry(100, 100),
            new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 })
        );
        groundPlane.rotation.x = -Math.PI / 2;
        scene.add(groundPlane);

        // Lights
        const ambient = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambient);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // Simple Caster Character
        const caster = new THREE.Group();
        const body = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 2), new THREE.MeshStandardMaterial({color: 0x222222, metalness: 0.8}));
        body.position.y = 1;
        const gem = new THREE.Mesh(new THREE.OctahedronGeometry(0.2), new THREE.MeshStandardMaterial({color: 0x00ffff, emissive: 0x008888}));
        gem.position.y = 2.5;
        caster.add(body);
        caster.add(gem);
        scene.add(caster);

        // Post-Processing
        const composer = new EffectComposer(renderer);
        const renderPass = new RenderPass(scene, camera);
        composer.addPass(renderPass);
        
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.8, 0.5, 0.15);
        composer.addPass(bloomPass);
        
        const outputPass = new OutputPass();
        composer.addPass(outputPass);

        document.getElementById('bloomToggle').addEventListener('change', (e) => {
            bloomPass.enabled = e.target.checked;
        });

        // Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- 12. INTERACTION ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        
        const indicatorGeo = new THREE.RingGeometry(2.8, 3, 32);
        indicatorGeo.rotateX(-Math.PI/2);
        const indicatorMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.5, side: THREE.DoubleSide });
        const indicator = new THREE.Mesh(indicatorGeo, indicatorMat);
        indicator.position.y = 0.01;
        scene.add(indicator);

        let activeSkill = 1;
        
        window.addEventListener('mousemove', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(groundPlane);
            if(intersects.length > 0) {
                indicator.position.copy(intersects[0].point);
                indicator.position.y = 0.05;
            }
        });

        window.addEventListener('keydown', (e) => {
            if(e.key === '1') {
                activeSkill = 1;
                document.getElementById('btn1').classList.add('active');
                document.getElementById('btn2').classList.remove('active');
                indicatorMat.color.setHex(0xffaa00);
            }
            if(e.key === '2') {
                activeSkill = 2;
                document.getElementById('btn1').classList.remove('active');
                document.getElementById('btn2').classList.add('active');
                indicatorMat.color.setHex(0x00ffff);
            }
        });

        window.addEventListener('mousedown', () => {
            if (activeSkill === 1) castMeteorRain(indicator.position.clone());
            if (activeSkill === 2) castIceRain(indicator.position.clone());
        });

        // Geometry counters for unique seeds
        let geoCounter = 0;

        // Entity Management
        const entities = [];
        const decals = [];
        
        let cameraShake = 0;
        const baseCamPos = new THREE.Vector3();

        // --- ABILITIES ---
        function castMeteorRain(target) {
            for(let i=0; i<6; i++) {
                setTimeout(() => {
                    // Unique asteroid geometry per meteor
                    const seed = 11.7 + (geoCounter++) * 7.3;
                    const meteorGeom = createAsteroidGeometry(seed, 3, 0.35, 1.8, 0.22, 8, 0.25, 5, 0.22, 0.55);
                    const mat = meteorMaterial.clone();
                    const meteor = new THREE.Mesh(meteorGeom, mat);
                    
                    const offset = new THREE.Vector3((Math.random()-0.5)*5, 0, (Math.random()-0.5)*5);
                    const finalTarget = target.clone().add(offset);
                    // Arc from the sky at an angle
                    const angle = Math.random() * TAU;
                    const dist = 8 + Math.random() * 6;
                    const startPos = finalTarget.clone().add(new THREE.Vector3(
                        Math.cos(angle) * dist, 25 + Math.random()*10, Math.sin(angle) * dist));
                    
                    meteor.position.copy(startPos);
                    const scale = 0.8 + Math.random()*0.5;
                    meteor.scale.setScalar(scale);
                    scene.add(meteor);
                    
                    const velocity = finalTarget.clone().sub(startPos).normalize().multiplyScalar(35 + Math.random()*10);
                    mat.uniforms.uVelocityDir.value.copy(velocity.clone().normalize());
                    
                    entities.push({
                        mesh: meteor,
                        velocity: velocity,
                        type: 'meteor',
                        targetY: 0,
                        rotAxis: new THREE.Vector3(Math.random(), Math.random(), Math.random()).normalize(),
                        rotSpeed: 3 + Math.random() * 5
                    });
                }, i * 150);
            }
        }

        function castIceRain(target) {
            for(let i=0; i<10; i++) {
                setTimeout(() => {
                    // Unique crystal geometry per shard
                    const seed = 3.9 + (geoCounter++) * 21.2;
                    const sides = 5 + Math.floor(Math.random() * 3); // 5-7 sides
                    const iceGeom = createCrystalGeometry(seed, sides, 0.08 + Math.random()*0.1, 0.35 + Math.random()*0.2, 0.18 + Math.random()*0.12);
                    // Scale tall and crystalline — visible facets
                    const scaleXZ = 0.4 + Math.random() * 0.35;
                    const scaleY = 2.0 + Math.random() * 2.0;
                    iceGeom.scale(scaleXZ, scaleY, scaleXZ);
                    
                    const mat = iceMaterial.clone();
                    mat.uniforms.uSeed.value = seed;
                    const crystal = new THREE.Mesh(iceGeom, mat);
                    
                    const offset = new THREE.Vector3((Math.random()-0.5)*6, 0, (Math.random()-0.5)*6);
                    const finalTarget = target.clone().add(offset);
                    const startPos = finalTarget.clone().add(new THREE.Vector3(
                        (Math.random()-0.5)*2, 20 + Math.random()*12, (Math.random()-0.5)*2));
                    
                    crystal.position.copy(startPos);
                    // Point downwards (apex first)
                    crystal.rotation.x = Math.PI;
                    crystal.rotation.z = (Math.random()-0.5) * 0.3;
                    scene.add(crystal);
                    
                    const velocity = new THREE.Vector3((Math.random()-0.5)*2, -30 - Math.random()*15, (Math.random()-0.5)*2);
                    
                    entities.push({
                        mesh: crystal,
                        velocity: velocity,
                        type: 'ice',
                        targetY: 0,
                        lifetime: 2.5,
                        stuck: false
                    });
                }, i * 90);
            }
        }
        
        function createImpact(pos, type) {
            cameraShake = 0.5;
            
            // Decal
            const decalGeo = new THREE.PlaneGeometry(8, 8);
            const mat = type === 'meteor' ? lavaDecalMat.clone() : frostDecalMat.clone();
            const decal = new THREE.Mesh(decalGeo, mat);
            decal.rotation.x = -Math.PI / 2;
            decal.position.copy(pos);
            decal.position.y = 0.02;
            scene.add(decal);
            decals.push({ mesh: decal, age: 0, maxAge: 2.0 });
            
            // Shockwave
            const swGeo = new THREE.TorusGeometry(0.5, 0.1, 8, 32);
            const swMat = shockwaveMat.clone();
            if(type==='ice') swMat.color.setHex(0x00ffff);
            const shockwave = new THREE.Mesh(swGeo, swMat);
            shockwave.rotation.x = Math.PI / 2;
            shockwave.position.copy(pos);
            scene.add(shockwave);
            decals.push({ mesh: shockwave, age: 0, maxAge: 0.5, isRing: true });
            
            // Light Flash
            const light = new THREE.PointLight(type === 'meteor' ? 0xff4400 : 0x00ffff, 10, 15);
            light.position.copy(pos);
            light.position.y += 1;
            scene.add(light);
            decals.push({ mesh: light, age: 0, maxAge: 0.3, isLight: true });
        }

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();
            const t = clock.getElapsedTime();
            
            controls.update();
            baseCamPos.copy(camera.position);

            gem.position.y = 2.5 + Math.sin(t * 2) * 0.2;
            gem.rotation.y += dt;
            indicator.scale.setScalar(1.0 + Math.sin(t * 8) * 0.05);

            // Update Entities
            for(let i = entities.length - 1; i >= 0; i--) {
                const e = entities[i];
                if(e.stuck) {
                    e.lifetime -= dt;
                    if(e.lifetime <= 0) {
                        scene.remove(e.mesh);
                        entities.splice(i, 1);
                    } else {
                        // Fade out
                        e.mesh.material.opacity = e.lifetime;
                    }
                    continue;
                }
                
                if (e.mesh.material.uniforms && e.mesh.material.uniforms.uTime) {
                    e.mesh.material.uniforms.uTime.value = t;
                }
                if (e.mesh.material.uniforms && e.mesh.material.uniforms.cameraPos) {
                    e.mesh.material.uniforms.cameraPos.value.copy(camera.position);
                }

                e.mesh.position.addScaledVector(e.velocity, dt);
                
                if(e.type === 'meteor') {
                    e.mesh.rotateOnWorldAxis(e.rotAxis, e.rotSpeed * dt);
                }

                if(e.mesh.position.y <= e.targetY) {
                    e.mesh.position.y = e.targetY;
                    createImpact(e.mesh.position, e.type);
                    
                    if(e.type === 'ice') {
                        e.stuck = true;
                        e.mesh.material.transparent = true;
                        // Stick in ground — flip upright (base in ground, apex pointing up)
                        e.mesh.rotation.x = (Math.random()-0.5) * 0.4;
                        e.mesh.rotation.z = (Math.random()-0.5) * 0.4;
                        e.mesh.position.y = -0.3; // Partially buried
                    } else {
                        scene.remove(e.mesh);
                        entities.splice(i, 1);
                    }
                }
            }
            
            // Update Decals
            for(let i = decals.length - 1; i >= 0; i--) {
                const d = decals[i];
                d.age += dt;
                const progress = d.age / d.maxAge;
                
                if(d.age >= d.maxAge) {
                    scene.remove(d.mesh);
                    if(d.mesh.material) d.mesh.material.dispose();
                    if(d.mesh.geometry) d.mesh.geometry.dispose();
                    decals.splice(i, 1);
                } else {
                    if(d.isRing) {
                        d.mesh.scale.setScalar(1 + progress * 15);
                        d.mesh.material.opacity = 1.0 - progress;
                    } else if(d.isLight) {
                        d.mesh.intensity = 10 * (1.0 - progress);
                    } else {
                        if (d.mesh.material.uniforms) {
                            d.mesh.material.uniforms.uProgress.value = progress;
                            if(d.mesh.material.uniforms.uTime) d.mesh.material.uniforms.uTime.value = t;
                        }
                    }
                }
            }

            // Camera Shake
            if(cameraShake > 0) {
                cameraShake -= dt * 2.0;
                if(cameraShake < 0) cameraShake = 0;
                camera.position.x = baseCamPos.x + (Math.random()-0.5) * cameraShake;
                camera.position.y = baseCamPos.y + (Math.random()-0.5) * cameraShake;
                camera.position.z = baseCamPos.z + (Math.random()-0.5) * cameraShake;
            }

            composer.render();
        }

        animate();
    </script>
</body>
</html>
