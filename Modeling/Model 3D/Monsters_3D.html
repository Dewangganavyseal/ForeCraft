<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FORECRAFT — Official Game Monsters 3D Showcase</title>
<style>
  body { margin:0; overflow:hidden; background:#0a0e17; font-family:sans-serif; color:#e0aa4f; }
  #ui { position:fixed; top:18px; left:18px; z-index:10; background:rgba(10,14,23,0.88); padding:16px 22px; border:1px solid #e0aa4f; border-radius:10px; max-width:380px; box-shadow:0 8px 32px rgba(0,0,0,0.6); }
  h1 { margin:0 0 6px 0; font-size:22px; color:#ffd24d; text-shadow:0 2px 8px rgba(255,210,77,0.3); }
  p { margin:0 0 12px 0; font-size:13px; color:#9aa3b2; line-height:1.4; }
  .btn-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:12px; }
  button { background:#1e2738; color:#e0aa4f; border:1px solid #3c4b66; padding:8px 12px; font-weight:bold; font-size:12px; border-radius:6px; cursor:pointer; transition:0.2s; text-align:left; }
  button:hover { background:#e0aa4f; color:#0a0e17; border-color:#ffe0a3; transform:translateY(-1px); }
  button.active { background:linear-gradient(135deg, #e0aa4f, #c48b2e); color:#0a0e17; border-color:#fff; }
  .boss-toggle { width:100%; padding:10px; text-align:center; background:#4a1e38; color:#ff8fe0; border:1px solid #ff6bd6; font-size:13px; border-radius:6px; cursor:pointer; font-weight:bold; }
  .boss-toggle.on { background:linear-gradient(135deg, #ff6bd6, #a82e88); color:#fff; border-color:#fff; box-shadow:0 0 16px rgba(255,107,214,0.5); }
  #stats-panel { margin-top:12px; padding:10px; background:rgba(255,255,255,0.05); border-radius:6px; font-size:12px; color:#d4dcfa; }
  #stats-panel strong { color:#ffd24d; }
</style>
</head>
<body>
<div id="ui">
  <h1>FORECRAFT: Game Monsters 3D</h1>
  <p>Model monster 100% asli disalin dari script game (<code>js/monsters.js</code>):</p>
  <div class="btn-grid">
    <button onclick="selectMonster('slime', this)">🟢 Slime</button>
    <button onclick="selectMonster('boar', this)">🐗 Babi Hutan</button>
    <button onclick="selectMonster('wolf', this)">🐺 Serigala</button>
    <button onclick="selectMonster('scorpion', this)">🦂 Kalajengking</button>
    <button onclick="selectMonster('rabbit', this)">🐇 Kelinci</button>
    <button onclick="selectMonster('golem', this)">🗿 Golem Batu</button>
    <button onclick="selectMonster('wraith', this)">👻 Monster Hitam</button>
    <button onclick="selectMonster('bat', this)">🦇 Kelelawar</button>
  </div>
  <button id="bossBtn" class="boss-toggle" onclick="toggleBoss()">☠️ Mode Boss Raksasa (OFF)</button>
  <div id="stats-panel">
    <div id="stat-name"><strong>Slime Gelatinous</strong></div>
    <div id="stat-desc">HP: 22 · Damage: 6 · XP: 14</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="../../Script Model 3D/model_monsters.js"></script>

<script>
  let currentType = 'golem';
  let isBossMode = false;
  let activeMonster = null;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0e17);

  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(3.5, 3.0, 5.0);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  document.body.appendChild(renderer.domElement);

  const controls = (typeof THREE.OrbitControls === 'function')
    ? new THREE.OrbitControls(camera, renderer.domElement)
    : { update: () => {} };
  if (controls.target) controls.target.set(0, 1.0, 0);
  if (controls.enableDamping) controls.enableDamping = true;

  scene.add(new THREE.HemisphereLight(0xffffff, 0x333344, 1.2));
  const dirLight = new THREE.DirectionalLight(0xffe0a3, 2.0);
  dirLight.position.set(6, 10, 6);
  dirLight.castShadow = true;
  scene.add(dirLight);

  const grid = new THREE.GridHelper(12, 12, 0xe0aa4f, 0x223344);
  scene.add(grid);

  function updateMonster() {
    if (activeMonster) scene.remove(activeMonster);
    const m = Monster3DModels.make(currentType, isBossMode);
    activeMonster = m.group;
    scene.add(activeMonster);

    const info = MONSTER_REGISTRY[currentType] || {};
    const hp = isBossMode ? info.hp * 6 : info.hp;
    const dmg = isBossMode ? Math.round(info.dmg * 2.2) : info.dmg;
    const xp = isBossMode ? info.xp * 7 : info.xp;

    document.getElementById('stat-name').innerHTML = `${info.icon || ''} <strong>${info.name || currentType}</strong> ${isBossMode ? '<span style="color:#ff6bd6">[BOSS RAKSASA]</span>' : ''}`;
    document.getElementById('stat-desc').innerHTML = `Tipe: <strong>${info.type || 'Mob'}</strong><br>HP: <strong>${hp}</strong> · Damage: <strong>${dmg}</strong> · XP: <strong>${xp}</strong>`;
  }

  function selectMonster(type, btn) {
    currentType = type;
    document.querySelectorAll('.btn-grid button').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    updateMonster();
  }

  function toggleBoss() {
    isBossMode = !isBossMode;
    const btn = document.getElementById('bossBtn');
    if (isBossMode) {
      btn.classList.add('on');
      btn.textContent = '☠️ Mode Boss Raksasa (ON)';
    } else {
      btn.classList.remove('on');
      btn.textContent = '☠️ Mode Boss Raksasa (OFF)';
    }
    updateMonster();
  }

  // Pilih monster Golem secara default
  selectMonster('golem', document.querySelectorAll('.btn-grid button')[5]);

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    if (activeMonster) activeMonster.rotation.y += 0.006;
    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
