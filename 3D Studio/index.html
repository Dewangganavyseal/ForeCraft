<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FORECRAFT — 3D Studio (Real-Time In-Game Inspector)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; overflow: hidden; background: #07090e; font-family: 'Plus Jakarta Sans', sans-serif; color: #e4ebf5; user-select: none; }
  
  #header {
    position: fixed; top: 16px; left: 18px; z-index: 100;
    background: rgba(11, 15, 23, 0.92); backdrop-filter: blur(12px);
    border: 1px solid rgba(224, 170, 79, 0.35); border-radius: 12px;
    padding: 12px 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.6);
  }
  #header h1 { margin: 0; font-family: 'Cinzel', serif; font-size: 20px; color: #f3c96b; letter-spacing: 0.05em; display: flex; align-items: center; gap: 8px; }
  #header p { margin: 3px 0 0 0; font-size: 12px; color: #9aa8bd; }

  /* Tab Navigation */
  #tabs {
    position: fixed; top: 16px; right: 18px; z-index: 100;
    display: flex; gap: 8px; background: rgba(11, 15, 23, 0.92); backdrop-filter: blur(12px);
    border: 1px solid rgba(224, 170, 79, 0.35); border-radius: 12px; padding: 6px;
  }
  .tab-btn {
    background: transparent; border: none; color: #9aa8bd; padding: 8px 16px;
    border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; transition: 0.2s;
  }
  .tab-btn:hover { color: #f3c96b; background: rgba(243, 201, 107, 0.1); }
  .tab-btn.active { background: linear-gradient(135deg, #e0aa4f, #c98f34); color: #0b0f17; font-weight: 700; }

  /* Sub Toolbar / Controls Panel */
  #controls-panel {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 100;
    background: rgba(11, 15, 23, 0.94); backdrop-filter: blur(12px);
    border: 1px solid rgba(224, 170, 79, 0.35); border-radius: 14px;
    padding: 12px 20px; display: flex; flex-direction: column; gap: 10px;
    max-width: 92vw; overflow-x: auto; box-shadow: 0 12px 40px rgba(0,0,0,0.7);
  }
  .btn-group { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; align-items: center; }
  .sub-label { font-size: 11px; font-weight: 700; color: #e0aa4f; text-transform: uppercase; letter-spacing: 0.05em; margin-right: 6px; }
  
  .chip {
    background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.12);
    color: #e4ebf5; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600;
    cursor: pointer; transition: 0.2s; white-space: nowrap;
  }
  .chip:hover { border-color: #f3c96b; background: rgba(243, 201, 107, 0.15); color: #f3c96b; }
  .chip.active { background: #e0aa4f; color: #07090e; font-weight: 700; border-color: #f3c96b; }

  /* Floating Info Badge */
  #info-badge {
    position: fixed; left: 18px; bottom: 20px; z-index: 100;
    background: rgba(11, 15, 23, 0.85); backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 10px;
    padding: 10px 16px; font-size: 12px; color: #9aa8bd; line-height: 1.5;
  }
  #info-badge b { color: #f3c96b; }
</style>
</head>
<body>

<div id="header">
  <h1>🌲 3D STUDIO FORECRAFT</h1>
  <p>100% Identik dengan Model Gameplay In-Game Asli</p>
</div>

<div id="tabs">
  <button class="tab-btn active" data-cat="player" onclick="switchCategory('player', this)">🧍 Player & Equipments</button>
  <button class="tab-btn" data-cat="npcs" onclick="switchCategory('npcs', this)">🤝 NPCs Desa</button>
  <button class="tab-btn" data-cat="mobs" onclick="switchCategory('mobs', this)">👾 Mobs & Bosses</button>
  <button class="tab-btn" data-cat="env" onclick="switchCategory('env', this)">🌳 Environment</button>
</div>

<div id="controls-panel">
  <div id="sub-row-1" class="btn-group"></div>
  <div id="sub-row-2" class="btn-group"></div>
  <div id="sub-row-3" class="btn-group"></div>
</div>

<div id="info-badge">
  <span id="badge-title"><b>Model:</b> Main Character</span><br>
  <span id="badge-desc">Source: js/player.js · Memakai builder & equipment asli in-game</span>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<!-- Mock Engine Environment to bind In-Game Core Scripts -->
<script>
  window.IS_MOBILE = false;
  window.Game = { scene: null };
  window.clamp = (v, min, max) => Math.max(min, Math.min(max, v));
  window.rand = (a, b) => a + Math.random() * (b - a);
  window.randInt = (a, b) => Math.floor(rand(a, b + 1));
  window.UI = { toast() {}, renderTeam() {} };
  window.Sfx = { open() {}, click() {} };
  /* Mock RPG — logika weapon()/weaponId() DIPERIS dari js/rpg.js supaya
     Player.refreshWeapon() membaca data senjata yang sama persis dengan
     in-game (ITEMS[id].weapon → warna blade/trim asli tiap pedang).
     PENTING: ID item armor harus yang terdaftar di ITEMS (js/config.js):
     helm_gold/plate_gold/greaves_gold — BUKAN chest_gold/boots_gold. */
  window.RPG = {
    equip: { weapon: 'sword_frost', helm: 'helm_gold', chest: 'plate_gold', boots: 'greaves_gold' },
    START_WEAPON: 'sword_wood',
    FIST: { dmg: 7, spd: 1.0, crit: 0.03, reach: 2.6, fx: 'crush', blade: 0xdcb894, trim: 0xb08a52 },
    weapon() {
      const id = this.equip.weapon;
      if (id && ITEMS[id] && ITEMS[id].weapon) return ITEMS[id].weapon;
      return this.FIST;
    },
    weaponId() {
      const id = this.equip.weapon;
      return (id && ITEMS[id] && ITEMS[id].weapon) ? id : null;
    }
  };
</script>

<!-- Studio Scene Logic -->
<script>
  let scene, camera, renderer, controls, clock;
  let activeCategory = 'player';
  let activeMesh = null;
  let currentArmorTier = 'gold';
  let currentWeaponId = 'sword_frost';
  let isBossMode = false;

  /* ================= KATALOG ANIMASI STUDIO =================
     Daftar animasi yang ditampilkan dinamis mengikuti model yang dipilih —
     diambil dari kemampuan animasi ASLI masing-masing entitas in-game. */
  let studioSubject = null;        // {kind:'player'|'npc'|'mob', anim, n/m/role}
  let studioPlayerAnim = null;     // PlayerAnimator utk main character

  const PLAYER_ANIMS = [
    { id: 'idle',   label: '🙂 Idle' },
    { id: 'walk',   label: '🚶 Jalan' },
    { id: 'sprint', label: '🏃 Lari' },
    { id: 'jump',   label: '🦘 Lompat' },
    { id: 'dash',   label: '💨 Dash' },
    { id: 'block',  label: '🛡️ Tangkis' },
    { id: 'combo1', label: '⚔️ Combo 1' },
    { id: 'combo2', label: '⚔️ Combo 2' },
    { id: 'combo3', label: '⚔️ Combo 3' },
    { id: 'combo4', label: '⚔️ Combo 4' },
    { id: 'combo5', label: '⚔️ Combo 5' },
    { id: 'sequence', label: '🎞️ Rangkaian' },
    { id: 'death',  label: '💀 Tumbang' },
  ];
  const BASE_NPC_ANIMS = [
    { id: 'idle',   label: '🙂 Diam' },
    { id: 'walk',   label: '🚶 Jalan' },
    { id: 'attack', label: '⚔️ Serang' },
  ];
  /* skill khas NPC langka — hanya muncul untuk arketipe pemiliknya */
  const NPC_EXTRA_ANIMS = {
    lionknight:    [{ id: 'roar',        label: '🦁 Auman Singa' }],
    goblin:        [{ id: 'leap',        label: '🗡️ Backstab Leap' }],
    rabbitwarrior: [{ id: 'rapidclaw',   label: '🐾 RAPID CLAW' }],
    stonegiant:    [{ id: 'quake',       label: '💥 EARTHQUAKE' }],
    elfmage:       [{ id: 'cast_ice',    label: '❄️ Hujan Es' },
                    { id: 'cast_meteor', label: '☄️ Hujan Meteor' }],
  };
  /* animasi per tipe mob: idle/jalan + aksi khasnya */
  const MOB_ANIMS = {
    slime:    [{ id: 'idle', label: '🙂 Diam' }, { id: 'hop', label: '🟢 Lompat' }],
    boar:     [{ id: 'idle', label: '🙂 Diam' }, { id: 'walk', label: '🚶 Jalan' }, { id: 'attack', label: '🐗 Seruduk' }],
    wolf:     [{ id: 'idle', label: '🙂 Diam' }, { id: 'walk', label: '🚶 Jalan' }, { id: 'attack', label: '🐺 Gigit' }],
    scorpion: [{ id: 'idle', label: '🙂 Diam' }, { id: 'walk', label: '🚶 Jalan' }, { id: 'attack', label: '🦂 Sengat' }],
    golem:    [{ id: 'idle', label: '🙂 Diam' }, { id: 'walk', label: '🚶 Jalan' }, { id: 'attack', label: '🗿 Hantam' }],
    rabbit:   [{ id: 'idle', label: '🙂 Diam' }, { id: 'walk', label: '🚶 Jalan' }, { id: 'hop', label: '🐇 Lompat' }],
    dragon:   [{ id: 'idle', label: '🙂 Diam' }, { id: 'walk', label: '🚶 Jalan' }, { id: 'run', label: '🏃 Lari' }, { id: 'attack', label: '🐉 Cakar' }, { id: 'tail', label: '🌀 Sapuan Ekor' }, { id: 'fly', label: '🔥 Semburan Api (Terbang)' }],
  };
  function animsForNpc(roleId) {
    return BASE_NPC_ANIMS.concat(NPC_EXTRA_ANIMS[roleId] || []);
  }

  function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x07090e);
    scene.fog = new THREE.FogExp2(0x07090e, 0.035);
    window.Game.scene = scene;

    camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(3.2, 2.2, 4.2);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    if (THREE.OrbitControls) {
      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 1.0, 0);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
    }

    clock = new THREE.Clock();

    // Lighting Studio
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x223344, 1.3);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xffe6b0, 2.2);
    dirLight.position.set(6, 10, 6);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    scene.add(dirLight);

    const backLight = new THREE.DirectionalLight(0x4da3ff, 1.0);
    backLight.position.set(-6, 6, -6);
    scene.add(backLight);

    // Floor Grid & Shadow Plane
    const grid = new THREE.GridHelper(16, 16, 0xe0aa4f, 0x1f2937);
    grid.position.y = -0.01;
    scene.add(grid);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(30, 30),
      new THREE.ShadowMaterial({ opacity: 0.35 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    // Load initial category safely
    switchCategory('player', document.querySelector('.tab-btn[data-cat="player"]'));

    window.addEventListener('resize', onWindowResize);
    animate();
  }

  function clearActiveMesh() {
    if (activeMesh) {
      scene.remove(activeMesh);
      activeMesh = null;
    }
    if (Player && Player.mesh && Player.mesh.parent) {
      Player.mesh.parent.remove(Player.mesh);
    }
  }

  function switchCategory(cat, btn) {
    activeCategory = cat;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    if (btn) {
      btn.classList.add('active');
    } else {
      const targetBtn = document.querySelector(`.tab-btn[data-cat="${cat}"]`);
      if (targetBtn) targetBtn.classList.add('active');
    }

    const row1 = document.getElementById('sub-row-1');
    const row2 = document.getElementById('sub-row-2');
    const row3 = document.getElementById('sub-row-3');
    if (!row1 || !row2 || !row3) return;
    row1.innerHTML = '';
    row2.innerHTML = '';
    row3.innerHTML = '';
    row2.style.display = '';
    row3.style.display = '';

    if (cat === 'player') {
      loadPlayerModel();
      buildPlayerControls(row1, row2, row3);
    } else if (cat === 'npcs') {
      buildNPCControls(row1, row2);
      loadNPCModel('guard');
    } else if (cat === 'mobs') {
      buildMobControls(row1);
      loadMobModel('slime');
    } else if (cat === 'env') {
      row3.style.display = 'none';
      buildEnvControls(row1, row2);
      loadEnvModel('table');
    }
  }

  /* ================= 1. PLAYER & EQUIPMENTS ================= */
  function loadPlayerModel() {
    clearActiveMesh();
    
    // Call EXACT IN-GAME Player Model Builder
    Player.buildModel();
    activeMesh = Player.mesh;

    // Apply exact in-game armor & weapon
    setPlayerArmor(currentArmorTier);
    setPlayerWeapon(currentWeaponId);

    /* animator utama: PlayerAnimator (js/player/player_animations.js) —
       kelas animasi resmi karakter; studio tinggal memilih nama animasinya */
    studioPlayerAnim = new PlayerAnimator(Player.parts);
    studioPlayerAnim.setAnimation('idle');
    studioSubject = { kind: 'player', anim: 'idle' };

    if (controls) controls.target.set(0, 1.0, 0);
    const bTitle = document.getElementById('badge-title');
    if (bTitle) bTitle.innerHTML = '<b>Model:</b> Karakter Utama (In-Game Gameplay Forecraft)';
    const bDesc = document.getElementById('badge-desc');
    if (bDesc) {
      bDesc.dataset.base = 'Source: js/player.js + js/player/player_animations.js · buildModel/refreshArmor/refreshWeapon persis kode in-game';
      bDesc.innerText = bDesc.dataset.base;
    }
    updateBadgeAnim();
  }

  function buildPlayerControls(r1, r2, r3) {
    r1.innerHTML = `
      <span class="sub-label">🛡️ Armor In-Game:</span>
      <button class="chip ${currentArmorTier==='none'?'active':''}" onclick="setPlayerArmor('none', this)">None</button>
      <button class="chip ${currentArmorTier==='leather'?'active':''}" onclick="setPlayerArmor('leather', this)">Leather</button>
      <button class="chip ${currentArmorTier==='iron'?'active':''}" onclick="setPlayerArmor('iron', this)">Iron</button>
      <button class="chip ${currentArmorTier==='gold'?'active':''}" onclick="setPlayerArmor('gold', this)">Gold</button>
      <button class="chip ${currentArmorTier==='crystal'?'active':''}" onclick="setPlayerArmor('crystal', this)">Crystal</button>
    `;

    r2.innerHTML = `
      <span class="sub-label">🗡️ Senjata In-Game:</span>
      <button class="chip ${currentWeaponId==='none'?'active':''}" onclick="setPlayerWeapon('none', this)">✊ Tangan Kosong</button>
      <button class="chip ${currentWeaponId==='sword_wood'?'active':''}" onclick="setPlayerWeapon('sword_wood', this)">Wood</button>
      <button class="chip ${currentWeaponId==='sword_iron'?'active':''}" onclick="setPlayerWeapon('sword_iron', this)">Iron</button>
      <button class="chip ${currentWeaponId==='sword_storm'?'active':''}" onclick="setPlayerWeapon('sword_storm', this)">Storm</button>
      <button class="chip ${currentWeaponId==='sword_venom'?'active':''}" onclick="setPlayerWeapon('sword_venom', this)">Venom</button>
      <button class="chip ${currentWeaponId==='sword_frost'?'active':''}" onclick="setPlayerWeapon('sword_frost', this)">Frost</button>
      <button class="chip ${currentWeaponId==='sword_titan'?'active':''}" onclick="setPlayerWeapon('sword_titan', this)">Titan</button>
    `;

    /* baris animasi — dibangun dari katalog PlayerAnimator */
    buildAnimChips(r3, PLAYER_ANIMS);
  }

  /* ID item armor PERSIS seperti di js/config.js (ITEMS). Tier leather
     memakai cap_leather/vest_leather/boots_leather; tier lain mengikuti
     pola helm_X / plate_X / greaves_X. */
  const ARMOR_ID_BY_TIER = {
    leather: { helm: 'cap_leather',  chest: 'vest_leather',  boots: 'boots_leather' },
    iron:    { helm: 'helm_iron',    chest: 'plate_iron',    boots: 'greaves_iron' },
    gold:    { helm: 'helm_gold',    chest: 'plate_gold',    boots: 'greaves_gold' },
    crystal: { helm: 'helm_crystal', chest: 'plate_crystal', boots: 'greaves_crystal' }
  };

  function setPlayerArmor(tier, btn) {
    if (btn) {
      btn.parentElement.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
    }
    currentArmorTier = tier;
    const ids = ARMOR_ID_BY_TIER[tier] || {};
    /* slot weapon dipertahankan — sama seperti in-game, armor & senjata
       adalah slot equipment yang terpisah */
    RPG.equip = {
      weapon: RPG.equip.weapon || null,
      helm: ids.helm || null,
      chest: ids.chest || null,
      boots: ids.boots || null
    };
    Player.refreshArmor();
  }

  function setPlayerWeapon(id, btn) {
    if (btn) {
      btn.parentElement.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
    }
    currentWeaponId = id;
    /* persis in-game: senjata tersimpan di RPG.equip.weapon; null =
       tangan kosong (bilah disembunyikan, kepalan ditebalkan) */
    RPG.equip.weapon = (id === 'none') ? null : id;
    Player.refreshWeapon();
  }

  /* ================= SISTEM ANIMASI STUDIO =================
     Chip animasi dibangun dinamis dari katalog model yang dipilih.
     Saat chip diklik, driver studio (studioDrive di loop animate) menyiapkan
     state yang dibutuhkan lalu memanggil dispatcher animasi ASLI game:
       player → PlayerAnimator.update(dt)
       npc    → NPCS.animate(n,dt)   (skill: roar/leap/rapidclaw/quake/cast)
       mob    → Monsters.animate(m,dt) (bite/sting/windup/hop)            */
  function buildAnimChips(container, list) {
    if (!container) return;
    container.innerHTML = '<span class="sub-label">🎬 Animasi:</span>';
    list.forEach(a => {
      const b = document.createElement('button');
      b.className = 'chip' + (studioSubject && studioSubject.anim === a.id ? ' active' : '');
      b.textContent = a.label;
      b.onclick = () => setStudioAnim(a.id, b);
      container.appendChild(b);
    });
  }

  function setStudioAnim(id, btn) {
    if (!studioSubject) return;
    if (btn) {
      btn.parentElement.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
    }
    studioSubject.anim = id;
    /* bersihkan sisa state skill/serangan agar animasi baru mulai bersih */
    if (studioSubject.kind === 'npc') {
      const n = studioSubject.n;
      n.swing = 0; n.flash = 0; n.roar = null; n.cast = null; n.quake = null;
      if (n.rab) n.rab.action = null;
      if (n.gob) n.gob.action = null;
      n.vel.set(0, 0, 0);
    } else if (studioSubject.kind === 'mob') {
      const m = studioSubject.m;
      m.windup = 0; m.biteT = 0; m.stingT = 0;
      m.atkT = 0; m.windupT = 0; m.hopT = 0;
      m.vel.set(0, 0, 0); m.pos.y = 0; m.onGround = true;
      m.mesh.position.y = 0; m.state = 'wander';
    } else if (studioSubject.kind === 'player' && studioPlayerAnim) {
      studioPlayerAnim.setAnimation(id);
    }
    updateBadgeAnim();
  }

  /* tampilkan nama animasi aktif di info badge */
  function updateBadgeAnim() {
    const el = document.getElementById('badge-desc');
    if (!el || !studioSubject) return;
    let list = [];
    if (studioSubject.kind === 'player') list = PLAYER_ANIMS;
    else if (studioSubject.kind === 'npc') list = animsForNpc(studioSubject.role.id);
    else if (studioSubject.kind === 'mob') list = MOB_ANIMS[studioSubject.m.type] || [];
    const a = list.find(x => x.id === studioSubject.anim);
    el.innerText = (el.dataset.base || '') + (a ? ' · Animasi: ' + a.label : '');
  }

  /* ---------- driver per-frame untuk NPC (state → animasi asli) ---------- */
  function driveNpc(n, animId, dt) {
    n.swing = Math.max(0, n.swing - dt);
    n.flash = Math.max(0, n.flash - dt);
    n.atkCd = Math.max(0, n.atkCd - dt);
    if (animId !== 'walk') { n.vel.x *= 0.8; n.vel.z *= 0.8; }

    switch (animId) {
      case 'idle':
        break;
      case 'walk':
        n.vel.x = n.speed || 2.6;   // animasi membaca kecepatan dari vel
        break;
      case 'attack':
        n.atkT = (n.atkT || 0) - dt;
        if (n.atkT <= 0) {
          n.atkT = 0.95;
          if (n.role.id === 'rabbitwarrior' && window.NPC_Rabbitwarrior) {
            /* combo sabitan 1→2→3 bergilir, timeline dijalankan animate() */
            n.rab = n.rab || window.NPC_Rabbitwarrior.rabbitState();
            n.rab.comboIdx = ((n.rab.comboIdx || 0) + 1) % 3;
            n.rab.action = { name: ['combo1', 'combo2', 'combo3'][n.rab.comboIdx], t: 0 };
          } else {
            n.swing = 0.25;
          }
        }
        break;
      /* ---- skill NPC langka: state diset di sini, pose oleh animate() ---- */
      case 'roar':        // Manusia Singa — timeline n.roar dimajukan animate()
        if (!n.roar) n.roar = { t: 0, w1: false, w2: false };
        break;
      case 'leap':        // Goblin Emas — timeline gb.action normally dari combat()
        if (window.NPC_Goblin) {
          n.gob = n.gob || { roarCd: 0, comboIdx: 0 };
          if (!n.gob.action) {
            n.gob.action = { name: 'leap', t: 0, lastHit: -1, startPos: n.pos.clone() };
          } else {
            n.gob.action.t += dt;
            if (n.gob.action.t >= window.NPC_Goblin.GB_DUR) n.gob.action = null;
          }
        }
        break;
      case 'rapidclaw':   // Kelinci Cakar — timeline dimajukan animate()
        if (window.NPC_Rabbitwarrior) {
          n.rab = n.rab || window.NPC_Rabbitwarrior.rabbitState();
          if (!n.rab.action) n.rab.action = { name: 'skill', t: 0, lastStrike: -1 };
        }
        break;
      case 'quake':       // Raksasa Batu — timeline n.quake normally dari combat()
        if (window.NPC_Stonegiant) {
          const SG = window.NPC_Stonegiant;
          if (!n.quake) n.quake = { t: 0, hitDone: [false, false, false], target: null };
          else {
            n.quake.t += dt;
            if (n.quake.t >= SG.Q_N * SG.Q_CYC + 0.5) n.quake = null;
          }
        }
        break;
      case 'cast_ice':
      case 'cast_meteor': // Penyihir Elf — n.cast di-loop di sini; timeline
        // dimajukan elfAnim() sendiri (safeguard target-null di npc_elfmage.js)
        if (!n.cast) {
          n.cast = { type: animId === 'cast_ice' ? 'ice' : 'meteor',
                     t: 0, acc: 0, dmgT: 0, x: 0, z: 0, y: 4 };
        }
        break;
    }
    NPCS.animate(n, dt);
    n.mesh.position.x = 0; n.mesh.position.z = 0;
  }

  /* ---------- driver per-frame untuk mob ---------- */
  function driveMob(m, animId, dt) {
    m.flash = Math.max(0, m.flash - dt);
    const T = Monsters.TYPES[m.type] || { speed: 3 };
    switch (animId) {
      case 'idle':
        m.vel.x = 0; m.vel.z = 0; m.state = 'wander';
        break;
      case 'walk':
        m.vel.x = T.speed * (m.boss ? 0.85 : 1); m.vel.z = 0;
        m.state = 'wander';
        break;
      case 'run':
        /* lari: vel > 3.2 memicu state 'run' di Mob_Dragon.animate */
        m.vel.x = 4.0; m.vel.z = 0;
        m.state = 'wander';
        break;
      case 'attack':
        m.atkT = (m.atkT || 0) - dt;
        if (m.type === 'wolf') {
          m.vel.x = T.speed * 0.85;
          if (m.atkT <= 0) { m.atkT = 0.85; m.biteT = 0.22; }
        } else if (m.type === 'scorpion') {
          m.state = 'chase'; m.vel.x = T.speed;
          if (m.atkT <= 0) { m.atkT = 1.4; m.stingT = 0.3; }
        } else if (m.type === 'boar') {
          m.vel.x = T.speed;
          if (m.atkT <= 0) { m.atkT = 1.2; m.parts.head.rotation.x = -0.6; }
        } else if (m.type === 'golem') {
          /* siklus windup 0.8 dtk → jeda, lengan diangkat persis in-game */
          m.vel.x = 0;
          m.windupT = (m.windupT || 0) + dt;
          const ph = m.windupT % 2.8;
          if (ph < 0.8) {
            m.windup = 0.8 - ph;
            const p = 1 - m.windup / 0.8;
            if (m.parts.armL) m.parts.armL.rotation.x = lerp(0, -2.6, Math.min(1, p * 1.6));
            if (m.parts.armR) m.parts.armR.rotation.x = lerp(0, -2.6, Math.min(1, p * 1.6));
          } else m.windup = 0;
        } else if (m.type === 'dragon') {
          /* cakar naga: clawT dihitung mundur di Mob_Dragon.animate */
          m.vel.x = 0;
          if (m.atkT <= 0) { m.atkT = 2.0; m.clawT = 0.95; }
        }
        break;
      case 'tail':
        /* sapuan ekor naga (tailT dihitung mundur di Mob_Dragon.animate) */
        if (m.type === 'dragon') {
          m.vel.x = 0;
          if (m.atkT <= 0) { m.atkT = 2.0; m.tailT = 1.5; }
        }
        break;
      case 'fly':
        /* terbang + semburan api (flyT dihitung mundur di Mob_Dragon.animate,
           durasi 3.9 dtk persis asli; api di-spawn selama jendela terbang) */
        if (m.type === 'dragon') {
          m.vel.x = 0;
          if (m.atkT <= 0) { m.atkT = 4.2; m.flyT = 3.9; }
        }
        break;
      case 'hop':
        /* simulasi lompat vertikal: gravitasi sederhana, onGround dibaca
           animasi asli (squash/stretch slime & pose kaki kelinci) */
        if (m.onGround) {
          m.vel.x = m.type === 'slime' ? 0 : T.speed;
          m.hopT = (m.hopT || 0) - dt;
          if (m.hopT <= 0) {
            m.hopT = (m.type === 'slime' ? 0.9 : 0.65) + Math.random() * 0.25;
            m.vel.y = m.type === 'slime' ? 5.5 : 7;
            m.onGround = false;
          }
        } else {
          m.vel.y -= 22 * dt;
          m.pos.y += m.vel.y * dt;
          if (m.pos.y <= 0) { m.pos.y = 0; m.vel.y = 0; m.onGround = true; }
        }
        m.mesh.position.y = m.pos.y;
        break;
    }
    Monsters.animate(m, dt);
    m.mesh.position.x = 0; m.mesh.position.z = 0;
  }

  /* dispatcher utama — dipanggil tiap frame dari animate() */
  function studioDrive(dt) {
    if (!studioSubject) return;
    if (studioSubject.kind === 'player') {
      if (studioPlayerAnim) studioPlayerAnim.update(dt);
    } else if (studioSubject.kind === 'npc') {
      driveNpc(studioSubject.n, studioSubject.anim, dt);
    } else if (studioSubject.kind === 'mob') {
      driveMob(studioSubject.m, studioSubject.anim, dt);
    }
  }

  /* ================= 2. NPCS ================= */
  function buildNPCControls(r1, r2) {
    r1.innerHTML = `
      <span class="sub-label">🤝 NPC Desa (In-Game):</span>
      <button class="chip active" onclick="loadNPCModel('guard', this)">🛡️ Penjaga</button>
      <button class="chip" onclick="loadNPCModel('hunter', this)">🏹 Pemburu</button>
      <button class="chip" onclick="loadNPCModel('miner', this)">⛏️ Penambang</button>
      <button class="chip" onclick="loadNPCModel('herbal', this)">⚗️ Tabib</button>
      <button class="chip" onclick="loadNPCModel('warrior', this)">⚔️ Petarung</button>
      <button class="chip" onclick="loadNPCModel('guardian', this)">🛡️ Guardian</button>
      <button class="chip" onclick="loadNPCModel('merchant', this)">🏪 Pedagang</button>
    `;
    r2.innerHTML = `
      <span class="sub-label">✨ NPC Langka (Rare Models):</span>
      <button class="chip" onclick="loadNPCModel('lionknight', this)">🦁 Manusia Singa</button>
      <button class="chip" onclick="loadNPCModel('elfmage', this)">🔮 Penyihir Elf</button>
      <button class="chip" onclick="loadNPCModel('stonegiant', this)">🗿 Raksasa Batu</button>
      <button class="chip" onclick="loadNPCModel('rabbitwarrior', this)">🐰 Kelinci Cakar</button>
      <button class="chip" onclick="loadNPCModel('goblin', this)">👺 Goblin Emas</button>
    `;
  }

  function loadNPCModel(roleId, btn) {
    if (btn) {
      document.querySelectorAll('#controls-panel .chip').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
    }
    clearActiveMesh();

    /* PERSIS in-game: NPCS.make() adalah pabrik NPC lengkap (model + state:
       vel, swing, atkCd, dsb.) yang dipakai game & save/restoreTeam. Studio
       memakainya langsung agar NPCS.animate() bisa dijalankan apa adanya —
       termasuk pose skill langka (Auman Singa, Backstab Leap, dll). */
    const role = NPC_ROLES.find(r => r.id === roleId) || NPC_ROLES[0];
    const n = NPCS.make(role, 0, 0, 0, { x: 0, z: 0 }, 5);
    activeMesh = n.mesh;
    studioSubject = { kind: 'npc', n: n, role: role, anim: 'idle' };

    if (controls) controls.target.set(0, 1.0, 0);
    const bTitle = document.getElementById('badge-title');
    if (bTitle) bTitle.innerHTML = `<b>NPC In-Game:</b> ${role.e || ''} ${role.name}`;
    const bDesc = document.getElementById('badge-desc');
    if (bDesc) {
      bDesc.dataset.base = `Source: js/npc.js → NPCS.make() + NPCS.animate() · Skill: ${role.skill ? role.skill.desc : '-'}`;
      bDesc.innerText = bDesc.dataset.base;
    }
    /* chip animasi sesuai arketipe (baris 3) */
    buildAnimChips(document.getElementById('sub-row-3'), animsForNpc(roleId));
    updateBadgeAnim();
  }

  /* ================= 3. MOBS ================= */
  function buildMobControls(r1) {
    r1.innerHTML = `
      <span class="sub-label">👾 Monster Gameplay (In-Game):</span>
      <button class="chip active" onclick="loadMobModel('slime', this)">🟢 Slime</button>
      <button class="chip" onclick="loadMobModel('boar', this)">🐗 Babi Hutan</button>
      <button class="chip" onclick="loadMobModel('wolf', this)">🐺 Serigala</button>
      <button class="chip" onclick="loadMobModel('scorpion', this)">🦂 Kalajengking</button>
      <button class="chip" onclick="loadMobModel('rabbit', this)">🐇 Kelinci</button>
      <button class="chip" onclick="loadMobModel('golem', this)">🗿 Golem</button>
      <button class="chip" onclick="loadMobModel('dragon', this)">🐉 Naga (Boss)</button>
      <span class="sub-label" style="margin-left:12px;">☠️ Boss:</span>
      <button id="boss-chip" class="chip ${isBossMode ? 'active' : ''}" onclick="toggleBossMode(this)">👑 Boss Mode</button>
    `;
  }

  let currentMobType = 'slime';
  function loadMobModel(type, btn) {
    currentMobType = type;
    if (btn) {
      document.querySelectorAll('#sub-row-1 .chip').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      const bossChip = document.getElementById('boss-chip');
      if (bossChip && isBossMode) bossChip.classList.add('active');
    }
    clearActiveMesh();

    // Call EXACT IN-GAME Monster Builder (model + state lengkap: vel,
    // onGround, biteT/stingT/windup) — Monsters.animate() jalan apa adanya.
    // Naga selalu boss (sudah besar dari sananya, tanpa skala boss tambahan).
    const boss = (type === 'dragon') ? true : isBossMode;
    const m = Monsters.make(type, new THREE.Vector3(0, 0, 0), boss);
    activeMesh = m.mesh;
    studioSubject = { kind: 'mob', m: m, anim: 'idle' };

    if (controls) controls.target.set(0, (boss || type === 'dragon') ? 1.4 : 0.6, 0);
    const bTitle = document.getElementById('badge-title');
    if (bTitle) bTitle.innerHTML = `<b>Monster In-Game:</b> ${boss ? '☠️ ' : ''}${type.toUpperCase()} ${boss ? '(Boss)' : ''}`;
    const bDesc = document.getElementById('badge-desc');
    if (bDesc) {
      bDesc.dataset.base = 'Source: js/monsters.js · 100% Persis dengan monster di peta permainan';
      bDesc.innerText = bDesc.dataset.base;
    }
    /* chip animasi sesuai tipe mob (baris 2) */
    buildAnimChips(document.getElementById('sub-row-2'), MOB_ANIMS[type] || []);
    updateBadgeAnim();
  }

  function toggleBossMode(btn) {
    isBossMode = !isBossMode;
    if (btn) btn.classList.toggle('active', isBossMode);
    loadMobModel(currentMobType);
  }

  /* ================= 4. ENVIRONMENT =================
     Hanya model yang BENAR-BENAR muncul di game:
     - Furnitur (js/furni.js): meja/kursi/kasur/peti/perahu — muncul di dalam
       rumah desa & bisa dipasang pemain dari item crafting.
     - Peti: Furni.buildChest() in-game mendelegasikan ke PortChest.build()
       (js/ports.js), jadi satu model peti dipakai di desa & dungeon.
     - Ikan (js/ports.js → FishSys): siluet transparan = yang berenang di air;
       model detail = yang muncul saat momen memancing/menangkap.
     Pohon, rumah desa, menara, dan api unggun in-game dibangun dari BLOK VOXEL
     oleh js/worldgen.js (bukan mesh), sehingga tidak punya model 3D terpisah. */
  function buildEnvControls(r1, r2) {
    r1.innerHTML = `
      <span class="sub-label">🪑 Furnitur In-Game (js/furni.js):</span>
      <button class="chip active" onclick="loadEnvModel('table', this)">🍽️ Meja Kerja</button>
      <button class="chip" onclick="loadEnvModel('chair', this)">💺 Kursi</button>
      <button class="chip" onclick="loadEnvModel('bed', this)">🛏️ Tempat Tidur</button>
      <button class="chip" onclick="loadEnvModel('chest', this)">🧰 Peti Penyimpanan</button>
      <button class="chip" onclick="loadEnvModel('boat', this)">🛶 Perahu</button>
    `;
    r2.innerHTML = `
      <span class="sub-label">🐟 Ikan In-Game (js/ports.js → FishSys):</span>
      <button class="chip" onclick="loadEnvModel('fish:silhouette', this)">Siluet Air</button>
      <button class="chip" onclick="loadEnvModel('fish:teri', this)">Teri</button>
      <button class="chip" onclick="loadEnvModel('fish:mas', this)">Mas</button>
      <button class="chip" onclick="loadEnvModel('fish:lele', this)">Lele</button>
      <button class="chip" onclick="loadEnvModel('fish:badut', this)">Badut</button>
      <button class="chip" onclick="loadEnvModel('fish:puffer', this)">Puffer</button>
      <button class="chip" onclick="loadEnvModel('fish:todak', this)">Todak</button>
      <button class="chip" onclick="loadEnvModel('fish:lentera', this)">Lentera</button>
      <button class="chip" onclick="loadEnvModel('fish:leviathan', this)">☠️ Leviathan</button>
    `;
  }

  function loadEnvModel(key, btn) {
    if (btn) {
      document.querySelectorAll('#controls-panel .chip').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
    }
    clearActiveMesh();
    studioSubject = null;   // environment statis — tanpa driver animasi

    let info = '';
    if (key === 'table')      { activeMesh = Furni.buildTable(); info = 'Meja kayu desa (dekorasi) & item f_table — crafting kini di Meja Kerja'; }
    else if (key === 'chair') { activeMesh = Furni.buildChair(); info = 'Kursi desa & item f_chair'; }
    else if (key === 'bed')   { activeMesh = Furni.buildBed();   info = 'Kasur desa & item f_bed'; }
    else if (key === 'chest') { activeMesh = Furni.buildChest(); info = 'In-game: Furni.buildChest() = PortChest.build()'; }
    else if (key === 'boat')  { activeMesh = Furni.buildBoat();  info = 'Perahu item f_boat'; }
    else if (key.startsWith('fish:')) {
      const id = key.slice(5);
      if (id === 'silhouette') {
        activeMesh = FishSys.buildFishSilhouette().root;
        info = 'Siluet ikan yang berenang di air';
      } else {
        const def = FishSys.DEFS.find(d => d.id === id) || FishSys.DEFS[0];
        activeMesh = FishSys.buildFish(def).root;
        info = `${def.name} — model detail saat ditangkap (${def.rarity})`;
      }
    }

    if (activeMesh) scene.add(activeMesh);

    const targetY = key.startsWith('fish:') ? 0.4 : 0.6;
    if (controls) controls.target.set(0, targetY, 0);

    const bTitle = document.getElementById('badge-title');
    if (bTitle) bTitle.innerHTML = `<b>Environment In-Game:</b> ${activeMesh ? (activeMesh.name || key) : key}`;
    const bDesc = document.getElementById('badge-desc');
    if (bDesc) bDesc.innerText = `Source: js/furni.js / js/ports.js · ${info}`;
  }

  function onWindowResize() {
    if (!camera || !renderer) return;
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }

  function animate() {
    requestAnimationFrame(animate);
    if (!clock || !renderer || !scene || !camera) return;
    const dt = Math.min(clock.getDelta(), 0.05);

    if (controls) controls.update();

    /* Driver animasi studio: menyiapkan state lalu memanggil dispatcher
       animasi ASLI game (PlayerAnimator / NPCS.animate / Monsters.animate)
       sesuai model & animasi yang sedang dipilih. */
    studioDrive(dt);

    renderer.render(scene, camera);
  }

  window.addEventListener('DOMContentLoaded', init);
</script>
