<!DOCTYPE html>
<html lang="id">

<style>

  canvas{display:block}

  #panel{position:fixed;top:18px;left:18px;max-width:340px;padding:16px 20px 15px;z-index:10;

  #ctrls{position:fixed;top:18px;right:18px;display:flex;gap:8px;z-index:10}
  .btn{padding:8px 14px;border-radius:999px;border:1px solid rgba(232,180,90,.3);cursor:pointer;
    background:rgba(16,13,10,.8);color:#efe6d2;font:700 12.5px 'Alegreya Sans';transition:.2s}
  .btn:hover{border-color:#e8b45a;transform:translateY(-2px)}

  .chip:hover{transform:translateY(-3px);border-color:#e8b45a;box-shadow:0 6px 18px rgba(232,150,50,.25)}
  .chip.on{background:linear-gradient(180deg,#e9b95e,#c98f34);color:#241505;border-color:#ffd98f}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ================= DASAR ================= */
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a1020, 0.024);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 200);
camera.position.set(17, 10, 18);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.maxPolarAngle = Math.PI*0.495; controls.minDistance = 1.6; controls.maxDistance = 28;
controls.target.set(0, 0.8, 0);
controls.autoRotate = true; controls.autoRotateSpeed = 0.45;

/* ================= TEKSTUR KANVAS ================= */
function makeCanvas(s, draw){ const c=document.createElement('canvas'); c.width=c.height=s;
  draw(c.getContext('2d'), s); const t=new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace; t.wrapS=t.wrapT=THREE.RepeatWrapping; t.anisotropy=8; return t; }
function shade(hex,k){ const n=parseInt(hex.slice(1),16);
  const r=Math.min(255,((n>>16)&255)*k)|0, g=Math.min(255,((n>>8)&255)*k)|0, b=Math.min(255,(n&255)*k)|0;
  return `rgb(${r},${g},${b})`; }

function plankTex(base, n, vertical){
  return makeCanvas(256,(ctx,s)=>{
    ctx.fillStyle=base; ctx.fillRect(0,0,s,s);
    const bw = vertical? s/n : s, bh = vertical? s : s/n;
    for(let i=0;i<n;i++){
      ctx.fillStyle=shade(base, 0.86+Math.random()*0.3);
      if(vertical) ctx.fillRect(i*bw,0,bw,s); else ctx.fillRect(0,i*bh,s,bh);
      for(let g=0; g<22; g++){
        ctx.strokeStyle=`rgba(38,21,7,${0.05+Math.random()*0.13})`;
        ctx.lineWidth=0.5+Math.random()*1.6; ctx.beginPath();
        if(vertical){ const x=i*bw+2+Math.random()*(bw-4); ctx.moveTo(x,0);
          for(let y=0;y<=s;y+=28) ctx.lineTo(x+Math.sin(y*0.05+g)*2.2,y); }
        else { const y=i*bh+2+Math.random()*(bh-4); ctx.moveTo(0,y);
          for(let x=0;x<=s;x+=28) ctx.lineTo(x,y+Math.sin(x*0.05+g)*2.2); }
        ctx.stroke();
      }
      if(Math.random()<0.7){ const kx=(i+0.5)*bw+(Math.random()-.5)*bw*.4, ky=Math.random()*s;
        const gr=ctx.createRadialGradient(kx,ky,1,kx,ky,7);
        gr.addColorStop(0,'rgba(30,15,5,.95)'); gr.addColorStop(1,'rgba(30,15,5,0)');
        ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(kx,ky,7,0,7); ctx.fill(); }
      ctx.fillStyle='rgba(18,9,3,.85)';
      if(vertical) ctx.fillRect(i*bw,0,2,s); else ctx.fillRect(0,i*bh,s,2);
    }
  });
}
const texStave  = plankTex('#93622e', 10, true);
const texPlain  = plankTex('#8a5a2c', 3, false);
const texTable  = plankTex('#7d4f27', 4, false);
const texTableT = plankTex('#8f5e2e', 6, false); texTableT.repeat.set(2,1);
const texBoat   = plankTex('#7b5327', 4, false); texBoat.repeat.set(3,1);
const texChest  = plankTex('#71431e', 3, false);
const texBark = makeCanvas(256,(ctx,s)=>{ ctx.fillStyle='#4a3320'; ctx.fillRect(0,0,s,s);
  for(let i=0;i<130;i++){ ctx.fillStyle=`rgba(${20+Math.random()*45|0},${14+Math.random()*25|0},8,${.25+Math.random()*.4})`;
    ctx.fillRect(Math.random()*s, Math.random()*s, 2+Math.random()*4, 18+Math.random()*70); }
  ctx.fillStyle='rgba(15,8,3,.5)'; for(let i=0;i<s;i+=14) ctx.fillRect(i,0,2,s); });
const texRings = makeCanvas(256,(ctx,s)=>{ ctx.fillStyle='#96693a'; ctx.fillRect(0,0,s,s);
  for(let i=1;i<10;i++){ ctx.strokeStyle=`rgba(88,56,24,${.4+Math.random()*.4})`;
    ctx.lineWidth=1.5+Math.random()*2.5; ctx.beginPath();
    ctx.arc(s/2+(Math.random()-.5)*8, s/2+(Math.random()-.5)*8, i*12.5+Math.random()*3, 0, 7); ctx.stroke(); }
  for(let i=0;i<4;i++){ const a=Math.random()*7; ctx.strokeStyle='rgba(50,30,12,.6)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(s/2,s/2); ctx.lineTo(s/2+Math.cos(a)*120, s/2+Math.sin(a)*120); ctx.stroke(); }
  ctx.strokeStyle='rgba(40,24,10,.9)'; ctx.lineWidth=10; ctx.strokeRect(2,2,s-4,s-4); });
const texGround = makeCanvas(512,(ctx,s)=>{ ctx.fillStyle='#2c3a20'; ctx.fillRect(0,0,s,s);
  const cols=['#243118','#354626','#3d4a28','#2a2f1c','#4a4426','#223018'];
  for(let i=0;i<8000;i++){ ctx.fillStyle=cols[Math.random()*cols.length|0];
    ctx.globalAlpha=.25+Math.random()*.5;
    ctx.fillRect(Math.random()*s, Math.random()*s, 1+Math.random()*2.5, 1+Math.random()*2.5); }
  ctx.globalAlpha=1;
  for(let i=0;i<40;i++){ const g=ctx.createRadialGradient(0,0,0,0,0,0); }
  for(let i=0;i<22;i++){ const x=Math.random()*s,y=Math.random()*s,r=14+Math.random()*40;
    const g=ctx.createRadialGradient(x,y,2,x,y,r);
    g.addColorStop(0,'rgba(74,60,38,.4)'); g.addColorStop(1,'rgba(74,60,38,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill(); } });
texGround.repeat.set(7,7);
const texWater = makeCanvas(256,(ctx,s)=>{ ctx.fillStyle='#173f49'; ctx.fillRect(0,0,s,s);
  for(let i=0;i<42;i++){ ctx.strokeStyle=`rgba(150,215,225,${.05+Math.random()*.09})`;
    ctx.lineWidth=1+Math.random()*2; const y=Math.random()*s; ctx.beginPath(); ctx.moveTo(0,y);
    for(let x=0;x<=s;x+=20) ctx.lineTo(x, y+Math.sin(x*.09+i)*4); ctx.stroke(); } });
const texFlame = makeCanvas(256,(ctx,s)=>{ ctx.clearRect(0,0,s,s);
  ctx.beginPath(); ctx.moveTo(s/2,6);
  ctx.bezierCurveTo(s*.75,s*.28, s*.9,s*.5, s*.8,s*.68);
  ctx.bezierCurveTo(s*.72,s*.88, s*.28,s*.88, s*.2,s*.68);
  ctx.bezierCurveTo(s*.1,s*.5, s*.25,s*.28, s/2,6);
  const g=ctx.createRadialGradient(s/2,s*.62,6, s/2,s*.62,s*.44);
  g.addColorStop(0,'#fff8d8'); g.addColorStop(.28,'#ffd23f'); g.addColorStop(.6,'#ff7a1a');
  g.addColorStop(.85,'rgba(255,60,0,.35)'); g.addColorStop(1,'rgba(255,60,0,0)');
  ctx.fillStyle=g; ctx.fill(); });
const radialTex = (inner, mid) => makeCanvas(128,(ctx,s)=>{ ctx.clearRect(0,0,s,s);
  const g=ctx.createRadialGradient(s/2,s/2,1,s/2,s/2,s/2);
  g.addColorStop(0,inner); g.addColorStop(.5,mid); g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,s,s); });
const texSmoke = radialTex('rgba(255,255,255,.85)','rgba(255,255,255,.3)');
const texSpark = radialTex('#fff6d8','rgba(255,170,60,.9)');
const texGlow  = radialTex('rgba(255,255,255,.95)','rgba(255,255,255,.35)');

/* ================= MATERIAL ================= */
function std(o){ const m=new THREE.MeshStandardMaterial(o);
  m.envMapIntensity = o.envMapIntensity ?? 0.35; return m; }
const M = {
  stave:  std({map:texStave, roughness:.8, bumpMap:texStave, bumpScale:.4}),
  woodPlain: std({map:texPlain, roughness:.85}),
  tableWood: std({map:texTable, roughness:.8}),
  tableTop:  std({map:texTableT, roughness:.72}),
  boatWood:  std({map:texBoat, roughness:.8, side:THREE.DoubleSide}),
  darkWood:  std({color:0x4c3016, roughness:.9}),
  chestWood: std({map:texChest, roughness:.75, bumpMap:texChest, bumpScale:.3}),
  bark:   std({map:texBark, roughness:1}),
  shaft:  std({color:0x9b7945, roughness:.7}),
  steel:  std({color:0x8a9099, metalness:.85, roughness:.35, envMapIntensity:.9}),
  iron:   std({color:0x3d4046, metalness:.8, roughness:.45, envMapIntensity:.8}),
  gold:   std({color:0xe0a422, metalness:.9, roughness:.28, envMapIntensity:1.1}),
  stone:  std({color:0x6c7280, roughness:.95, flatShading:true}),
  stoneDark: std({color:0x565b66, roughness:.95, flatShading:true}),
  chitin: std({color:0x5c241c, roughness:.45, metalness:.15}),
  chitinD:std({color:0x3c1610, roughness:.5, metalness:.15}),
  sting:  std({color:0x241009, roughness:.35}),
  golemEye: std({color:0x110a05, emissive:0xff7a1f, emissiveIntensity:2.4}),
  crack:  std({color:0x0a0a0a, emissive:0xff5a1f, emissiveIntensity:1.6}),
  moss:   std({color:0x3f5a2a, roughness:1}),
  void_:  std({color:0x07080d, roughness:.9, side:THREE.DoubleSide}),
  wraithEye: std({color:0x0a0a12, emissive:0xbfe6ff, emissiveIntensity:3}),
  batFur: std({color:0x1d1420, roughness:.95}),
  batMem: std({color:0x2c1b33, roughness:.9, side:THREE.DoubleSide}),
  bone:   std({color:0xe8e2d2, roughness:.5}),
  eyeRed: std({color:0x1a0505, emissive:0xff2a1f, emissiveIntensity:2.6}),
  eyeAmber:std({color:0x120a03, emissive:0xffb13f, emissiveIntensity:2.2}),
  rabbitFur: std({color:0xa08a70, roughness:1}),
  rabbitBelly: std({color:0xe7ddca, roughness:1}),
  earPink: std({color:0xd98f8a, roughness:.9}),
  nosePink: std({color:0xc47070, roughness:.7}),
  eyeBlack: std({color:0x0d0a08, roughness:.2}),
  bread:  std({color:0xb98a4a, roughness:.9}),
  feather: std({color:0xc04a2a, roughness:.7, side:THREE.DoubleSide}),
  thread: std({color:0x7a2a1a, roughness:.85}),
};

/* ================= ALAT BANTU ================= */
const updaters = [];
const UC = {};
function ucyl(r1,r2){ const k=r1+'|'+r2; return UC[k] || (UC[k]=new THREE.CylinderGeometry(r1,r2,1,8)); }
function orientMesh(m,a,b){ const d=new THREE.Vector3().subVectors(b,a);
  m.scale.y=d.length(); m.position.copy(a).add(b).multiplyScalar(.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), d.normalize()); }
function rockGeo(r,detail,jit){ const g=new THREE.IcosahedronGeometry(r,detail);
  const p=g.attributes.position, v=new THREE.Vector3();
  for(let i=0;i<p.count;i++){ v.fromBufferAttribute(p,i);
    const h=Math.sin(v.x*12.7+v.y*7.3)*Math.cos(v.z*9.1+v.x*3.7);
    const h2=Math.sin(v.y*21.3+v.z*15.2);
    v.multiplyScalar(1+(h*0.6+h2*0.4)*jit); p.setXYZ(i,v.x,v.y,v.z); }
  g.computeVertexNormals(); return g; }
function shadows(root){ root.traverse(o=>{ if(o.isMesh){ o.castShadow=true; o.receiveShadow=true; }}); }
function faceCenter(o){ const v=new THREE.Vector3(); o.getWorldPosition(v);
  o.rotation.y=Math.atan2(-v.x,-v.z); }

/* ================= 1. TONG KAYU ================= */
function createBarrel(scale=1){
  const g=new THREE.Group(); const H=0.95, rB=0.33, rM=0.46;
  const rAt=t=> rM-(rM-rB)*Math.pow(2*t-1,2);
  const prof=[]; for(let i=0;i<=16;i++){ const t=i/16; prof.push(new THREE.Vector2(rAt(t), t*H)); }
  prof.push(new THREE.Vector2(rAt(1)-0.03, H));
  g.add(new THREE.Mesh(new THREE.LatheGeometry(prof,36), M.stave));
  const lidG=new THREE.CircleGeometry(rAt(1)-0.035,32);
  const lid=new THREE.Mesh(lidG, M.woodPlain); lid.rotation.x=-Math.PI/2; lid.position.y=H-0.035; g.add(lid);
  const bot=new THREE.Mesh(lidG.clone(), M.woodPlain); bot.rotation.x=-Math.PI/2; bot.position.y=0.035; g.add(bot);
  [0.06,0.24,0.76,0.94].forEach((t,k)=>{
    const r=rAt(t)+0.008;
    const hoop=new THREE.Mesh(new THREE.TorusGeometry(r,0.013,8,48), M.iron);
    hoop.rotation.x=Math.PI/2; hoop.position.y=t*H; g.add(hoop);
    for(let i=0;i<3;i++){ const rv=new THREE.Mesh(new THREE.SphereGeometry(0.016,8,6), M.iron);
      const a=i*2.09+k; rv.position.set(Math.cos(a)*r, t*H, Math.sin(a)*r); g.add(rv); } });
  g.scale.setScalar(scale); return g;
}
function createBarrels(){
  const g=new THREE.Group();
  const b1=createBarrel(); b1.position.set(0,0,0); g.add(b1);
  const b2=createBarrel(0.88); b2.position.set(0.78,0,0.32); b2.rotation.y=0.7; g.add(b2);
  const b3=createBarrel(0.92); b3.rotation.z=Math.PI/2; b3.rotation.y=0.5;
  b3.position.set(0.05,0.425,1.05); g.add(b3);
  return g;
}

/* ================= 2. MEJA & KURSI ================= */
function createChair(){
  const c=new THREE.Group();
  [[-0.19,-0.19],[0.19,-0.19],[-0.19,0.19],[0.19,0.19]].forEach(([x,z])=>{
    const l=new THREE.Mesh(new THREE.BoxGeometry(0.055,0.46,0.055), M.tableWood);
    l.position.set(x,0.23,z); c.add(l); });
  const seat=new THREE.Mesh(new THREE.BoxGeometry(0.46,0.05,0.46), M.tableWood);
  seat.position.y=0.475; c.add(seat);
  [-0.19,0.19].forEach(x=>{ const p=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.52,0.05), M.tableWood);
    p.position.set(x,0.73,-0.19); c.add(p); });
  [0.62,0.78,0.94].forEach(y=>{ const s=new THREE.Mesh(new THREE.BoxGeometry(0.38,0.07,0.03), M.tableWood);
    s.position.set(0,y,-0.19); c.add(s); });
  return c;
}
function createTableSet(){
  const g=new THREE.Group();
  const top=new THREE.Mesh(new THREE.BoxGeometry(1.7,0.07,0.95), M.tableTop); top.position.y=0.745; g.add(top);
  [[-0.76,-0.38],[0.76,-0.38],[-0.76,0.38],[0.76,0.38]].forEach(([x,z])=>{
    const l=new THREE.Mesh(new THREE.BoxGeometry(0.09,0.71,0.09), M.tableWood);
    l.position.set(x,0.355,z); g.add(l); });
  const a1=new THREE.Mesh(new THREE.BoxGeometry(1.5,0.1,0.05), M.tableWood); a1.position.set(0,0.66,0.38); g.add(a1);
  const a2=a1.clone(); a2.position.z=-0.38; g.add(a2);
  const a3=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.1,0.74), M.tableWood); a3.position.set(0.76,0.66,0); g.add(a3);
  const a4=a3.clone(); a4.position.x=-0.76; g.add(a4);
  const ch1=createChair(); ch1.position.set(0.35,0,0.82); ch1.rotation.y=Math.PI; g.add(ch1);
  const ch2=createChair(); ch2.position.set(-0.35,0,-0.82); g.add(ch2);
  const mug=new THREE.Group();
  mug.add(new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.045,0.1,12), M.iron));
  const hd=new THREE.Mesh(new THREE.TorusGeometry(0.035,0.009,6,16,Math.PI), M.iron);
  hd.position.set(0.058,0,0); hd.rotation.z=-Math.PI/2; mug.add(hd);
  mug.position.set(0.42,0.83,0.12); g.add(mug);
  const plate=new THREE.Mesh(new THREE.CylinderGeometry(0.11,0.09,0.016,16), M.woodPlain);
  plate.position.set(-0.32,0.788,-0.08); g.add(plate);
  const bread=new THREE.Mesh(new THREE.SphereGeometry(0.07,10,8), M.bread);
  bread.scale.set(1.3,0.62,0.9); bread.position.set(-0.32,0.815,-0.08); g.add(bread);
  return g;
}

/* ================= 3. PANAH ================= */
function buildArrow(){
  const a=new THREE.Group();
  const shaft=new THREE.Mesh(new THREE.CylinderGeometry(0.010,0.012,0.78,8), M.shaft);
  shaft.rotation.z=-Math.PI/2; shaft.position.x=-0.03; a.add(shaft);

function flow_fireG(fireG){

    transparent:true, opacity:0.55, blending:THREE.AdditiveBlending, depthWrite:false}));

    sp.userData={sp:0.14+Math.random()*0.1, ph:Math.random(), sc:0.5+Math.random()*0.5};
    fireG.add(sp); smoke.push(sp); }
  const N=26, pos=new Float32Array(N*3), vel=[];
  for(let i=0;i<N;i++){ pos[i*3]=(Math.random()-.5)*0.3; pos[i*3+1]=Math.random()*1.2;
    pos[i*3+2]=(Math.random()-.5)*0.3; vel.push(0.5+Math.random()*0.8); }
  const sg=new THREE.BufferGeometry(); sg.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const sparks=new THREE.Points(sg, new THREE.PointsMaterial({map:texSpark, color:0xffb347, size:0.05,
    transparent:true, blending:THREE.AdditiveBlending, depthWrite:false}));
  fireG.add(sparks);
  updaters.push((t,dt)=>{
    flames.forEach((f,i)=>{ const fl=0.85+0.25*Math.sin(t*13+i*2.1)+0.1*Math.sin(t*29+i);
      f.scale.set(f.scale.x, (1.15-i*0.25)*1.35*fl*Math.max(0.6,f.scale.x/Math.max(.01,f.scale.x)), 1);
      const base=[1.15,0.78,0.46][i]; f.scale.set(base*fl, base*1.4*fl, 1);
      f.position.x=Math.sin(t*9+i*2)*0.03; f.material.rotation=Math.sin(t*3+i)*0.08; });
    glow.material.opacity=0.42+0.15*Math.sin(t*10);
    smoke.forEach(s=>{ const u=s.userData, y=((t*u.sp+u.ph)%1);
      s.position.set(Math.sin(t*0.8+u.ph*9)*0.22*(0.3+y), 0.4+y*2.6, Math.cos(t*0.7+u.ph*7)*0.15*y);
      s.scale.setScalar(u.sc*(0.45+y*2.1));
      s.material.opacity=(y<0.12? y/0.12:1)*(1-y)*0.3; });
    const p=sg.attributes.position;
    for(let i=0;i<N;i++){ let y=p.getY(i)+vel[i]*dt; let x=p.getX(i)+Math.sin(t*3+i)*dt*0.12;
      if(y>1.9){ y=0.1; x=(Math.random()-.5)*0.3; p.setZ(i,(Math.random()-.5)*0.3); }
      p.setXYZ(i,x,y,p.getZ(i)); }

  });
  return fireG;
}

function createBoat(){
  const g=new THREE.Group(); const L=2.7, W=0.72, D=0.4;
  const hw=u=>W*Math.pow(Math.sin(Math.PI*u),0.6)+0.001;
  const dep=u=>D*Math.pow(Math.sin(Math.PI*u),0.5)+0.02;
  const shr=u=>0.18*(1-Math.sin(Math.PI*u))+0.02;
  const nu=30, nv=14, pos=[], uv=[], idx=[];
  for(let i=0;i<=nu;i++){ const u=i/nu;
    for(let j=0;j<=nv;j++){ const th=(j/nv-0.5)*Math.PI;
      pos.push((u-0.5)*L, -dep(u)*Math.cos(th)+shr(u)*(1-Math.cos(th)), hw(u)*Math.sin(th));
      uv.push(i/nu*3, j/nv); } }
  for(let i=0;i<nu;i++) for(let j=0;j<nv;j++){ const a=i*(nv+1)+j, b=a+nv+1;
    idx.push(a,b,a+1, b,b+1,a+1); }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv,2));
  geo.setIndex(idx); geo.computeVertexNormals();
  g.add(new THREE.Mesh(geo, M.boatWood));
  for(const s of [1,-1]){ const pts=[];
    for(let i=0;i<=20;i++){ const u=i/20; pts.push(new THREE.Vector3((u-0.5)*L, shr(u)+0.012, s*hw(u))); }
    g.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),36,0.024,6), M.darkWood)); }
  const kp=[]; for(let i=0;i<=20;i++){ const u=i/20; kp.push(new THREE.Vector3((u-0.5)*L,-dep(u)+0.004,0)); }
  g.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(kp),24,0.02,6), M.darkWood));
  [0.34,0.62].forEach(u=>{ const seat=new THREE.Mesh(new THREE.BoxGeometry(0.22,0.03,hw(u)*1.62), M.tableWood);
    seat.position.set((u-0.5)*L, shr(u)-0.13, 0); g.add(seat); });
  const oar=new THREE.Group();
  oar.add(new THREE.Mesh(new THREE.CylinderGeometry(0.017,0.014,1.7,8), M.shaft));
  const bl=new THREE.Mesh(new THREE.BoxGeometry(0.16,0.02,0.34), M.tableWood); bl.position.y=-0.78; oar.add(bl);
  const gr=new THREE.Mesh(new THREE.SphereGeometry(0.03,8,6), M.darkWood); gr.position.y=0.86; oar.add(gr);
  oar.rotation.set(0,0.25,1.38); oar.position.set(0.12,0.12,0.05); g.add(oar);
  return g;
}

  [-0.05,0.05].forEach(x=>{ const e=new THREE.Mesh(new THREE.SphereGeometry(0.018,8,8), M.eyeRed);
    e.position.set(x,0.12,0.27); g.add(e); });
  [-1,1].forEach(s=>{ const ear=new THREE.Mesh(new THREE.ConeGeometry(0.04,0.13,8), M.batFur);
    ear.position.set(s*0.05,0.22,0.13); ear.rotation.set(-0.15,0,-s*0.25); g.add(ear); });
  [-0.02,0.02].forEach(x=>{ const f=new THREE.Mesh(new THREE.ConeGeometry(0.008,0.03,6), M.bone);
    f.rotation.x=Math.PI; f.position.set(x,0.015,0.32); g.add(f); });
  const shape=new THREE.Shape();
  shape.moveTo(0,0.02);
  shape.quadraticCurveTo(0.30,-0.10,0.62,-0.08);
  shape.quadraticCurveTo(0.86,-0.06,0.98,0.05);
  shape.quadraticCurveTo(0.80,0.14,0.68,0.36);
  shape.quadraticCurveTo(0.50,0.22,0.42,0.43);
  shape.quadraticCurveTo(0.25,0.26,0.15,0.31);
  shape.quadraticCurveTo(0.02,0.18,0,0.02);
  const memGeo=new THREE.ShapeGeometry(shape,10); memGeo.rotateX(-Math.PI/2);
  const tips=[[0.98,0.05],[0.68,0.36],[0.42,0.43],[0.15,0.31]];
  [-1,1].forEach(side=>{
    const wg=new THREE.Group(); wg.position.set(side*0.1,0.04,0); g.add(wg);
    const mem=new THREE.Mesh(memGeo, M.batMem); if(side<0) mem.scale.x=-1; wg.add(mem);
    tips.forEach(([tx,ty])=>{ const b=new THREE.Mesh(ucyl(0.011,0.007), M.batFur);
      orientMesh(b, new THREE.Vector3(0,0,0), new THREE.Vector3(side*tx,0.006,-ty)); wg.add(b); });
    P[side>0?'wR':'wL']=wg; });
  const tm=new THREE.Mesh(new THREE.CircleGeometry(0.09,10,0,Math.PI), M.batMem);
  tm.rotation.x=-Math.PI/2; tm.position.set(0,-0.02,-0.19); g.add(tm);
  return {g, P};
}

/* ================= 11. KELINCI ================= */
function createRabbit(){
  const g=new THREE.Group(); const P={};
  const body=new THREE.Mesh(new THREE.SphereGeometry(0.16,18,14), M.rabbitFur);
  body.scale.set(0.95,0.9,1.3); body.position.set(0,0.185,-0.02); g.add(body);
  const chest=new THREE.Mesh(new THREE.SphereGeometry(0.11,14,10), M.rabbitBelly);
  chest.position.set(0,0.155,0.1); g.add(chest);
  const head=new THREE.Mesh(new THREE.SphereGeometry(0.105,16,12), M.rabbitFur);
  head.position.set(0,0.31,0.16); g.add(head);
  const muz=new THREE.Mesh(new THREE.SphereGeometry(0.055,10,8), M.rabbitBelly);
  muz.position.set(0,0.285,0.25); g.add(muz);
  const nose=new THREE.Mesh(new THREE.SphereGeometry(0.014,8,6), M.nosePink);
  nose.position.set(0,0.298,0.30); g.add(nose);
  [-1,1].forEach(s=>{ const e=new THREE.Mesh(new THREE.SphereGeometry(0.019,8,8), M.eyeBlack);
    e.position.set(s*0.062,0.335,0.22); g.add(e); });
  [-1,1].forEach(s=>{ const eg=new THREE.Group(); eg.position.set(s*0.045,0.40,0.09); g.add(eg); P['ear'+s]=eg;
    const ear=new THREE.Mesh(new THREE.CapsuleGeometry(0.03,0.13,4,8), M.rabbitFur);
    ear.position.y=0.09; ear.rotation.z=-s*0.18; eg.add(ear);
    const inn=new THREE.Mesh(new THREE.CapsuleGeometry(0.015,0.1,4,6), M.earPink);
    inn.position.set(0,0.09,0.018); inn.rotation.z=-s*0.18; eg.add(inn); });
  const tail=new THREE.Mesh(new THREE.SphereGeometry(0.05,10,8), M.rabbitBelly);
  tail.position.set(0,0.2,-0.21); g.add(tail);
  [-1,1].forEach(s=>{
    const hf=new THREE.Mesh(new THREE.SphereGeometry(0.035,8,6), M.rabbitFur);
    hf.scale.set(0.8,0.7,1.4); hf.position.set(s*0.06,0.035,0.14); g.add(hf);
    const bf=new THREE.Mesh(new THREE.SphereGeometry(0.05,10,8), M.rabbitFur);
    bf.scale.set(0.7,0.45,1.9); bf.position.set(s*0.09,0.035,-0.12); g.add(bf);
    const p=new THREE.Mesh(new THREE.CapsuleGeometry(0.018,0.05,3,6), M.rabbitFur);
    p.position.set(s*0.055,0.1,0.13); p.rotation.x=0.2; g.add(p); });
  updaters.push((t)=>{
    const a=t*0.55, R=1.15, cx=2.0, cz=-1.7;
    const hop=Math.abs(Math.sin(t*4.8));
    g.position.set(cx+Math.cos(a)*R, hop*0.16, cz+Math.sin(a)*R);
    g.rotation.y=-a;
    g.scale.set(1+0.09*(1-hop), 0.86+0.14*hop, 1+0.09*(1-hop));
    P.ear1.rotation.x=-0.12+Math.sin(t*4.8+0.6)*0.14;
    P['ear-1'].rotation.x=-0.12+Math.sin(t*4.8+0.75)*0.14; });
  return g;
}

/* ================= LINGKUNGAN ================= */
function buildEnvironment(){
  const ground=new THREE.Mesh(new THREE.CircleGeometry(17,64), std({map:texGround, roughness:1}));
  ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);
  const skyGeo=new THREE.SphereGeometry(90,24,14);
  const sky=new THREE.Mesh(skyGeo, new THREE.ShaderMaterial({side:THREE.BackSide, fog:false,
    uniforms:{}, vertexShader:`varying vec3 vP; void main(){vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
    fragmentShader:`varying vec3 vP; void main(){ float h=normalize(vP).y;
      vec3 c=mix(vec3(0.045,0.065,0.13), vec3(0.012,0.018,0.05), smoothstep(-0.05,0.6,h));
      c+=vec3(0.10,0.085,0.13)*pow(max(0.,1.-abs(h+0.02)*5.),2.);
      gl_FragColor=vec4(c,1.);}`}));
  scene.add(sky);
  const sPos=[]; for(let i=0;i<700;i++){ const v=new THREE.Vector3().randomDirection().multiplyScalar(68+Math.random()*8);
    if(v.y>3) sPos.push(v.x,v.y,v.z); }
  const sGeo=new THREE.BufferGeometry(); sGeo.setAttribute('position', new THREE.Float32BufferAttribute(sPos,3));
  scene.add(new THREE.Points(sGeo, new THREE.PointsMaterial({color:0xcfd8ff, size:1.1,
    sizeAttenuation:false, transparent:true, opacity:0.85, fog:false})));
  const moon=new THREE.Mesh(new THREE.SphereGeometry(2.2,20,16), new THREE.MeshBasicMaterial({color:0xe8efff, fog:false}));
  moon.position.set(-26,30,-34); scene.add(moon);
  const mg=new THREE.Sprite(new THREE.SpriteMaterial({map:texGlow, color:0x9db8ff,
    transparent:true, opacity:0.55, blending:THREE.AdditiveBlending, depthWrite:false, fog:false}));
  mg.scale.setScalar(12); mg.position.copy(moon.position); scene.add(mg);
  // kolam
  const PC=new THREE.Vector3(-7,0,-2.8);
  const bed=new THREE.Mesh(new THREE.CircleGeometry(3.55,40), std({color:0x0a1416, roughness:1}));
  bed.rotation.x=-Math.PI/2; bed.position.set(PC.x,0.01,PC.z); scene.add(bed);
  const water=new THREE.Mesh(new THREE.CircleGeometry(3.5,48),
    std({map:texWater, color:0x9fd8e8, roughness:0.12, metalness:0.35, transparent:true, opacity:0.9, envMapIntensity:1.2}));
  water.rotation.x=-Math.PI/2; water.position.set(PC.x,0.06,PC.z); water.receiveShadow=true; scene.add(water);
  updaters.push((t)=>{ water.material.map.offset.set(t*0.008, t*0.005); });
  for(let i=0;i<16;i++){ const a=i/16*Math.PI*2;
    const st=new THREE.Mesh(rockGeo(0.12+Math.random()*0.08,0,0.3), Math.random()<.5?M.stone:M.stoneDark);
    st.position.set(PC.x+Math.cos(a)*3.62,0.05,PC.z+Math.sin(a)*3.62);
    st.scale.y=0.55; st.rotation.y=Math.random()*3; scene.add(st); }
  // batang kayu untuk duduk
  [[1.5,1.15,-0.9],[-1.6,1.3,0.85],[-0.5,-1.75,1.4]].forEach(([x,z,ry])=>{
    const log=new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.16,1.2,10), M.bark);
    log.rotation.z=Math.PI/2; log.rotation.y=ry; log.position.set(x,0.15,z);
    log.castShadow=log.receiveShadow=true; scene.add(log); });
  // pohon mati
  function tree(x,z,s){ const t=new THREE.Group();
    const tr=new THREE.Mesh(new THREE.CylinderGeometry(0.07*s,0.14*s,2.3*s,7), M.darkWood);
    tr.position.y=1.15*s; t.add(tr);
    for(let i=0;i<3;i++){ const b=new THREE.Mesh(ucyl(0.02*s,0.04*s), M.darkWood);
      const h=1.2*s+i*0.4*s, dir=i%2?1:-1;
      orientMesh(b, new THREE.Vector3(0,h,0), new THREE.Vector3(dir*(0.5+Math.random()*0.3)*s, h+(0.4+Math.random()*0.3)*s, (Math.random()-.5)*0.3*s));
      t.add(b); }
    t.position.set(x,0,z); t.rotation.z=(Math.random()-.5)*0.12; shadows(t); scene.add(t); }
  [[-11.5,-8,1.1],[10.5,-9.5,0.9],[-9.5,8.5,1],[-3,-12,1.2],[12,5,0.85],[-13,1.5,1.05]].forEach(a=>tree(...a));
  // batu besar & rumput
  for(let i=0;i<7;i++){ const a=Math.random()*Math.PI*2, r=9+Math.random()*5;
    const x=Math.cos(a)*r, z=Math.sin(a)*r;
    if(Math.hypot(x-PC.x,z-PC.z)<4.5) continue;
    const rk=new THREE.Mesh(rockGeo(0.35+Math.random()*0.45,1,0.22), M.stoneDark);
    rk.position.set(x,0.15,z); rk.rotation.set(Math.random(),Math.random()*3,Math.random());
    rk.scale.y=0.7; shadows(rk); scene.add(rk); }
  const grass=new THREE.InstancedMesh(new THREE.ConeGeometry(0.03,0.15,5),
    std({color:0x3a5a2c, roughness:1}), 240);
  const dm=new THREE.Object3D();
  for(let i=0;i<240;i++){ let x,z,tries=0;
    do{ const a=Math.random()*Math.PI*2, r=1+Math.random()*13; x=Math.cos(a)*r; z=Math.sin(a)*r; tries++;
    }while((Math.hypot(x,z)<1.3||Math.hypot(x-PC.x,z-PC.z)<4)&&tries<20);
    dm.position.set(x,0.07,z); dm.rotation.set((Math.random()-.5)*0.4,Math.random()*3,(Math.random()-.5)*0.4);
    dm.scale.setScalar(0.6+Math.random()); dm.updateMatrix(); grass.setMatrixAt(i,dm.matrix); }
  scene.add(grass);
  // jamur bercahaya dekat wraith
  [[5.9,2.1],[6.7,4.3],[5.4,3.9]].forEach(([x,z],i)=>{ const m=new THREE.Group();
    const st=new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.028,0.09,7), M.bone); st.position.y=0.045; m.add(st);
    const cp=new THREE.Mesh(new THREE.SphereGeometry(0.05,10,8),
      std({color:0x38e0c8, emissive:0x1fd0b0, emissiveIntensity:1.3, roughness:.4}));
    cp.scale.y=0.55; cp.position.y=0.09; m.add(cp);
    m.position.set(x,0,z); m.scale.setScalar(0.7+i*0.35); scene.add(m); });
  // kunang-kunang
  const FN=42, fp=new Float32Array(FN*3), fbase=[];
  for(let i=0;i<FN;i++){ const a=Math.random()*Math.PI*2, r=3+Math.random()*7;
    const x=Math.cos(a)*r, z=Math.sin(a)*r, y=0.4+Math.random()*1.5;
    fp.set([x,y,z],i*3); fbase.push([x,y,z,Math.random()*7]); }
  const fg=new THREE.BufferGeometry(); fg.setAttribute('position', new THREE.BufferAttribute(fp,3));
  const flies=new THREE.Points(fg, new THREE.PointsMaterial({map:texSpark, color:0xd8ffa0, size:0.09,
    transparent:true, blending:THREE.AdditiveBlending, depthWrite:false}));
  scene.add(flies);
  updaters.push((t)=>{ const p=fg.attributes.position;
    for(let i=0;i<FN;i++){ const [bx,by,bz,o]=fbase[i];
      p.setXYZ(i, bx+Math.sin(t*0.7+o)*0.5, by+Math.sin(t*1.3+o*2)*0.35, bz+Math.cos(t*0.6+o)*0.5); }
    p.needsUpdate=true; flies.material.opacity=0.7+0.3*Math.sin(t*2.2); });
  // batu jalan setapak
  for(let i=1;i<=4;i++){ const f=i/5;
    const s=new THREE.Mesh(new THREE.CylinderGeometry(0.16+Math.random()*0.07,0.18,0.04,7), M.stoneDark);
    s.position.set(4.3*f+(Math.random()-.5)*0.2, 0.02, 1.4*f+(Math.random()-.5)*0.2);
    s.rotation.y=Math.random()*3; s.receiveShadow=true; scene.add(s); }
}

/* ================= CAHAYA ================= */
scene.add(new THREE.HemisphereLight(0x26355f, 0x1a1410, 0.6));
scene.add(new THREE.AmbientLight(0x101322, 0.6));
const moonLight=new THREE.DirectionalLight(0x9db4ff, 0.9);
moonLight.position.set(-14,20,-10); moonLight.castShadow=true;
moonLight.shadow.mapSize.set(2048,2048);
moonLight.shadow.camera.left=-14; moonLight.shadow.camera.right=14;
moonLight.shadow.camera.top=14; moonLight.shadow.camera.bottom=-14;
moonLight.shadow.camera.far=60; moonLight.shadow.bias=-0.0004;
scene.add(moonLight);

/* ================= SUSUN DUNIA ================= */
buildEnvironment();
const modelRoots=[], rings=[];
function register(root, name, icon, dist, h, opts={}){
  root.userData.isModel=true; root.userData.name=name;
  if(!opts.noClick) root.userData.tip='Klik untuk fokus kamera';
  shadows(root); scene.add(root);
  modelRoots.push(root);
  let ring=null;
  if(!opts.track){ const rc=new THREE.Mesh(new THREE.RingGeometry(opts.ringR||1, (opts.ringR||1)+0.06, 48),
      new THREE.MeshBasicMaterial({color:0xffb45e, transparent:true, opacity:0,
        blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide}));
    ring=rc; rc.rotation.x=-Math.PI/2; rc.position.y=0.03; scene.add(rc); rings.push(rc); }
  ENTRIES.push({name, icon, obj:root, dist, h, track:!!opts.track, ring});
  return root;
}
const ENTRIES=[];

const campfire=createCampfire(); register(campfire,'Api Unggun','🔥',3.4,0.7,{ringR:1.0});
const barrels=createBarrels(); barrels.position.set(2.9,0,4.6); faceCenter(barrels);
register(barrels,'Tong Kayu','🛢️',2.4,0.5,{ringR:1.3});
const tableSet=createTableSet(); tableSet.position.set(4.3,0,1.4); tableSet.rotation.y=-0.35;
register(tableSet,'Meja & Kursi','🪑',3.4,0.8,{ringR:1.6});
const arrows=createArrowScene(); arrows.position.set(4.5,0,-3.3); faceCenter(arrows);
register(arrows,'Panah','🏹',2.4,0.5,{ringR:1.0});

const boat=createBoat(); boat.position.set(-6.3,0.34,-2.2); boat.rotation.y=0.7;
register(boat,'Perahu Kayu','⛵',3.8,0.4,{ringR:0});
updaters.push((t)=>{ boat.position.y=0.34+Math.sin(t*1.2)*0.045;
  boat.rotation.z=Math.sin(t*0.9)*0.035; boat.rotation.x=Math.sin(t*0.7+1)*0.025; });

const chest=createChest(); chest.position.set(-3.1,0,3.3); faceCenter(chest);
register(chest,'Peti Harta Karun','💰',2.3,0.45,{ringR:0.8});
chest.userData.tip='Klik untuk buka/tutup';


const golem=createGolem(); golem.position.set(-0.6,0,-6.6); faceCenter(golem);
register(golem,'Monster Batu','🗿',4.4,1.1,{ringR:1.3});

const wraith=createWraith(); wraith.position.set(6.8,0,3.4); faceCenter(wraith);
wraith.userData.baseRotY=wraith.rotation.y;
register(wraith,'Monster Hitam','👻',3.2,1.0,{ringR:0.8});

const batRig=createBat();
const batOrbit=new THREE.Group(); scene.add(batOrbit);
batOrbit.add(batRig.g); batRig.g.position.set(5.4,3.1,0); batRig.g.rotation.y=Math.PI;
shadows(batRig.g);
batRig.g.userData.isModel=true; batRig.g.userData.name='Monster Kelelawar';
modelRoots.push(batRig.g);
ENTRIES.push({name:'Monster Kelelawar', icon:'🦇', obj:batRig.g, dist:2.8, h:0, track:true, ring:null});
updaters.push((t)=>{ batOrbit.rotation.y=t*0.45;
  batRig.g.position.y=3.1+Math.sin(t*2.1)*0.35;
  const f=Math.sin(t*9)*0.55;
  batRig.P.wR.rotation.z=f; batRig.P.wL.rotation.z=-f;
  batRig.g.rotation.z=Math.sin(t*2.1)*0.16; batRig.g.rotation.x=Math.sin(t*9)*0.05; });

const rabbit=createRabbit(); scene.add(rabbit); shadows(rabbit);
rabbit.userData.isModel=true; rabbit.userData.name='Kelinci';
modelRoots.push(rabbit);
ENTRIES.push({name:'Kelinci', icon:'🐇', obj:rabbit, dist:1.9, h:0.25, track:true, ring:null});

// posisi ring highlight
function placeRing(e){ if(!e.ring) return; const p=new THREE.Vector3(); e.obj.getWorldPosition(p);
  e.ring.position.x=p.x; e.ring.position.z=p.z; }
ENTRIES.forEach(placeRing);

/* ================= UI & INTERAKSI ================= */
const chipsEl=document.getElementById('chips'), tipEl=document.getElementById('tip');
const btnOrbit=document.getElementById('btnOrbit'), btnReset=document.getElementById('btnReset');
let orbitOn=true;
btnOrbit.onclick=()=>{ orbitOn=!orbitOn; btnOrbit.classList.toggle('on',orbitOn); };
ENTRIES.forEach((e,i)=>{ const b=document.createElement('button'); b.className='chip';
  b.innerHTML=`<span class="ic">${e.icon}</span>${e.name}`;
  b.onclick=()=>focusOn(e); e.chip=b; chipsEl.appendChild(b); });
const vista={name:'Pandangan Awal', obj:new THREE.Object3D(), dist:13, h:0.7,
  dir:new THREE.Vector3(1,0,0.95).normalize(), chip:null};
scene.add(vista.obj);
btnReset.onclick=()=>focusOn(vista);

let fly=null;
function focusOn(e){
  const p=new THREE.Vector3(); e.obj.getWorldPosition(p); p.y+=e.h||0;
  let dir; if(e.dir) dir=e.dir.clone();
  else { dir=p.clone().setY(0); if(dir.lengthSq()<0.01) dir.set(1,0,1); dir.normalize(); }
  const off=dir.clone().multiplyScalar(e.dist).add(new THREE.Vector3(0,e.dist*0.5,0));
  ENTRIES.forEach(x=>x.chip&&x.chip.classList.remove('on'));
  if(e.chip) e.chip.classList.add('on');
  fly={t:0, dur:1.6, entry:e, off,
    fromP:camera.position.clone(), toP:p.clone().add(off),
    fromT:controls.target.clone(), toT:p.clone()};
  controls.autoRotate=false;
}
const ease=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
setTimeout(()=>focusOn(vista), 300);

const ray=new THREE.Raycaster(), ptr=new THREE.Vector2();
let hovered=null, mx=0, my=0;
addEventListener('pointermove',e=>{ mx=e.clientX; my=e.clientY;
  ptr.x=e.clientX/innerWidth*2-1; ptr.y=-(e.clientY/innerHeight)*2+1; });
addEventListener('click',()=>{ if(!hovered) return;
  const e=ENTRIES.find(x=>x.obj===hovered);
  if(hovered.userData.onClick) hovered.userData.onClick();
  if(e) focusOn(e); });

function updateHover(){
  ray.setFromCamera(ptr,camera);
  const hits=ray.intersectObjects(modelRoots,true);
  let root=null;
  if(hits.length){ let o=hits[0].object;
    while(o&&!o.userData.isModel) o=o.parent; root=o; }
  if(root!==hovered){ hovered=root;
    renderer.domElement.style.cursor=root?'pointer':'grab';
    if(root){ tipEl.innerHTML=`${root.userData.name}<small>${root.userData.tip||'Klik untuk fokus'}</small>`;
      tipEl.style.opacity=1; } else tipEl.style.opacity=0; }
  if(hovered) { tipEl.style.left=mx+'px'; tipEl.style.top=my+'px'; }
  ENTRIES.forEach(e=>{ if(!e.ring) return;
    const target=(hovered===e.obj)?0.85:0;
    e.ring.material.opacity+=(target-e.ring.material.opacity)*0.15;
    e.ring.rotation.z+=0.01; });
  modelRoots.forEach(r=>{ const tgt=(hovered===r)?1.035:1;
    const base=r.userData.baseScale||(r.userData.baseScale=r.scale.x);
    const ns=r.scale.x+(tgt*base-r.scale.x)*0.15;
    if(!r.userData.isRabbit) r.scale.setScalar(ns); });
}

/* ================= LOOP ================= */
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05), t=clock.elapsedTime;
  updaters.forEach(f=>f(t,dt));
  updateHover();
  if(fly){ fly.t+=dt/fly.dur; const k=ease(Math.min(1,fly.t));
    if(fly.entry.track){ const p=new THREE.Vector3(); fly.entry.obj.getWorldPosition(p);
      p.y+=fly.entry.h||0; fly.toT.copy(p); fly.toP.copy(p).add(fly.off); }
    camera.position.lerpVectors(fly.fromP,fly.toP,k);
    controls.target.lerpVectors(fly.fromT,fly.toT,k);
    if(fly.t>=1){ fly=null; controls.autoRotate=orbitOn; } }
  controls.update();
  renderer.render(scene,camera);
}
animate();
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
</script>
